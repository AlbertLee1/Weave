  /api/v2/ontologies/{ontologyApiName}/interfaces/{interfaceRid}/objectTypes:
    get:
      operationId: listInterfaceObjectTypes
      summary: List ObjectTypes implementing an Interface (round 75)
      description: |
        Forward direction of the ObjectType↔Interface m:n relationship.
        Returns every ObjectType in the ontology whose attachment row
        references this Interface. The reverse direction (which
        Interfaces does ObjectType X implement) was already exposed at
        /objectTypes/byRid/{otRid}/interfaces; round 75 closes the
        symmetry gap so the Interface admin UI can render its
        implementor list without scanning every ObjectType and
        calling the reverse direction N times.

        Filter-not-key semantics: an unknown interfaceRid returns 200
        + {data: []} rather than 404 — matches the SPA list-panel
        convention of rendering cleanly against brand-new entities.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: interfaceRid
          required: true
          description: Interface RID whose implementing ObjectTypes to list.
