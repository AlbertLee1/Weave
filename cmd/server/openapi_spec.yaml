openapi: 3.0.3
info:
  title: Weave Ontology API
  version: 1.0.0
  description: |
    Weave is a single-machine Ontology Layer engine inspired by Palantir Foundry OSv2.
    This document describes its REST API: ontology metadata, object retrieval and
    search, ObjectSet composition, aggregation, link traversal, action execution,
    and authentication.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development (port configurable via WEAVE_PORT).
tags:
  - name: Health
    description: Liveness/readiness probes.
  - name: Observability
    description: Prometheus metrics scrape endpoint.
  - name: Auth
    description: JWT login, refresh, and logout.
  - name: Metadata
    description: Read-only ontology metadata (V2).
  - name: Objects
    description: Object retrieval, search, listing, and link traversal.
  - name: ObjectSets
    description: Composable object set definitions and aggregation.
  - name: Actions
    description: Apply and apply-batch action execution.
  - name: MCP
    description: |
      Model Context Protocol (JSON-RPC 2.0) endpoint for AI agents.
      See https://modelcontextprotocol.io/specification for the protocol
      contract; Weave's tool catalogue is documented in docs/mcp.md.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256-signed JWT issued via /api/auth/login. Send as
        `Authorization: Bearer <token>`.
    apiKey:
      type: apiKey
      in: header
      name: X-Weave-Api-Key
      description: Reserved for future API-key-based service-to-service auth.
  responses:
    BadRequestError:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The caller is authenticated but lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    OntologyApiName:
      in: path
      name: ontologyApiName
      required: true
      description: API name (or RID) of the ontology.
      schema:
        type: string
    OntologyRid:
      in: path
      name: ontologyRid
      required: true
      description: Resource identifier of the ontology.
      schema:
        type: string
    ObjectTypeApiName:
      in: path
      name: objectTypeApiName
      required: true
      description: API name of the object type.
      schema:
        type: string
    ObjectTypeRid:
      in: path
      name: objectTypeRid
      required: true
      description: Resource identifier of the object type.
      schema:
        type: string
    ObjectType:
      in: path
      name: objectType
      required: true
      description: API name of the object type.
      schema:
        type: string
    PrimaryKey:
      in: path
      name: primaryKey
      required: true
      description: Primary key of the object.
      schema:
        type: string
    PropertyRid:
      in: path
      name: propertyRid
      required: true
      description: Resource identifier of the property.
      schema:
        type: string
    LinkTypeRid:
      in: path
      name: linkTypeRid
      required: true
      description: Resource identifier of the link type.
      schema:
        type: string
    ActionTypeRid:
      in: path
      name: actionTypeRid
      required: true
      description: Resource identifier of the action type.
      schema:
        type: string
    InterfaceRid:
      in: path
      name: interfaceRid
      required: true
      description: Resource identifier of the interface.
      schema:
        type: string
    SharedPropertyRid:
      in: path
      name: sharedPropertyRid
      required: true
      description: Resource identifier of the shared property.
      schema:
        type: string
    TypeGroupRid:
      in: path
      name: typeGroupRid
      required: true
      description: Resource identifier of the type group.
      schema:
        type: string
    ValueTypeRid:
      in: path
      name: valueTypeRid
      required: true
      description: Resource identifier of the value type.
      schema:
        type: string
    InterfaceType:
      in: path
      name: interfaceType
      required: true
      description: API name or RID of the interface type.
      schema:
        type: string
    ValueType:
      in: path
      name: valueType
      required: true
      description: API name or RID of the value type.
      schema:
        type: string
    PreviewRequired:
      in: query
      name: preview
      required: true
      description: Must be set to "true" for preview endpoints.
      schema:
        type: string
        enum: ["true"]
    DatasourceBindingRid:
      in: path
      name: datasourceBindingRid
      required: true
      description: Resource identifier of the datasource binding.
      schema:
        type: string
    SecurityPolicyRid:
      in: path
      name: securityPolicyRid
      required: true
      description: Resource identifier of the security policy.
      schema:
        type: string
    QueryTypeRid:
      in: path
      name: queryTypeRid
      required: true
      description: Resource identifier of the query type.
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      description: Palantir-style API error envelope.
      required: [errorCode, errorName, errorInstanceId, parameters]
      properties:
        errorCode:
          type: string
          example: NOT_FOUND
        errorName:
          type: string
          example: OntologyNotFound
        errorInstanceId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties:
            type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Ontology:
      type: object
      required: [rid, apiName, displayName, currentVersion]
      properties:
        rid:
          type: string
          example: ri.ontology.main.ontology.northwind
        apiName:
          type: string
          example: northwind
        displayName:
          type: string
        description:
          type: string
        currentVersion:
          type: integer
    ObjectType:
      type: object
      required: [rid, apiName, displayName, primaryKey, status, visibility]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
        titleProperty:
          type: string
        status:
          type: string
        visibility:
          type: string
        icon:
          type: string
        color:
          type: string
        deprecatedReason:
          type: string
        deprecatedDeadline:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PropertyDataType"
    PropertyDataType:
      type: object
      properties:
        dataType:
          type: object
          additionalProperties: true
        rid:
          type: string
    Property:
      type: object
      required: [rid, apiName, baseType]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        status:
          type: string
        deprecatedReason:
          type: string
        sharedPropertyRid:
          type: string
    LinkType:
      type: object
      required: [rid, apiName, displayName, objectTypeApiName, linkedObjectTypeApiName, cardinality, required]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        objectTypeApiName:
          type: string
        linkedObjectTypeApiName:
          type: string
        cardinality:
          type: string
        foreignKeyConfig:
          type: object
          additionalProperties: true
        joinTableConfig:
          type: object
          additionalProperties: true
        required:
          type: boolean
    ActionType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          type: object
          description: "Record<ParameterId, ActionParameterV2>"
          additionalProperties:
            $ref: '#/components/schemas/ActionParameterV2'
        rules:
          type: object
          additionalProperties: true
        submissionCriteria:
          type: object
          additionalProperties: true
        sideEffects:
          type: object
          additionalProperties: true
        functionRid:
          type: string
        isFunctionBacked:
          type: boolean
    ActionParameterV2:
      type: object
      required: [dataType, required]
      properties:
        dataType:
          type: object
          description: "DataType object, e.g. {type: 'string'} or {type: 'array', subType: {type: 'string'}}"
          properties:
            type:
              type: string
          additionalProperties: true
        required:
          type: boolean
        description:
          type: string
    Interface:
      type: object
      required: [rid, apiName, displayName]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: object
          additionalProperties: true
    ObjectTypeInterface:
      type: object
      required: [objectTypeRid, interfaceRid]
      properties:
        objectTypeRid:
          type: string
        interfaceRid:
          type: string
        propertyMapping:
          type: object
          additionalProperties: true
    SharedProperty:
      type: object
      required: [rid, apiName, baseType]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
    TypeGroup:
      type: object
      required: [rid, apiName, displayName]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        color:
          type: string
    DatasourceBinding:
      type: object
      required: [rid, datasetRid, branch, isPrimary]
      properties:
        rid:
          type: string
        datasetRid:
          type: string
        branch:
          type: string
        columnMapping:
          type: object
          additionalProperties: true
        isPrimary:
          type: boolean
    SecurityPolicy:
      type: object
      required: [rid, objectTypeRid, policyType]
      properties:
        rid:
          type: string
        objectTypeRid:
          type: string
        policyType:
          type: string
          enum: [OBJECT, PROPERTY]
        rules:
          type: object
          additionalProperties: true
    QueryType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        query:
          type: object
          additionalProperties: true
        status:
          type: string
    ValueType:
      type: object
      required: [rid, apiName, displayName, baseType, version]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        baseType:
          type: string
        constraints:
          type: object
          additionalProperties: true
        version:
          type: integer
    ActionLog:
      type: object
      required: [id, actionTypeRid, userId, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actionTypeRid:
          type: string
        userId:
          type: string
        parameters:
          type: object
          additionalProperties: true
        edits:
          type: array
          items:
            type: object
            additionalProperties: true
        status:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
    OntologySnapshot:
      type: object
      required: [id, ontologyRid, version, createdBy, createdAt]
      properties:
        id:
          type: integer
          format: int64
        ontologyRid:
          type: string
        version:
          type: integer
        label:
          type: string
        description:
          type: string
        snapshot:
          type: object
          additionalProperties: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    OntologyExport:
      type: object
      required: [ontology, objectTypes, linkTypes, actionTypes, interfaces]
      properties:
        ontology:
          $ref: "#/components/schemas/Ontology"
        objectTypes:
          type: array
          items:
            $ref: "#/components/schemas/ObjectType"
        linkTypes:
          type: array
          items:
            $ref: "#/components/schemas/LinkType"
        actionTypes:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/Interface"
    SearchResult:
      type: object
      required: [rid, resourceType, apiName, displayName]
      properties:
        rid:
          type: string
        resourceType:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
    OntologyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ontology"
    ObjectTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ObjectType"
    LinkTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LinkType"
    ActionTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
    InterfaceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Interface"
    SharedPropertyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SharedProperty"
    TypeGroupListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TypeGroup"
    ValueTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ValueType"
    DatasourceBindingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceBinding"
    SecurityPolicyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecurityPolicy"
    QueryTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueryType"
    ActionLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActionLog"
    SnapshotListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OntologySnapshot"
    SearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    WireObject:
      type: object
      description: |
        Palantir V2 wire format for an object: properties are flattened at the
        top level alongside __rid, __primaryKey, and __apiName.
      additionalProperties: true
      properties:
        __rid:
          type: string
        __primaryKey: {}
        __apiName:
          type: string
    ObjectPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
    SearchObjectsRequest:
      type: object
      properties:
        where:
          type: object
          additionalProperties: true
          description: WhereClause filter (see pkg/oss/where).
        select:
          type: array
          items:
            type: string
        pageSize:
          type: integer
        pageToken:
          type: string
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
    ObjectSetDefinition:
      type: object
      description: |
        Composable ObjectSet definition. Supported types include base, filter,
        union, intersect, subtract, and searchAround. See pkg/oss/objectset.
      additionalProperties: true
      properties:
        type:
          type: string
    LoadObjectSetRequest:
      type: object
      required: [objectSet]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        select:
          type: array
          items:
            type: string
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
        pageSize:
          type: integer
        pageToken:
          type: string
        snapshot:
          type: boolean
    LoadObjectSetResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    AggregationSpec:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [count, min, max, sum, avg, approximateDistinct, standardDeviation, variance, approximatePercentile]
        field:
          type: string
        name:
          type: string
        percentile:
          type: number
    GroupBySpec:
      type: object
      required: [type, field]
      properties:
        type:
          type: string
          enum: [exact, fixedWidth, range, ranges, duration, topValues]
        field:
          type: string
        maxGroupCount:
          type: integer
        fixedWidth:
          type: number
        ranges:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              startValue:
                type: number
              endValue:
                type: number
        duration:
          type: string
        value:
          type: object
          properties:
            unit:
              type: string
              enum: [SECONDS, MINUTES, HOURS, DAYS, WEEKS, MONTHS, YEARS]
            value:
              type: number
    AggregationRequest:
      type: object
      required: [aggregation]
      properties:
        objectType:
          type: string
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
    AggregationRow:
      type: object
      properties:
        group:
          type: object
          additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
    AggregationResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AggregationRow"
        accuracy:
          type: string
          enum: [ACCURATE, APPROXIMATE]
        computeUsage:
          type: number
    AggregateObjectSetRequest:
      type: object
      required: [objectSet, aggregation]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
    CreateTemporaryRequest:
      type: object
      required: [objectSet]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
    CreateTemporaryResponse:
      type: object
      properties:
        objectSetRid:
          type: string
    Edit:
      type: object
      description: A single edit produced by action execution.
      additionalProperties: true
      properties:
        type:
          type: string
          enum: [CREATE, MODIFY, DELETE]
    ApplyActionRequest:
      type: object
      description: |
        Foundry OSv2 action body — the action API name is in the URL path
        segment {action}, not the body. Only parameters travel here.
      properties:
        parameters:
          type: object
          additionalProperties: true
    ApplyActionResponse:
      type: object
      properties:
        actionRid:
          type: string
        edits:
          type: array
          items:
            $ref: "#/components/schemas/Edit"
        batchId:
          type: string
        offset:
          type: integer
          format: int64
    BatchFailure:
      type: object
      properties:
        index:
          type: integer
        actionType:
          type: string
        phase:
          type: string
        message:
          type: string
    ApplyBatchRequest:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ApplyActionRequest"
        mode:
          type: string
          enum: [atomic, bestEffort]
          default: atomic
    ApplyBatchResponse:
      type: object
      properties:
        mode:
          type: string
        batchId:
          type: string
        offset:
          type: integer
          format: int64
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplyActionResponse"
        appliedEdits:
          type: array
          items:
            $ref: "#/components/schemas/Edit"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/BatchFailure"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginUser:
      type: object
      required: [id, email, name, roles, ontologyRoles]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ontologyRoles:
          type: object
          additionalProperties:
            type: string
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/LoginUser"
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      $ref: "#/components/schemas/LoginResponse"
    User:
      type: object
      required: [id, roles, ontologyRoles, permissions]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ontologyRoles:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
    CreateOntologyRequest:
      type: object
      required: [apiName, displayName]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
    UpdateOntologyRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
    CreateObjectTypeRequest:
      type: object
      required: [apiName, displayName, primaryKey]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
        titleProperty:
          type: string
        status:
          type: string
        visibility:
          type: string
        icon:
          type: string
        color:
          type: string
    UpdateObjectTypeRequest:
      type: object
      additionalProperties: true
    CreatePropertyRequest:
      type: object
      required: [apiName, baseType]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
    UpdatePropertyRequest:
