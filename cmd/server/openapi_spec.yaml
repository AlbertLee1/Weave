          description: Updated target graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraph"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/templates/{rid}/instantiate:
    post:
      operationId: instantiateVertexGraphTemplate
      summary: Instantiate a Vertex graph template
      description: |
        Applies optional parameter values to a saved graph template and returns
