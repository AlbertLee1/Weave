    WireObject:
      type: object
      description: |
        Palantir V2 wire format for an object: properties are flattened at the
        top level alongside __rid, __primaryKey, and __apiName.
      additionalProperties: true
      properties:
        __rid:
          type: string
        __primaryKey: {}
        __apiName:
          type: string
    ObjectPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
    SearchObjectsRequest:
      type: object
      required: [select]
      properties:
        where:
          type: object
          additionalProperties: true
          description: WhereClause filter (see pkg/oss/where).
        select:
          type: array
          items:
            type: string
          description: Required list of property apiNames to return.
        pageSize:
          type: integer
        pageToken:
          type: string
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
    ObjectSetDefinition:
      type: object
      description: |
        Composable ObjectSet definition. Supported types: base, static, filter,
        union, intersect, subtract, searchAround, reference, nearestNeighbors,
        withProperties, asType, asBaseObjectTypes, interfaceBase,
        interfaceLinkSearchAround, methodInput. See pkg/oss/objectset.
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
          enum:
            - base
            - static
            - filter
            - union
            - intersect
            - subtract
            - searchAround
            - reference
            - nearestNeighbors
            - withProperties
            - asType
            - asBaseObjectTypes
            - interfaceBase
            - interfaceLinkSearchAround
            - methodInput
        objectType:
          type: string
          description: Used by base, static, and asType.
        objectSet:
          description: Inner objectSet used by filter, searchAround, withProperties, asType, asBaseObjectTypes, interfaceLinkSearchAround.
          $ref: "#/components/schemas/ObjectSetDefinition"
        objectSets:
          type: array
          description: Used by union, intersect, subtract.
          items:
            $ref: "#/components/schemas/ObjectSetDefinition"
        primaryKeys:
          type: array
          description: Used by static — explicit list of primary keys of objectType.
          items:
            type: string
        interfaceType:
          type: string
          description: Used by interfaceBase — interface API name whose implementing object types form the base set.
        interfaceLink:
          type: string
          description: Used by interfaceLinkSearchAround — interface link API name to traverse.
        input:
          type: string
          description: Used by methodInput — name of the function method input parameter bound at invocation time.
    LoadObjectSetRequest:
      type: object
      required: [objectSet, select]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        select:
          type: array
          items:
            type: string
          description: Required list of property apiNames to return.
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
        pageSize:
          type: integer
        pageToken:
          type: string
        snapshot:
          type: boolean
    LoadObjectSetResponse:
      type: object
      properties:
        data:
          type: array
          items:
