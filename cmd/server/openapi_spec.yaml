        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/import:
    post:
      operationId: importOntology
      summary: Import ontology definitions from JSON
      description: Imports ontology definitions from JSON with merge or replace mode. Merge mode creates missing entities and updates existing ones. Replace mode drops all existing entities for the ontology and recreates from import. New RIDs are generated for imported entities and cross-references are remapped.
