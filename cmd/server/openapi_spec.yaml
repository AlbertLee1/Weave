                  $ref: "#/components/schemas/TimeSeriesPoint"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/geotemporalSeries/{propertyName}/latestValue:
    get:
      operationId: getGeotemporalLatestValue
      summary: Get the latest value of a geotemporal series property
      description: |
        Returns the most recent GeotemporalSeriesValue for the given
        object's GeotemporalSeriesProperty. The wire shape is
        `{time, position}` where position is a GeoJSON Point.
      tags: [GeotemporalSeriesProperty]
      parameters:
