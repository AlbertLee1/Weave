        - in: path
          name: primaryKey
          required: true
          schema:
            type: string
        - in: path
          name: propertyName
          required: true
          description: TimeSeriesValueBankProperty API name on the object type.
          schema:
            type: string
      responses:
        "200":
          description: Latest value in the series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeriesPoint"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/timeseries/{property}/streamValues:
    post:
      operationId: streamTimeSeriesValues
      summary: Stream every value of a time series value bank property
      description: |
        Returns every value in the series ordered by time ascending. The
        optional `format` query parameter mirrors Foundry's JSON/ARROW
        toggle; this server only emits JSON and rejects `format=ARROW`
        with 400 UnsupportedFormat.
      tags: [TimeSeriesValueBankProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
