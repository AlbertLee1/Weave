          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/PermissionDeniedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/proposals/{proposalId}/reject:
    post:
      operationId: rejectProposal
      summary: Reject a proposal
      description: Adds a rejection review to the proposal with a reason. Self-review is forbidden (returns 403).
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Proposal with updated status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/PermissionDeniedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/proposals/{proposalId}/merge:
    post:
      operationId: mergeProposal
      summary: Merge an approved proposal into main
      description: Applies all branch changes to main tables. Only approved proposals can be merged. Returns 409 with conflict list if entities were modified on both main and branch.
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal merged successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Proposal not approved or merge conflict detected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
