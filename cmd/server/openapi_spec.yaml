openapi: 3.0.3
info:
  title: Weave Ontology API
  version: 1.0.0
  description: |
    Weave is a single-machine Ontology Layer engine aligned with Palantir Foundry OSv2.
    This document describes its REST API: ontology metadata, object retrieval and
    search, ObjectSet composition, aggregation, link traversal, action execution,
    and authentication.
  license:
    name: Proprietary
servers:
  - url: http://localhost:9117
    description: Local development (port configurable via WEAVE_PORT).
tags:
  - name: Health
    description: Liveness/readiness probes.
  - name: Observability
    description: Prometheus metrics scrape endpoint.
  - name: Auth
    description: JWT login, refresh, and logout.
  - name: Metadata
    description: Read-only ontology metadata (V2).
  - name: Objects
    description: Object retrieval, search, listing, and link traversal.
  - name: ObjectSets
    description: Composable object set definitions and aggregation.
  - name: Actions
    description: Apply and apply-batch action execution.
  - name: MCP
    description: |
      Model Context Protocol (JSON-RPC 2.0) endpoint for AI agents.
      See https://modelcontextprotocol.io/specification for the protocol
      contract; Weave's tool catalogue is documented in docs/mcp.md.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256-signed JWT issued via /api/auth/login. Send as
        `Authorization: Bearer <token>`.
    apiKey:
      type: apiKey
      in: header
      name: X-Weave-Api-Key
      description: Reserved for future API-key-based service-to-service auth.
  responses:
    BadRequestError:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The caller is authenticated but lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    OntologyApiName:
      in: path
      name: ontologyApiName
      required: true
      description: API name (or RID) of the ontology.
      schema:
        type: string
    ObjectTypeApiName:
      in: path
      name: objectTypeApiName
      required: true
      description: API name of the object type.
      schema:
        type: string
    ObjectType:
      in: path
      name: objectType
      required: true
      description: API name of the object type.
      schema:
        type: string
    PrimaryKey:
      in: path
      name: primaryKey
      required: true
      description: Primary key of the object.
      schema:
        type: string
    ActionTypeRid:
      in: path
      name: actionTypeRid
      required: true
      description: Resource identifier (or API name) of the action type.
      schema:
        type: string
    InterfaceType:
      in: path
      name: interfaceType
      required: true
      description: API name or RID of the interface type.
      schema:
        type: string
    InterfaceLinkType:
      in: path
      name: interfaceLinkType
      required: true
      description: API name of the interface link type.
      schema:
        type: string
    ValueType:
      in: path
      name: valueType
      required: true
      description: API name or RID of the value type.
      schema:
        type: string
    PreviewRequired:
      in: query
      name: preview
      required: true
      description: Must be set to "true" for preview endpoints.
      schema:
        type: string
        enum: ["true"]
  schemas:
    ErrorResponse:
      type: object
      description: Palantir-style API error envelope.
      required: [errorCode, errorName, errorInstanceId, parameters]
      properties:
        errorCode:
          type: string
          example: NOT_FOUND
        errorName:
          type: string
          example: OntologyNotFound
        errorInstanceId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties:
            type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Ontology:
      type: object
      required: [rid, apiName, displayName, currentVersion]
      properties:
        rid:
          type: string
          example: ri.ontology.main.ontology.northwind
        apiName:
          type: string
          example: northwind
        displayName:
          type: string
        description:
          type: string
        currentVersion:
          type: integer
    ObjectType:
      type: object
      required: [rid, apiName, displayName, primaryKey, status, visibility]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
        icon:
          type: string
        color:
          type: string
        deprecatedReason:
          type: string
        deprecatedDeadline:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PropertyDataType"
    PropertyDataType:
      type: object
      properties:
        dataType:
          type: object
          additionalProperties: true
        rid:
          type: string
    Property:
      type: object
      required: [rid, apiName, baseType]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        status:
          type: string
        deprecatedReason:
          type: string
        sharedPropertyRid:
          type: string
    LinkType:
      type: object
      required: [rid, apiName, displayName, objectTypeApiName, linkedObjectTypeApiName, cardinality, required]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        objectTypeApiName:
          type: string
        linkedObjectTypeApiName:
          type: string
        cardinality:
          type: string
        foreignKeyConfig:
          type: object
          additionalProperties: true
        joinTableConfig:
          type: object
          additionalProperties: true
        required:
          type: boolean
    ActionType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          type: object
          description: "Record<ParameterId, ActionParameterV2>"
          additionalProperties:
            $ref: '#/components/schemas/ActionParameterV2'
        rules:
          type: object
          additionalProperties: true
        submissionCriteria:
          type: object
          additionalProperties: true
        sideEffects:
          type: object
          additionalProperties: true
        functionRid:
          type: string
        isFunctionBacked:
          type: boolean
    ActionParameterV2:
      type: object
      required: [dataType, required]
      properties:
        dataType:
          type: object
          description: "DataType object, e.g. {type: 'string'} or {type: 'array', subType: {type: 'string'}}"
          properties:
            type:
              type: string
          additionalProperties: true
        required:
          type: boolean
        description:
          type: string
    Interface:
      type: object
      required: [rid, apiName, displayName]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: object
          additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    InterfaceLinkType:
      type: object
      required: [apiName, displayName, linkedEntityTypeApiName, cardinality, required]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        linkedEntityTypeApiName:
          type: string
        linkedEntityTypeRid:
          type: string
        cardinality:
          type: string
          enum: [ONE, MANY]
        required:
          type: boolean
        description:
          type: string
    QueryType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        query:
          type: object
          additionalProperties: true
        status:
          type: string
    ValueType:
      type: object
      required: [rid, apiName, displayName, baseType, version]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        baseType:
          type: string
        constraints:
          type: object
          additionalProperties: true
        version:
          type: integer
    ActionLog:
      type: object
      required: [id, actionTypeRid, userId, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actionTypeRid:
          type: string
        userId:
          type: string
        parameters:
          type: object
          additionalProperties: true
        edits:
          type: array
          items:
            type: object
            additionalProperties: true
        status:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
    LoadMetadataRequest:
      type: object
      description: Request body for selectively loading ontology metadata subsets. Each key present (even as empty {}) selects that subset.
      properties:
        objectTypes:
          type: object
          description: Include object types in response
        linkTypes:
          type: object
          description: Include link types in response
        actionTypes:
          type: object
          description: Include action types in response
        interfaceTypes:
          type: object
          description: Include interface types in response
        queryTypes:
          type: object
          description: Include query types in response
    OntologyFullMetadata:
      type: object
      required: [ontology]
      properties:
        ontology:
          $ref: "#/components/schemas/Ontology"
        objectTypes:
          type: array
          items:
            $ref: "#/components/schemas/ObjectType"
        linkTypes:
          type: array
          items:
            $ref: "#/components/schemas/LinkType"
        actionTypes:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
        interfaceTypes:
          type: array
          items:
            $ref: "#/components/schemas/Interface"
        queryTypes:
          type: array
          items:
            $ref: "#/components/schemas/QueryType"
    OntologyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ontology"
    ObjectTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ObjectType"
    LinkTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LinkType"
    ActionTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
    InterfaceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Interface"
    ValueTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ValueType"
    QueryTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueryType"
    ActionLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActionLog"
    WireObject:
      type: object
      description: |
        Palantir V2 wire format for an object: properties are flattened at the
        top level alongside __rid, __primaryKey, and __apiName.
      additionalProperties: true
      properties:
        __rid:
          type: string
        __primaryKey: {}
        __apiName:
          type: string
    ObjectPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
    SearchObjectsRequest:
      type: object
      required: [select]
      properties:
        where:
          type: object
          additionalProperties: true
          description: WhereClause filter (see pkg/oss/where).
        select:
          type: array
          items:
            type: string
          description: Required list of property apiNames to return.
        pageSize:
          type: integer
        pageToken:
          type: string
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
    ObjectSetDefinition:
      type: object
      description: |
        Composable ObjectSet definition. Supported types: base, static, filter,
        union, intersect, subtract, searchAround, reference, nearestNeighbors,
        withProperties, asType, asBaseObjectTypes, interfaceBase,
        interfaceLinkSearchAround, methodInput. See pkg/oss/objectset.
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
          enum:
            - base
            - static
            - filter
            - union
            - intersect
            - subtract
            - searchAround
            - reference
            - nearestNeighbors
            - withProperties
            - asType
            - asBaseObjectTypes
            - interfaceBase
            - interfaceLinkSearchAround
            - methodInput
        objectType:
          type: string
          description: Used by base, static, and asType.
        objectSet:
          description: Inner objectSet used by filter, searchAround, withProperties, asType, asBaseObjectTypes, interfaceLinkSearchAround.
          $ref: "#/components/schemas/ObjectSetDefinition"
        objectSets:
          type: array
          description: Used by union, intersect, subtract.
          items:
            $ref: "#/components/schemas/ObjectSetDefinition"
        primaryKeys:
          type: array
          description: Used by static — explicit list of primary keys of objectType.
          items:
            type: string
        interfaceType:
          type: string
          description: Used by interfaceBase — interface API name whose implementing object types form the base set.
        interfaceLink:
          type: string
          description: Used by interfaceLinkSearchAround — interface link API name to traverse.
        input:
          type: string
          description: Used by methodInput — name of the function method input parameter bound at invocation time.
    LoadObjectSetRequest:
      type: object
      required: [objectSet, select]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        select:
          type: array
          items:
            type: string
          description: Required list of property apiNames to return.
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
        pageSize:
          type: integer
        pageToken:
          type: string
        snapshot:
          type: boolean
    LoadObjectSetResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    LoadObjectSetV2MultipleObjectTypesResponse:
      type: object
      description: |
        Preview response envelope used by loadObjectsMultipleObjectTypes and
        loadObjectsOrInterfaces. Each data item is a flat object whose keys
        include the requested properties plus $rid, $primaryKey and $apiName.
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Flat object with $rid/$primaryKey/$apiName plus selected properties.
        nextPageToken:
          type: string
        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    LoadLinksRequest:
      type: object
      required: [objectSet, linkTypeApiName]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        linkTypeApiName:
          type: string
          description: The API name of the link type to traverse
        select:
          type: array
          items:
            type: string
        pageSize:
          type: integer
        pageToken:
          type: string
    AggregationSpec:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [count, min, max, sum, avg, approximateDistinct, standardDeviation, variance, approximatePercentile]
        field:
          type: string
        name:
          type: string
        percentile:
          type: number
    GroupBySpec:
      type: object
      required: [type, field]
      properties:
        type:
          type: string
          enum: [exact, fixedWidth, range, ranges, duration, topValues]
        field:
          type: string
        maxGroupCount:
          type: integer
        fixedWidth:
          type: number
        ranges:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              startValue:
                type: number
              endValue:
                type: number
        duration:
          type: string
        value:
          type: object
          properties:
            unit:
              type: string
              enum: [SECONDS, MINUTES, HOURS, DAYS, WEEKS, MONTHS, YEARS]
            value:
              type: number
    AggregationRequest:
      type: object
      required: [aggregation]
      properties:
        objectType:
          type: string
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
    AggregationRow:
      type: object
      properties:
        group:
          type: object
          additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
    CountObjectsResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: The number of objects of the given type.
    AggregationResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AggregationRow"
        accuracy:
          type: string
          enum: [ACCURATE, APPROXIMATE]
        computeUsage:
          type: number
    AggregateObjectSetRequest:
      type: object
      required: [objectSet, aggregation]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
    CreateTemporaryRequest:
      type: object
      required: [objectSet]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
    CreateTemporaryResponse:
      type: object
      properties:
        objectSetRid:
          type: string
    ApplyOptions:
      type: object
      description: Options for single action apply (Foundry OSv2).
      properties:
        mode:
          type: string
          enum: [VALIDATE_ONLY, VALIDATE_AND_EXECUTE]
          default: VALIDATE_AND_EXECUTE
          description: VALIDATE_ONLY runs validation without executing; VALIDATE_AND_EXECUTE (default) runs both.
        returnEdits:
          type: string
          enum: [ALL, ALL_V2_WITH_DELETIONS, NONE]
          default: ALL
          description: Controls whether edit summaries are returned in the response.
    BatchApplyOptions:
      type: object
      description: Options for batch action apply (Foundry OSv2).
      properties:
        returnEdits:
          type: string
          enum: [ALL, NONE]
          default: ALL
          description: Controls whether edit summaries are returned in the response.
    ActionResults:
      type: object
      description: Foundry OSv2 edit summary returned in action response envelopes.
      required: [type]
      properties:
        type:
          type: string
          enum: [edits]
        addedObjectCount:
          type: integer
        modifiedObjectCount:
          type: integer
        deletedObjectCount:
          type: integer
        addedLinksCount:
          type: integer
        deletedLinksCount:
          type: integer
    ValidationResult:
      type: object
      description: Validation result returned for VALIDATE_ONLY mode.
      required: [result]
      properties:
        result:
          type: string
          enum: [VALID, INVALID]
    ApplyActionRequest:
      type: object
      description: |
        Foundry OSv2 action body — the action API name is in the URL path
        segment {action}, not the body. Only parameters and options travel here.
      properties:
        parameters:
          type: object
          additionalProperties: true
        options:
          $ref: "#/components/schemas/ApplyOptions"
    SyncApplyActionResponseV2:
      type: object
      description: Foundry OSv2 response envelope for single action apply.
      properties:
        operationId:
          type: string
        validation:
          $ref: "#/components/schemas/ValidationResult"
        edits:
          $ref: "#/components/schemas/ActionResults"
    ApplyBatchRequest:
      type: object
      description: |
        Foundry OSv2 batch apply body — the action API name is in the URL path
        segment {action}. All batch items share the same action type.
      required: [actions]
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              parameters:
                type: object
                additionalProperties: true
        options:
          $ref: "#/components/schemas/BatchApplyOptions"
    BatchApplyActionResponseV2:
      type: object
      description: Foundry OSv2 response envelope for batch action apply.
      properties:
        edits:
          $ref: "#/components/schemas/ActionResults"
    ApplyActionOverrides:
      type: object
      description: |
        Foundry OSv2 override envelope. Foundry uses this to override
        auto-generated parameters (uniqueIdentifier, currentTime). Weave
        currently only honors an explicit `parameters` override map, which is
        merged into the wrapped request's parameters (overrides win).
      properties:
        parameters:
          type: object
          additionalProperties: true
    ApplyActionWithOverridesRequest:
      type: object
      description: |
        Foundry OSv2 request body for applyWithOverrides — wraps an
        ApplyActionRequestV2 in `request` and an ApplyActionOverrides in
        `overrides`.
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/ApplyActionRequest"
        overrides:
          $ref: "#/components/schemas/ApplyActionOverrides"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginUser:
      type: object
      required: [id, email, name, roles, ontologyRoles]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ontologyRoles:
          type: object
          additionalProperties:
            type: string
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/LoginUser"
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      $ref: "#/components/schemas/LoginResponse"
    User:
      type: object
      required: [id, roles, ontologyRoles, permissions]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ontologyRoles:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
    ExecuteQueryRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
    ExecuteQueryResponse:
      type: object
      additionalProperties: true
    AttachmentV2:
      type: object
      description: |
        Foundry OSv2 attachment blob metadata record. Attachments are a
        global resource — not scoped to an ontology — and are referenced
        by ri.attachments.main.attachment.<uuid> identifiers.
      required: [rid, filename, sizeBytes, mediaType]
      properties:
        rid:
          type: string
          description: Attachment resource identifier.
          example: ri.attachments.main.attachment.01234567-89ab-cdef-0123-456789abcdef
        filename:
          type: string
          description: Original filename supplied by the uploader.
        sizeBytes:
          type: integer
          format: int64
          description: Blob size in bytes.
        mediaType:
          type: string
          description: IANA media type of the blob.
          example: image/png
    MediaMetadata:
      type: object
      description: |
        Foundry OSv2 MediaMetadata wire shape returned by the
        MediaReferenceProperty metadata endpoint.
      required: [path, sizeBytes, mediaType]
      properties:
        path:
          type: string
          description: Logical path of the media item inside its media set.
        sizeBytes:
          type: integer
          format: int64
          description: Blob size in bytes.
        mediaType:
          type: string
          description: IANA media type of the blob.
          example: image/jpeg
    MediaReference:
      type: object
      description: |
        Foundry OSv2 MediaReference wire shape. Points at a single media-set
        item and carries the mime type for convenience.
      required: [mimeType, reference]
      properties:
        mimeType:
          type: string
          example: image/png
        reference:
          type: object
          required: [type, mediaSetViewItem]
          properties:
            type:
              type: string
              enum: [mediaSetViewItem]
            mediaSetViewItem:
              type: object
              required: [mediaSetRid, mediaSetViewRid, mediaItemRid]
              properties:
                mediaSetRid:
                  type: string
                mediaSetViewRid:
                  type: string
                mediaItemRid:
                  type: string
    TimeSeriesPoint:
      type: object
      description: |
        Foundry OSv2 TimeSeriesPoint wire shape: a single (time, value)
        reading on a time series. time is ISO 8601; value is whatever the
        series stores (numeric, string, struct).
      required: [time, value]
      properties:
        time:
          type: string
          format: date-time
          description: Point timestamp (RFC3339 / ISO 8601).
          example: "2026-04-01T00:00:00Z"
        value:
          description: Point value; type depends on the series.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Kubernetes liveness probe. Always returns 200 with
        `{"status":"alive"}` regardless of downstream dependency state.
        A passing liveness check means "this process is responsive".
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: |
        Kubernetes readiness probe. Returns 200 with
        `{"status":"ready","checks":{...}}` when every configured
        dependency (PostgreSQL, NATS, Bleve) passes its probe, or 503 with
        `{"status":"unready","checks":{...}}` when any configured dependency
        fails. Dependencies that are not wired (degraded mode) are reported
        as `"skipped"` and do not cause readiness to fail.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready (or degraded mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        "503":
          description: Service is unready — at least one configured dependency probe failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unready]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics scrape endpoint
      description: |
        Exposes the Weave metric registry in Prometheus text format. The
        endpoint is intentionally unauthenticated so a sidecar / scraper
        can hit it without provisioning credentials. Disable with
        `WEAVE_METRICS_ENABLED=false` if the deployment runs in an
        untrusted network. Standard metrics include
        `weave_http_requests_total`, `weave_http_request_duration_seconds`,
        `weave_nats_publish_total`, `weave_db_query_duration_seconds`,
        `weave_bleve_search_duration_seconds`, and `weave_build_info`.
      tags: [Observability]
      security: []
      responses:
        "200":
          description: Prometheus exposition format text response.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP weave_http_requests_total Total HTTP requests handled by the Weave server.
                  # TYPE weave_http_requests_total counter
                  weave_http_requests_total{method="GET",path="/health",status="200"} 5
  /mcp:
    post:
      operationId: mcpJSONRPC
      summary: Model Context Protocol JSON-RPC 2.0 endpoint
      description: |
        Single JSON-RPC 2.0 endpoint that exposes Weave's ontology to AI
        agents (Claude Desktop, Cursor, GPT, etc.) via the Model Context
        Protocol. Supported methods:

        - `initialize` — handshake; returns protocol version, capabilities, and serverInfo
        - `tools/list` — list registered Weave tools and their input schemas
        - `tools/call` — invoke a tool by name with arguments
        - `prompts/list` — returns an empty list (Weave does not yet expose prompts)
        - `resources/list` — returns an empty list
        - `ping` — liveness check

        The seven Weave tools are: `weave_list_ontologies`,
        `weave_list_object_types`, `weave_get_object`, `weave_list_objects`,
        `weave_search_objects`, `weave_list_action_types`, and
        `weave_apply_action`. See docs/mcp.md for the full catalogue.

        Per JSON-RPC 2.0, all protocol errors (parse error, invalid request,
        method not found, invalid params, internal error, application
        error) are returned in the response envelope with HTTP 200. Non-200
        status codes are reserved for transport-level failures.
      tags: [MCP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                JSON-RPC 2.0 request envelope. The `id` field is required for
                requests that expect a response and omitted for notifications.
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  description: Request id (string, number, or null). Omitted for notifications.
                method:
                  type: string
                  example: tools/call
                params:
                  type: object
      responses:
        "200":
          description: |
            JSON-RPC 2.0 response envelope. Contains either a `result` or an
            `error` object — never both. Application errors travel here too.
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc]
                properties:
                  jsonrpc:
                    type: string
                    enum: ["2.0"]
                  id:
                    description: Echo of the request id (or null).
                  result:
                    type: object
                    description: Method-specific result. Present on success.
                  error:
                    type: object
                    description: JSON-RPC error object. Present on failure.
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data: {}
        "204":
          description: Notification accepted (request had no `id` field).
        "405":
          description: HTTP method other than POST.
  /api/auth/login:
    post:
      operationId: login
      summary: Issue access and refresh tokens
      description: |
        Validates credentials, mints an RS256 JWT access token and a rotating
        refresh token. Returns the user's roles, scoped ontology roles, and
        token TTL.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh token and mint a new access token
      description: |
        Rotates the supplied refresh token (from body or
        `weave_refresh` cookie) and returns a new access + refresh pair with
        freshly resolved roles.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      description: |
        Revokes the supplied refresh token (or the cookie value), clears the
        refresh cookie, and always returns 204. Idempotent.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logout completed.
