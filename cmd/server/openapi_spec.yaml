          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/scenarios/{scenarioRid}/runs:
    post:
      operationId: startVertexScenarioRun
      summary: Start a Vertex scenario run
      description: |
        Accepts a new execution of the requested Vertex scenario and returns
        the Scenario Run RID immediately. The run progresses asynchronously;
        callers poll the run resource for checkpoint, retry-attempt, and
        terminal status details.
      tags: [Vertex]
      parameters:
        - in: path
          name: scenarioRid
          required: true
          description: Vertex scenario RID to execute.
          schema:
            type: string
      responses:
        "202":
          description: Scenario run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexScenarioRunStartResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listVertexScenarioRuns
      summary: List runs for a Vertex scenario
      description: |
        Round 68. Returns every run belonging to the given scenarioRid
        sorted newest-first (StartedAt DESC) — matches the Foundry
        "Recent runs" panel ordering. Response is wrapped in `{runs:
        [...]}` so future pagination fields (nextPageToken, totalCount)
        can be added without breaking the wire contract. An unknown
        scenarioRid returns 200 + empty list rather than 404 because
        scenarioRid is a filter here, not a lookup key — the SPA's
        "Recent runs" panel renders cleanly against brand-new scenarios.
      tags: [Vertex]
      parameters:
        - in: path
          name: scenarioRid
          required: true
          description: Vertex scenario RID whose runs to list.
          schema:
            type: string
      responses:
        "200":
          description: Run list.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      type: object
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/scenarios/{scenarioRid}/runs/{runRid}:
    get:
      operationId: getVertexScenarioRun
      summary: Get a Vertex scenario run
      description: |
        Returns the persisted Scenario Run record, including status,
        checkpoint, retry attempts by activity, and terminal error or
        cancellation details when present.
      tags: [Vertex]
      parameters:
        - in: path
          name: scenarioRid
          required: true
          description: Vertex scenario RID that owns the run.
          schema:
            type: string
        - in: path
          name: runRid
          required: true
          description: Scenario Run RID to fetch.
          schema:
            type: string
      responses:
        "200":
          description: Scenario run record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexScenarioRun"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/scenarios/{scenarioRid}/runs/{runRid}/cancel:
    post:
      operationId: cancelVertexScenarioRun
      summary: Cancel a Vertex scenario run
      description: |
        Signals cancellation for an in-flight Scenario Run. The response
        acknowledges the signal; callers poll the run resource to observe
        the terminal canceled checkpoint.
      tags: [Vertex]
      parameters:
        - in: path
          name: scenarioRid
          required: true
          description: Vertex scenario RID that owns the run.
          schema:
            type: string
        - in: path
          name: runRid
          required: true
          description: Scenario Run RID to cancel.
          schema:
            type: string
      responses:
        "202":
          description: Scenario-run cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexScenarioRunCancelResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/admin/control-panel:
    get:
      operationId: getVertexControlPanel
      summary: Get Vertex control-panel configuration
      description: |
        Returns the current Vertex runtime knobs. When no admin has saved
        a config yet, the server returns the canonical defaults from
        `controlpanel.DefaultConfig`.
      tags: [Vertex]
      responses:
        "200":
          description: Current Vertex control-panel config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexControlPanelConfig"
