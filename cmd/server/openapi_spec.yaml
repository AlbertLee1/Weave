  /api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/execute:
    post:
      operationId: executeFunction
      summary: Validate parameters against the Function signature and dispatch (US-216/US-218/US-219)
      description: |
        Validates the caller-supplied `parameters` against the Function's
        declared signature (required, type, defaults, unknown-key rejection).
        On a validation failure the response is a 400 carrying
        `parameter`+`code`+`reason` so SDKs can map back to typed errors.
        On success the coerced parameter map is forwarded to the configured
        FunctionExecutor under a 5s CPU deadline and a 128MB heap ceiling.
        The endpoint also enforces a per-realm per-minute call quota:
        exhausted quota surfaces as 429 with `realm`+`functionRid`;
        exceeding the CPU deadline surfaces as 408; exceeding the heap
        ceiling surfaces as 429.

        US-219 streaming: pass `?stream=1` to receive an NDJSON stream
        (`Content-Type: application/x-ndjson`). One newline-delimited JSON
        object per line: `{"item": <element>}` for each emitted element
        (executors that return an array stream one element per line; scalar
        results stream as a single line; an empty array yields zero lines).
        Errors that occur AFTER the executor has been dispatched are
        delivered in-band as a terminal `{"error": {"code","reason","functionRid"}}`
        line so the SDK iterator can surface them without parsing HTTP
        status codes. Pre-execution errors (validation, 404, quota,
        no-executor) still return regular HTTP error responses.
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
        - in: query
          name: stream
          required: false
          description: |
            Set to `1` to receive an NDJSON stream of items
            (`application/x-ndjson`). Each line is `{"item": ...}`; a
            terminal `{"error": ...}` line is appended on executor failure.
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: |
            Function executed. Default content type is `application/json`
            with a `{functionRid, result}` body. When `?stream=1` is set,
            the response is `application/x-ndjson` with one item per line
            (`{"item": ...}`) and an optional terminal `{"error": ...}` line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionRid:
                    type: string
                  result: {}
                  cached:
                    type: boolean
                    description: |
                      US-221: present and `true` when the response was
                      served from the per-process LRU+TTL result cache
                      (only applies when the function is `pure=true` and
                      a cache is wired). Absent otherwise.
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Newline-delimited JSON. Each line is one of:
                  `{"item": <value>}` for an emitted element, or
                  `{"error": {"code","reason","functionRid"}}` as the
                  terminal line on executor failure.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "408":
          description: |
            Function exceeded the per-call CPU budget (US-218). The error
            `errorName` is `FunctionExecutionTimeout`; `parameters` echoes
            the configured `timeout` duration and `functionRid`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  errorName: { type: string }
                  errorInstanceId: { type: string }
                  parameters: { type: object, additionalProperties: true }
        "429":
          description: |
            Either the per-realm call quota is exhausted
            (`errorName=FunctionQuotaExceeded`, `parameters.realm`) or the
            function's memory ceiling was breached
            (`errorName=FunctionMemoryLimitExceeded`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  errorName: { type: string }
                  errorInstanceId: { type: string }
                  parameters: { type: object, additionalProperties: true }
        "503":
          description: Function executor not configured. Body echoes the coerced parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionRid:
                    type: string
                  parameters:
                    type: object
                    additionalProperties: true
                  error:
                    type: string
  /api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/replay:
    post:
      operationId: replayFunction
      summary: Replay a Function at a captured version (US-370)
      description: |
        Re-runs the Function pinned to the version captured by a historical
        execution row and compares the fresh output hash to the recorded one.
        The audit endpoint behind PRD US-370.

        Two invocation shapes are supported:
          - `executionId` resolves the persisted row, replays its stored
            `(version, input)` tuple, and compares hashes.
          - `version` + `input` skips the lookup and replays the supplied
            tuple. The determinism check is skipped because there is no
            historical hash to compare against.

        A hash divergence returns 409 with `errorCode=WEAVE_FUNCTION_NONDETERMINISTIC`
        and the fresh `result` body alongside the original execution row so
        SDK auditors can surface the drift without a second round-trip.
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                executionId:
                  type: string
                  description: ID of a previously persisted execution row.
                version:
                  type: string
                  description: |
                    Semver of the Function build to replay. Required when
                    `executionId` is omitted.
                input:
                  type: object
                  additionalProperties: true
                  description: |
                    Parameter map to replay. Required when `executionId` is
                    omitted; ignored otherwise.
      responses:
        "200":
          description: Replay matched the recorded hash (or no historical hash to compare).
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionRid: { type: string }
                  functionVersion: { type: string }
                  executionId: { type: string }
                  originalHash: { type: string }
                  replayHash: { type: string }
                  deterministic:
                    type: boolean
                    description: |
                      US-475 PRD-canonical: true iff the replay output hash
                      matches the recorded hash. Mirrors `match`; both fields
                      are emitted so pre-US-475 SDK consumers reading `match`
                      and US-475+ SDK consumers reading `deterministic` see
                      the same value.
                  match: { type: boolean }
                  originalOutput:
                    description: |
                      US-475 PRD-canonical: decoded JSON of the captured
                      execution's historical output. Populated only when the
                      replay was anchored to an executionId — ad-hoc replays
                      have no historical output to surface, so the field is
                      omitted.
                  replayOutput:
                    description: |
                      US-475 PRD-canonical: decoded JSON of the fresh replay
                      leg. Mirrors `result`; both keys carry the same value
                      so SDK consumers reading either name agree.
                  result: {}
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: |
            Hash divergence (US-370 / US-475). The body still includes the
            fresh `result` / `replayOutput` plus a
            `warning.code=WEAVE_FUNCTION_NONDETERMINISTIC` entry referencing
            the original execution, and `deterministic=false` (alongside
            legacy `match=false`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionRid: { type: string }
                  functionVersion: { type: string }
                  executionId: { type: string }
                  originalHash: { type: string }
                  replayHash: { type: string }
                  deterministic: { type: boolean }
                  match: { type: boolean }
                  originalOutput: {}
                  replayOutput: {}
                  result: {}
                  warning:
                    type: object
                    properties:
                      code: { type: string }
                      message: { type: string }
                  original:
                    type: object
                    additionalProperties: true
  /api/v2/functions/{functionRid}/replay:
    post:
      operationId: replayFunctionByRID
      summary: Replay a Function by RID (US-475 top-level alias)
      description: |
        US-475 PRD-literal top-level alias of the ontology-scoped
        `/api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/replay`
        endpoint. The functionRid MUST be RID-shaped (`ri.*`); bare-name or
        `name@version` refs are rejected with 400 InvalidFunctionRef because
        the URL no longer carries an ontology to disambiguate. Use the
        ontology-scoped path for those refs.

        The response shape, request body, and 200/400/404/409 semantics are
        identical to the ontology-scoped endpoint. See that operation for
        the full contract.
      tags: [Functions]
      parameters:
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                executionId: { type: string }
                version: { type: string }
                input:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Replay matched the recorded hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionRid: { type: string }
                  functionVersion: { type: string }
                  executionId: { type: string }
                  originalHash: { type: string }
                  replayHash: { type: string }
                  deterministic: { type: boolean }
                  match: { type: boolean }
                  originalOutput: {}
                  replayOutput: {}
                  result: {}
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Hash divergence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  functionRid: { type: string }
                  functionVersion: { type: string }
                  executionId: { type: string }
                  originalHash: { type: string }
                  replayHash: { type: string }
                  deterministic: { type: boolean }
                  match: { type: boolean }
                  originalOutput: {}
                  replayOutput: {}
                  result: {}
                  warning:
                    type: object
                    properties:
                      code: { type: string }
                      message: { type: string }
                  original:
                    type: object
                    additionalProperties: true
        "503":
          description: Function executor or execution store not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  reason: { type: string }
  /api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/commits:
    post:
      operationId: createFunctionRepoCommit
      summary: Append a commit to the Function code repository (US-415)
      description: |
        Records a new revision of the Function source code in the per-Function
        bare git repository at `{DataDir}/repos/{rid}/.git`. Each commit
        chains onto the previous head on `refs/heads/main`.

        Either `sourceCode` (preferred — full new file body) or `patch` (alias
        for `sourceCode` retained for SDK clients that prefer the git-style
        terminology) must be supplied. The `author` and `email` fields default
        to the system identity when blank.
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: Commit message.
                sourceCode:
                  type: string
                  description: Full new file body. Required unless `patch` is supplied.
                patch:
                  type: string
                  description: Alias for `sourceCode`.
                author:
                  type: string
                email:
                  type: string
      responses:
        "201":
          description: Commit recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunctionRepoCommit"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          description: Function repo store not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  reason: { type: string }
  /api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/log:
    get:
      operationId: listFunctionRepoCommits
      summary: List commits in the Function code repository (US-415)
      description: |
        Returns the commits on `refs/heads/main` for the Function's bare git
        repo, newest-first. The optional `limit` query parameter caps the
        response (default 100). When the repo has no commits yet the response
        is `200` with an empty `data` array.
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Commit list (may be empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FunctionRepoCommit"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          description: Function repo store not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  reason: { type: string }
  /api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/commits/{hash}/job:
    get:
      operationId: getFunctionRepoCommitJob
      summary: Read the CI job result for a Function code-repo commit (US-417)
      description: |
        Returns the lint + test pipeline outcome for the supplied commit so
        the SPA can render a ✅/❌ badge next to the hash. The CI job is
        recorded by the POST /commits handler in the background — this
        endpoint is the read counterpart and returns 404 CommitJobNotFound
        when no row exists for the (functionRid, hash) pair, or 503
        CommitJobsNotConfigured when no store is wired.
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
        - in: path
          name: hash
          required: true
          schema:
            type: string
            description: Commit SHA-1 hex (40 chars).
      responses:
        "200":
          description: CI job record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitJob"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          description: Commit job store not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  reason: { type: string }
  /api/v2/ontologies/{ontologyApiName}/functions/{functionRid}/commits/{hash}:
    get:
      operationId: getFunctionRepoCommit
      summary: Read a Function code-repo commit and its source blob (US-416)
      description: |
        Returns the commit metadata and the source-code blob attached at the
        supplied commit hash. The diff UI uses this to fetch the source at
        any historical revision so it can render a side-by-side diff between
        any two commits without re-walking the log.
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: functionRid
          required: true
          schema:
            type: string
        - in: path
          name: hash
          required: true
          schema:
            type: string
            description: Commit SHA-1 hex (40 chars).
      responses:
        "200":
          description: Commit and source code at that revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FunctionRepoCommit"
                  - type: object
                    required: [sourceCode]
                    properties:
                      sourceCode:
                        type: string
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          description: Function repo store not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  reason: { type: string }
  /api/v2/ontologies/{ontologyApiName}/branches:
    post:
      operationId: createBranch
      summary: Create a new ontology branch
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                createdBy:
                  type: string
                parentBranchId:
                  type: string
                  description: |
                    US-383 — optional parent branch in the same ontology to
                    chain the new branch off. Must reference an open branch.
                baseTx:
                  type: string
                  description: |
                    US-383 — optional dataset_transactions tx_id checkpoint.
      responses:
        "201":
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyBranch"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
    get:
      operationId: listBranches
      summary: List open ontology branches
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: List of open branches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OntologyBranch"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/branches/{branchId}:
    get:
      operationId: getBranch
      summary: Get a branch with change count
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch details with change count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyBranchDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      operationId: closeBranch
      summary: Close (soft-delete) a branch
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Branch closed.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/branches/{branchId}/diff:
    get:
      operationId: getBranchDiff
      summary: Get the diff between a branch and main
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of branch changes sorted by entity_type then change_type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BranchDiffEntry"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      operationId: postBranchDiff
      summary: Categorised branch diff with inline conflict annotations (US-385)
      description: |
        Returns the branch's recorded changes split into added / modified /
        deleted lists and a separate conflicts array. Each entry carries the
        entity's apiName and a stable resolutionKey ("<entityType>:<apiName>")
        that the merge endpoint consumes via conflictResolution.
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Categorised diff with conflict annotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDiffPostResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/branches/{branchId}/breaking-changes:
    get:
      operationId: getBranchBreakingChanges
      summary: Detect breaking changes introduced by a branch
      description: Compares branch overlay to main, surfacing property deletions, type narrowing, newly-required fields, and primary-key changes — annotated with affected ActionTypes and SavedObjectSets.
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Breaking-change report for the branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakingChangesReport"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/branches/{branchId}/rebase:
    post:
      operationId: rebaseBranch
      summary: Rebase a branch onto the latest main version
      description: Updates branch base_version to current main. Non-conflicting main changes are transparently incorporated. Conflicting changes return a conflict list.
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rebase succeeded. Branch base_version updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyBranch"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Rebase conflict — entities modified on both main and branch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: REBASE_CONFLICT
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/MergeConflict"
  /api/v2/ontologies/{ontologyApiName}/branches/{branchId}/merge:
    post:
      operationId: mergeBranch
      summary: Direct branch merge with explicit conflict resolution (US-385)
      description: |
        Applies the branch's recorded changes to main. When the same entity
        was independently modified on main, the caller must supply a
        resolution in conflictResolution keyed by "<entityType>:<apiName>"
        with value "use-branch" or "use-main". Unresolved conflicts return
        409 MERGE_CONFLICT with the annotated conflict list. On success the
        branch transitions to status="merged".
      tags: [Branches]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: branchId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeBranchRequest"
      responses:
        "200":
          description: Merge succeeded. Branch is now merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeBranchResponse"
        "400":
          $ref: "#/components/responses/InvalidParameterError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Unresolved merge conflict — caller must include a resolution for every entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    example: MERGE_CONFLICT
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnotatedMergeConflict"
                  unresolved:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnotatedMergeConflict"
  /api/v2/ontologies/{ontologyApiName}/proposals:
    post:
      operationId: createProposal
      summary: Create a new ontology proposal from a branch
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, title]
              properties:
                branchId:
                  type: string
                title:
                  type: string
                description:
                  type: string
                author:
                  type: string
      responses:
        "201":
          description: Proposal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
    get:
      operationId: listProposals
      summary: List ontology proposals
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, merged]
          description: Filter proposals by status.
      responses:
        "200":
          description: List of proposals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OntologyProposal"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/proposals/{proposalId}:
    get:
      operationId: getProposal
      summary: Get proposal details with reviews
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal with review list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposalDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/proposals/{proposalId}/approve:
    post:
      operationId: approveProposal
      summary: Approve a proposal
      description: Adds an approval review to the proposal. Self-review is forbidden (returns 403).
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Proposal with updated status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/PermissionDeniedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/proposals/{proposalId}/reject:
    post:
      operationId: rejectProposal
      summary: Reject a proposal
      description: Adds a rejection review to the proposal with a reason. Self-review is forbidden (returns 403).
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Proposal with updated status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/PermissionDeniedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/proposals/{proposalId}/merge:
    post:
      operationId: mergeProposal
      summary: Merge an approved proposal into main
      description: Applies all branch changes to main tables. Only approved proposals can be merged. Returns 409 with conflict list if entities were modified on both main and branch.
      tags: [Proposals]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal merged successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposal"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Proposal not approved or merge conflict detected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    enum: [MERGE_CONFLICT, CONFLICT]
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/MergeConflict"
  /api/v2/ontologies/{ontologyApiName}/fullMetadata:
    get:
      operationId: getFullMetadata
      summary: Get the full ontology metadata in one response (preview)
      description: Returns the ontology, its object types (with properties), link types, action types, and interfaces in a single payload.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/PreviewRequired"
      responses:
        "200":
          description: Full metadata payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyFullMetadata"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/export:
    get:
      operationId: exportOntology
      summary: Export complete ontology definitions as JSON
      description: Returns the complete ontology definition including all entity types (objectTypes with properties, linkTypes, actionTypes, interfaces, sharedProperties, valueTypes, typeGroups, functions, queryTypes).
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: Complete ontology export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyExport"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/sdkgen:
    post:
      operationId: generateSDK
      summary: Generate a typed SDK from ontology metadata
      description: Generates SDK source files for the specified language (ts, python, go) and returns them as a zip archive.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - name: lang
          in: query
          required: true
          schema:
            type: string
            enum: [ts, python, go]
          description: Target language for SDK generation.
      responses:
        "200":
          description: Zip archive containing generated SDK files.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/import:
    post:
      operationId: importOntology
      summary: Import ontology definitions from JSON
      description: Imports ontology definitions from JSON with merge or replace mode. Merge mode creates missing entities and updates existing ones. Replace mode drops all existing entities for the ontology and recreates from import. New RIDs are generated for imported entities and cross-references are remapped.
      tags: [Metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportOntologyRequest"
      responses:
        "201":
          description: Import successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/pkg/install:
    post:
      operationId: installPackage
      summary: Install a .weavepkg ontology archive (US-412)
      description: Validates the package's minWeaveVersion against the running server, detects apiName conflicts against the target ontology, optionally runs the bundled SQL migrations, and applies the ontology import. The on-conflict knob accepts "fail" (default — return 409 with the conflict list), "overwrite" (replace-mode import that drops conflicting entries), or "skip" (merge-mode import that keeps existing entries).
      tags: [Metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Package installed.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: One or more apiNames in the package collide with existing entries.
  /api/v2/pkg:
    get:
      operationId: listInstalledPackages
      summary: List installed packages
      description: Returns every row in the installed_packages table (US-412 / US-413). Returns an empty data array when the registry is unwired (degraded mode).
      tags: [Metadata]
      responses:
        "200":
          description: Installed package list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {type: object}
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/pkg/{name}:
    get:
      operationId: getInstalledPackage
      summary: Get one installed package row
      tags: [Metadata]
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Installed package row.
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      operationId: deleteInstalledPackage
      summary: Remove an installed package registry row
      description: Removes the row from installed_packages so the marketplace UI hides it. Does NOT drop ontology entities or revert migrations — those are operator workflows.
      tags: [Metadata]
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        "204":
          description: Row removed.
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
