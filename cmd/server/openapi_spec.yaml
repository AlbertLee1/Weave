    WireObject:
      type: object
      description: |
        Palantir V2 wire format for an object: properties are flattened at the
        top level alongside __rid, __primaryKey, and __apiName.
      additionalProperties: true
      properties:
        __rid:
          type: string
        __primaryKey: {}
        __apiName:
          type: string
    ObjectPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
        facets:
          type: object
          description: |
            Per-field term-count buckets (US-236). Present only when the
            caller requested `facets` via body or `?facets=` query param.
            Keys are property apiNames; each value is an array of
            `{value, count}` sorted by descending count. Fields with no
            matching terms yield an empty array.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/FacetBucket"
    FacetBucket:
      type: object
      description: Single term + count bucket produced by a faceted search.
      properties:
        value:
          type: string
        count:
          type: integer
      required: [value, count]
    WhereClause:
      type: object
      additionalProperties: true
      description: |
        WhereClause filter (see pkg/oss/where). Supported `type` values
        include eq, gt/gte/lt/lte, isNull, contains, fuzzy, phrase, regex,
        containsAllTerms, containsAnyTerm, containsAllTermsInOrder,
        containsAllTermsInOrderPrefixLastTerm, startsWith, wildcard,
        and/or/not, and the geospatial operators. The `phrase` operator
        accepts either a structured value
        `{"phrase": "quick fox", "slop": 2}` or a Lucene-style string
        `"quick fox"~2`; slop is clamped to [0, 32]. The `regex` operator
        takes a RE2 (Go regexp/syntax Perl) pattern as the value, is
        lowercased to match the standard analyser's indexed form, and
        executes under a 500ms server-side timeout.
    SearchObjectsRequest:
      type: object
      required: [select]
      properties:
        where:
          $ref: "#/components/schemas/WhereClause"
        fuzzy:
          type: object
          description: |
            Optional fuzzy matching config applied to eq / containsAllTerms /
            containsAnyTerm / fuzzy clauses within `where`. The
            `?fuzziness=N` query parameter, when set, overrides this field.
          properties:
            maxEdits:
              type: integer
              minimum: 0
              maximum: 2
              enum: [0, 1, 2]
              description: |
                Levenshtein edit distance (0, 1 or 2). When the `fuzzy` object is
                provided but `maxEdits` is omitted or 0, the default is 1.
        highlight:
          type: object
          description: |
            Optional US-235 highlight config. When present, each returned
            object carries a `_highlights: { field: [snippet...] }` key where
            matched terms are wrapped with <mark>...</mark>. The `?highlight`
            query parameter, when set, overrides this body field:
            `?highlight=true` enables defaults; `?highlight=false` disables;
            `?highlight=field1,field2` restricts highlighting to the listed
            fields.
          properties:
            style:
              type: string
              description: |
                Highlighter name registered with Bleve (e.g. "html", "ansi").
                Defaults to "html" which wraps matches with <mark>...</mark>.
            fields:
              type: array
              description: |
                Property apiNames to highlight. Empty / omitted falls back to
                every searchable text field with term vectors.
              items:
                type: string
        facets:
          type: array
          description: |
            US-236 facet fields. Each field produces a
            `{value, count}` bucket list under the response's
            `facets[field]`. The `?facets=field1,field2` query parameter,
            when set, REPLACES this list so URL-only invocations stay
            first-class. Fields that are missing or not indexed silently
            yield an empty bucket list.
          items:
            type: string
        select:
          type: array
          items:
            type: string
          description: Required list of property apiNames to return.
        pageSize:
          type: integer
        pageToken:
          type: string
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
    ObjectSetDefinition:
      type: object
      description: |
        Composable ObjectSet definition. Supported types: base, static, filter,
        union, intersect, subtract, searchAround, reference, nearestNeighbors,
        withProperties, asType, asBaseObjectTypes, interfaceBase,
        interfaceLinkSearchAround, methodInput, sample. See pkg/oss/objectset.
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
          enum:
            - base
            - static
            - filter
            - union
            - intersect
            - subtract
            - searchAround
            - reference
            - nearestNeighbors
            - withProperties
            - asType
            - asBaseObjectTypes
            - interfaceBase
            - interfaceLinkSearchAround
            - methodInput
            - sample
        objectType:
          type: string
          description: Used by base, static, and asType.
        objectSet:
          description: Inner objectSet used by filter, searchAround, withProperties, asType, asBaseObjectTypes, interfaceLinkSearchAround.
          $ref: "#/components/schemas/ObjectSetDefinition"
        objectSets:
          type: array
          description: Used by union, intersect, subtract.
          items:
            $ref: "#/components/schemas/ObjectSetDefinition"
        primaryKeys:
          type: array
          description: Used by static — explicit list of primary keys of objectType.
          items:
            type: string
        interfaceType:
          type: string
          description: Used by interfaceBase — interface API name whose implementing object types form the base set.
        interfaceLink:
          type: string
          description: Used by interfaceLinkSearchAround — interface link API name to traverse.
        input:
          type: string
          description: Used by methodInput — name of the function method input parameter bound at invocation time.
        size:
          type: integer
          description: Used by sample — number of primary keys to return via uniform reservoir sampling from the inner ObjectSet. Required when type=sample.
        seed:
          type: integer
          format: int64
          description: Used by sample — optional deterministic PRNG seed. When set two runs of the same definition produce identical samples; omit for a wall-clock-seeded sample.
        path:
          type: array
          description: |
            Used by searchAround — ordered list of link hops to walk from the inner
            objectSet. Each step takes a link API name and optional direction
            ("" / "forward" / "reverse") plus an optional expectedObjectType the
            executor asserts against the resolver's target-type lookup. When
            path is set the legacy `link` / `direction` fields must be unset.
          items:
            type: object
            required: [link]
            properties:
              link:
                type: string
                description: Link type API name for this hop.
              direction:
                type: string
                enum: ["", forward, reverse]
                description: Traversal direction. Defaults to forward.
              expectedObjectType:
                type: string
                description: |
                  Optional assertion — when set, the executor requires the
                  resolver's target-type lookup for this hop to equal this
                  value, otherwise the walk fails loudly.
    LoadObjectSetRequest:
      type: object
      required: [objectSet, select]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        select:
          type: array
          items:
            type: string
          description: Required list of property apiNames to return.
        orderBy:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  direction:
                    type: string
                    enum: [asc, desc]
        pageSize:
          type: integer
        pageToken:
          type: string
        snapshot:
          type: boolean
    LoadObjectSetResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WireObject"
        nextPageToken:
          type: string
        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    LoadObjectSetV2MultipleObjectTypesResponse:
      type: object
      description: |
        Preview response envelope used by loadObjectsMultipleObjectTypes and
        loadObjectsOrInterfaces. Each data item is a flat object whose keys
        include the requested properties plus $rid, $primaryKey and $apiName.
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Flat object with $rid/$primaryKey/$apiName plus selected properties.
        nextPageToken:
          type: string
        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    LoadLinksRequest:
      type: object
      required: [objectSet, linkTypeApiName]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        linkTypeApiName:
          type: string
          description: The API name of the link type to traverse
        select:
          type: array
          items:
            type: string
        pageSize:
          type: integer
        pageToken:
          type: string
    AggregationSpec:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [count, min, max, sum, avg, approximateDistinct, exactDistinct, standardDeviation, variance, approximatePercentile, collectList]
        field:
          type: string
        name:
          type: string
        percentile:
          type: number
        precision:
          type: integer
          minimum: 4
          maximum: 18
          description: |
            HyperLogLog precision for `approximateDistinct` (4..18). Defaults
            to 14 (~0.81% standard error). Higher precision reduces error but
            grows the in-memory sketch: a size-of-sketch ≈ 2^precision bytes.
            Overrides the request-level hllPrecision when set (US-465).
        compression:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: |
            t-digest compression for `approximatePercentile`. Defaults to 100
            (worst-case ≤ 1000 centroids; ≤ 16 KiB heap; p99 error << 1% on
            smooth distributions). Larger values give finer-grained tails at
            higher memory cost. Overrides the request-level tdigestCompression
            when set (US-465). Must be a positive finite number.
    GroupBySpec:
      type: object
      required: [type, field]
      properties:
        type:
          type: string
          enum: [exact, fixedWidth, range, ranges, duration, topValues, geohash]
        field:
          type: string
        maxGroupCount:
          type: integer
        fixedWidth:
          type: number
        ranges:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              startValue:
                type: number
              endValue:
                type: number
        duration:
          type: string
        value:
          type: object
          properties:
            unit:
              type: string
              enum: [SECONDS, MINUTES, HOURS, DAYS, WEEKS, MONTHS, YEARS]
            value:
              type: number
        precision:
          type: integer
          minimum: 1
          maximum: 12
          description: |
            Geohash character precision for `geohash` groupBy (1..12). Defaults
            to 6 (≈ ±0.61km cell). Precision 1 ≈ 5000km; precision 12 ≈ 3.7cm.
    AggregationRequest:
      type: object
      required: [aggregation]
      properties:
        objectType:
          type: string
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
        where:
          $ref: "#/components/schemas/WhereClause"
          description: |
            Aggregation accepts the shared WhereClause shape, except regex
            filters are rejected with `AggregationWhereRegexUnsupported` until
            aggregation search can enforce the regex timeout contract.
        subAggregations:
          type: array
          description: |
            Named child aggregations executed against each leaf bucket of the
            outer groupBy (or against the full request scope when no outer
            groupBy is supplied). Sub-aggregations may themselves carry
            sub-aggregations to any depth.
          items:
            $ref: "#/components/schemas/SubAggregationSpec"
        having:
          type: array
          description: |
            Post-aggregation row filter. Each clause names a metric produced
            by the same request and drops rows whose metric value does not
            satisfy the comparison. Clauses AND together; missing or
            non-numeric metric values fail the clause.
          items:
            $ref: "#/components/schemas/HavingClause"
        cube:
          type: boolean
          description: |
            When true, expand groupBy into every 2^N subset and concatenate
            the resulting rows (full set first, grand total last). Rows from
            partial subsets omit non-grouped dimensions from their group map;
            absence signals that the dimension was aggregated across all
            values at that row. Cube takes precedence when rollup is also set.
        rollup:
          type: boolean
          description: |
            When true, expand groupBy into the hierarchical chain
            (groupBy[0..N], groupBy[0..N-1], ..., groupBy[0..0], grand total) —
            N+1 groupings in total. Rolled-up dimensions are absent from the
            row's group map. Mutex with cube; if both set, cube wins.
        excludedItems:
          type: array
          description: |
            Optional list of primary keys to exclude from the aggregation
            scope BEFORE any metric or facet runs (US-382). Duplicates and
            blank ids are tolerated; the response.excludedItems field reports
            how many of the supplied PKs actually matched the post-scope
            query.
          items:
            type: string
        hllPrecision:
          type: integer
          minimum: 4
          maximum: 18
          description: |
            Request-wide HyperLogLog precision applied to every
            `approximateDistinct` in this request that does not carry its own
            spec-level `precision` override (US-465). Default 14. Range 4..18.
        tdigestCompression:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: |
            Request-wide t-digest compression applied to every
            `approximatePercentile` in this request that does not carry its
            own spec-level `compression` override (US-465). Default 100. Must
            be a positive finite number.
        approximateScanThreshold:
          type: integer
          format: int64
          description: |
            Scanned-row count above which the response is force-marked
            APPROXIMATE even when the scan was not truncated by MaxDocScanSize
            (US-465). Default 1,000,000. A non-positive value disables the
            check. Lets callers tighten the cost-of-trust boundary without
            changing the engine's hard scan ceiling.
    HavingClause:
      type: object
      required: [metric, op, value]
      properties:
        metric:
          type: string
          description: Name of a metric produced by this aggregation request.
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        value:
          type: number
    SubAggregationSpec:
      type: object
      required: [name, aggregation]
      properties:
        name:
          type: string
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
        subAggregations:
          type: array
          items:
            $ref: "#/components/schemas/SubAggregationSpec"
        having:
          type: array
          items:
            $ref: "#/components/schemas/HavingClause"
    AggregationRow:
      type: object
      properties:
        group:
          type: object
          additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
        subAggregations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AggregationResponse"
    CountObjectsRequest:
      type: object
      description: |
        Optional request body for POST .../objects/{objectType}/count.
        When omitted (or sent as `{}`), the count returns every
        object of the given type via the indexMgr.DocCount fast path.
        When `where` is supplied, the same where-clause → Bleve query
        pipeline used by SearchObjects is run with Size=0 and the
        Bleve total is returned — also AND-combined with the caller's
        row-level security policy so a filtered count cannot
        over-report rows the caller is not authorised to see.
      properties:
        where:
          $ref: "#/components/schemas/WhereClause"
    CountObjectsResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: The number of objects matching the (optional) filter.
    AggregationResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AggregationRow"
        accuracy:
          type: string
          enum: [ACCURATE, APPROXIMATE]
        excludedItems:
          type: integer
          description: |
            Count of caller-supplied AggregationRequest.excludedItems primary
            keys that actually intersected the post-scope query (US-382).
            Duplicates and out-of-scope ids contribute zero.
        computeUsage:
          type: object
          description: |
            Per-aggregation cost-and-quality envelope (US-382). Replaces the
            legacy scalar float form.
          properties:
            scannedRows:
              type: integer
              format: int64
              description: Post-exclusion total document count visible to the engine.
            durationMs:
              type: integer
              format: int64
              description: Wall-clock duration of the aggregate call in milliseconds.
            accuracy:
              type: string
              enum: [ACCURATE, APPROXIMATE]
              description: Mirrors the top-level accuracy verdict.
        subAggregations:
          type: object
          description: |
            Top-level sub-aggregation results, present only when the request
            specified subAggregations and no outer groupBy.
          additionalProperties:
            $ref: "#/components/schemas/AggregationResponse"
    AggregateObjectSetRequest:
      type: object
      required: [objectSet, aggregation]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/AggregationSpec"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/GroupBySpec"
        subAggregations:
          type: array
          items:
            $ref: "#/components/schemas/SubAggregationSpec"
        having:
          type: array
          items:
            $ref: "#/components/schemas/HavingClause"
        cube:
          type: boolean
          description: See AggregationRequest.cube.
        rollup:
          type: boolean
          description: See AggregationRequest.rollup.
        excludedItems:
          type: array
          description: See AggregationRequest.excludedItems (US-382).
          items:
            type: string
    CreateTemporaryRequest:
      type: object
      required: [objectSet]
      properties:
        objectSet:
          $ref: "#/components/schemas/ObjectSetDefinition"
    CreateTemporaryResponse:
      type: object
      properties:
        objectSetRid:
          type: string
    DiffObjectSetRequest:
      type: object
      description: |
        Two ObjectSet definitions to diff. Both MUST resolve to the same
        ObjectType. US-430.
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/ObjectSetDefinition"
        right:
          $ref: "#/components/schemas/ObjectSetDefinition"
    DiffObjectSetResponse:
      type: object
      description: |
        Set-diff result. PK lists are sorted ascending. `intersectSize` is
        a convenience mirror of `len(inBoth)`. `durationMs` measures the
        diff step only (executor latency not included).
      properties:
        leftObjectType:
          type: string
        rightObjectType:
          type: string
        onlyInLeft:
          type: array
          items: { type: string }
        onlyInRight:
          type: array
          items: { type: string }
        inBoth:
          type: array
          items: { type: string }
        leftSize:
          type: integer
        rightSize:
          type: integer
        intersectSize:
          type: integer
        durationMs:
          type: integer
          format: int64
    ApplyOptions:
      type: object
      description: Options for single action apply (Foundry OSv2).
      properties:
        mode:
          type: string
          enum: [VALIDATE_ONLY, VALIDATE_AND_EXECUTE]
          default: VALIDATE_AND_EXECUTE
          description: VALIDATE_ONLY runs validation without executing; VALIDATE_AND_EXECUTE (default) runs both.
        returnEdits:
          type: string
          enum: [ALL, ALL_V2_WITH_DELETIONS, NONE]
          default: ALL
          description: Controls whether edit summaries are returned in the response.
        expectedVersion:
          type: integer
          format: int32
          description: |
            US-023 legacy single-target optimistic concurrency token. When set,
            the first MODIFY/DELETE target of the action is verified against this
            version count; mismatch surfaces 409 StaleObject. Superseded by
            expectedVersions for multi-target locks; when both are set
            expectedVersions takes precedence.
        expectedVersions:
          type: array
          description: |
            US-471 per-target optimistic concurrency tokens. Each entry locks
            one (objectType, primaryKey) tuple against the version the caller
            observed. A single mismatch aborts the publish before NATS is
            contacted and surfaces 409 StaleObject pointing at the failing ref
            (deterministic order: first stale ref wins). Refs may target
            objects the action does not modify — the lock is a snapshot
            predicate on the caller's read set.
          items:
            $ref: "#/components/schemas/ExpectedVersionRef"
    ExpectedVersionRef:
      type: object
      description: US-471 per-target optimistic-lock token.
      required: [objectType, primaryKey, version]
      properties:
        objectType:
          type: string
          description: API name of the ObjectType being locked.
        primaryKey:
          type: string
          description: Primary key of the object being locked.
        version:
          type: integer
          format: int32
          description: |
            Observed object_history version count. The apply is rejected with
            409 StaleObject if the live version differs from this value at
            prepare time.
    BatchApplyOptions:
      type: object
      description: Options for batch action apply (Foundry OSv2).
      properties:
        returnEdits:
          type: string
          enum: [ALL, NONE]
          default: ALL
          description: Controls whether edit summaries are returned in the response.
    ActionResults:
      type: object
      description: Foundry OSv2 edit summary returned in action response envelopes.
      required: [type]
      properties:
        type:
          type: string
          enum: [edits]
        addedObjectCount:
          type: integer
        modifiedObjectCount:
          type: integer
        deletedObjectCount:
          type: integer
        addedLinksCount:
          type: integer
        deletedLinksCount:
          type: integer
    ValidationResult:
      type: object
      description: Validation result returned for VALIDATE_ONLY mode.
      required: [result]
      properties:
        result:
          type: string
          enum: [VALID, INVALID]
    ValidateActionResponse:
      type: object
      description: |
        Foundry OSv2 response envelope for the dedicated
        POST /api/v2/ontologies/{ontologyApiName}/actions/{action}/validate
        endpoint. The wire shape is a validation report — submissionCriteria
        and parameters are ALWAYS non-null arrays/objects so SDKs can iterate
        without nil-guarding even on a VALID response.
      required: [result, submissionCriteria, parameters]
      properties:
        result:
          type: string
          enum: [VALID, INVALID]
        submissionCriteria:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionCriterionResult"
        parameters:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParameterValidationResult"
    SubmissionCriterionResult:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [VALID, INVALID]
        configuredFailureMessage:
          type: string
    ParameterValidationResult:
      type: object
      required: [result, required, evaluatedConstraints]
      properties:
        result:
          type: string
          enum: [VALID, INVALID]
        required:
          type: boolean
        evaluatedConstraints:
          type: array
          items:
            $ref: "#/components/schemas/EvaluatedConstraint"
    EvaluatedConstraint:
      type: object
      required: [type, result]
      properties:
        type:
          type: string
          description: Constraint kind (e.g. "required", "range", "oneOf").
        result:
          type: string
          enum: [VALID, INVALID]
    ApplyActionRequest:
      type: object
      description: |
        Foundry OSv2 action body — the action API name is in the URL path
        segment {action}, not the body. Only parameters and options travel here.
      properties:
        parameters:
          type: object
          additionalProperties: true
        options:
          $ref: "#/components/schemas/ApplyOptions"
    SyncApplyActionResponseV2:
      type: object
      description: Foundry OSv2 response envelope for single action apply.
      properties:
        operationId:
          type: string
        validation:
          $ref: "#/components/schemas/ValidationResult"
        edits:
          $ref: "#/components/schemas/ActionResults"
    AsyncApplyActionResponse:
      type: object
      description: |
        US-240: 202-Accepted envelope returned by POST /actions/{action}/apply?async=true.
        Clients poll GET /actions/jobs/{jobId} until status reaches SUCCEEDED or FAILED.
      required: [jobId, status]
      properties:
        jobId:
          type: string
          description: Unique ID for the async action job.
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
          description: Initial job status at the time of the 202 response.
    PendingApprovalResponse:
      type: object
      description: |
        US-242: 202-Accepted envelope returned by POST /actions/{action}/apply
        when the target ActionType is flagged requiresApproval and an
        ActionApprovalStore is wired. Clients route to the approval queue UI
        using {approvalId}; the action does NOT execute until the approval row
        is transitioned to APPROVED via POST
        /actions/approvals/{approvalId}/approve.
      required: [approvalId, status]
      properties:
        approvalId:
          type: string
          description: Unique ID for the pending approval row.
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          description: Initial approval status — always PENDING at enqueue time.
    ActionApproval:
      type: object
      description: |
        US-242: persisted approval request. status transitions PENDING →
        (APPROVED | REJECTED); terminal states are immutable (409 Conflict on
        re-approve). parameters is a snapshot of the original apply body so the
        reviewer can inspect what will run if approved. approvers is a snapshot
        of the ActionType's approvers list at submission time — later edits
        don't retroactively change who can review an already-queued request.
      required: [id, ontologyApiName, actionType, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        actionTypeRid:
          type: string
        ontologyApiName:
          type: string
        actionType:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: Snapshot of the original apply body parameters.
        approvers:
          type: array
          items:
            type: string
          description: Snapshot of approver role names or user IDs eligible to review.
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        requestedBy:
          type: string
        reviewedBy:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApprovalReviewRequest:
      type: object
      description: |
        US-242: JSON body for POST .../actions/approvals/{approvalId}/approve
        and /reject. reason is optional and is recorded on the approval row
        for audit.
      properties:
        reason:
          type: string
    ApprovalReviewResponse:
      type: object
      description: |
        US-242: 200 OK envelope returned by the approve / reject endpoints.
        Mirrors the ActionApproval row's terminal shape — carries the id and
        the new status so SDK callers don't need a second GET to confirm the
        transition.
      required: [approvalId, status]
      properties:
        approvalId:
          type: string
        status:
          type: string
          enum: [APPROVED, REJECTED]
    ActionJob:
      type: object
      description: |
        US-240: persisted state of an async action apply. status transitions
        PENDING → RUNNING → (SUCCEEDED | FAILED). progress is 0..100. result
        holds the SyncApplyActionResponseV2 envelope on success; errorMessage
        is populated on FAILED.
      required: [jobId, ontologyApiName, actionType, status, progress, createdAt, updatedAt]
      properties:
        jobId:
          type: string
        ontologyApiName:
          type: string
        actionType:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        result:
          type: object
          additionalProperties: true
          description: On SUCCEEDED, contains the sync-apply response envelope.
        errorMessage:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Saga:
      type: object
      description: |
        US-044: durable saga header for a multi-step action workflow. The
        status field mirrors the action_sagas lifecycle and drives operator
        monitoring surfaces.
      required: [sagaId, ontology, status, createdAt, updatedAt]
      properties:
        sagaId:
          type: string
        idempotencyKey:
          type: string
        ontology:
          type: string
        status:
          type: string
          enum: [RUNNING, SUCCESS, COMPENSATING, COMPENSATED, FAILED]
        requestedBy:
          type: string
        failureMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SagaStep:
      type: object
      description: |
        US-044: one ordered step in a saga timeline. The JSON snapshot fields
        carry the prepared action parameters, primary edits, and inverse edits
        when those values have been persisted.
      required: [stepId, sagaId, stepIndex, actionType, status, createdAt, updatedAt]
      properties:
        stepId:
          type: string
        sagaId:
          type: string
        stepIndex:
          type: integer
        actionType:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: JSON parameters submitted for this step.
        editsJson:
          type: array
          items:
            type: object
            additionalProperties: true
          description: JSON edits prepared for the primary action.
        inverseEditsJson:
          type: array
          items:
            type: object
            additionalProperties: true
          description: JSON edits prepared by the compensating action.
        status:
          type: string
          enum: [PENDING, APPLIED, FAILED, COMPENSATED, COMPENSATION_FAILED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListSagasResponse:
      type: object
      description: US-044 saga list response ordered by createdAt descending.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Saga"
    GetSagaResponse:
      type: object
      description: US-044 saga detail response with the ordered step timeline.
      required: [saga, steps]
      properties:
        saga:
          $ref: "#/components/schemas/Saga"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SagaStep"
    ApplyBatchRequest:
      type: object
      description: |
        Foundry OSv2 batch apply body — the action API name is in the URL path
        segment {action}. All batch items share the same action type.
      required: [actions]
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              parameters:
                type: object
                additionalProperties: true
        options:
          $ref: "#/components/schemas/BatchApplyOptions"
    BatchApplyActionResponseV2:
      type: object
      description: Foundry OSv2 response envelope for batch action apply.
      properties:
        edits:
          $ref: "#/components/schemas/ActionResults"
    StreamIngestRequest:
      type: object
      description: Bulk-ingest request for streaming edits into an ObjectType.
      required: [edits]
      properties:
        edits:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IngestEdit"
    IngestEdit:
      type: object
      description: A single edit in a stream ingest batch.
      required: [type, objectType, primaryKey]
      properties:
        type:
          type: string
          enum: [CREATE, MODIFY, DELETE]
        objectType:
          type: string
        primaryKey:
          type: string
        properties:
          type: object
          additionalProperties: true
    StreamIngestResponse:
      type: object
      description: Response envelope for a successful stream ingest.
      required: [batchId, editCount]
      properties:
        batchId:
          type: string
        editCount:
          type: integer
    ApplyActionOverrides:
      type: object
      description: |
        Foundry OSv2 override envelope. Foundry uses this to override
        auto-generated parameters (uniqueIdentifier, currentTime). Weave
        currently only honors an explicit `parameters` override map, which is
        merged into the wrapped request's parameters (overrides win).
      properties:
        parameters:
          type: object
          additionalProperties: true
    ApplyActionWithOverridesRequest:
      type: object
      description: |
        Foundry OSv2 request body for applyWithOverrides — wraps an
        ApplyActionRequestV2 in `request` and an ApplyActionOverrides in
        `overrides`.
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/ApplyActionRequest"
        overrides:
          $ref: "#/components/schemas/ApplyActionOverrides"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginUser:
      type: object
      required: [id, email, name, roles, ontologyRoles]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ontologyRoles:
          type: object
          additionalProperties:
            type: string
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/LoginUser"
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      $ref: "#/components/schemas/LoginResponse"
    User:
      type: object
      required: [id, roles, ontologyRoles, permissions]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ontologyRoles:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
    ExecuteQueryRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
    ExecuteQueryResponse:
      type: object
      additionalProperties: true
    AttachmentV2:
      type: object
      description: |
        Foundry OSv2 attachment blob metadata record. Attachments are a
        global resource — not scoped to an ontology — and are referenced
        by ri.attachments.main.attachment.<uuid> identifiers.
      required: [rid, filename, sizeBytes, mediaType]
      properties:
        rid:
          type: string
          description: Attachment resource identifier.
          example: ri.attachments.main.attachment.01234567-89ab-cdef-0123-456789abcdef
        filename:
          type: string
          description: Original filename supplied by the uploader.
        sizeBytes:
          type: integer
          format: int64
          description: Blob size in bytes.
        mediaType:
          type: string
          description: IANA media type of the blob.
          example: image/png
    MediaMetadata:
      type: object
      description: |
        Foundry OSv2 MediaMetadata wire shape returned by the
        MediaReferenceProperty metadata endpoint.
      required: [path, sizeBytes, mediaType]
      properties:
        path:
          type: string
          description: Logical path of the media item inside its media set.
        sizeBytes:
          type: integer
          format: int64
          description: Blob size in bytes.
        mediaType:
          type: string
          description: IANA media type of the blob.
          example: image/jpeg
    MediaReference:
      type: object
      description: |
        Foundry OSv2 MediaReference wire shape. Points at a single media-set
        item and carries the mime type for convenience.
      required: [mimeType, reference]
      properties:
        mimeType:
          type: string
          example: image/png
        reference:
          type: object
          required: [type, mediaSetViewItem]
          properties:
            type:
              type: string
              enum: [mediaSetViewItem]
            mediaSetViewItem:
              type: object
              required: [mediaSetRid, mediaSetViewRid, mediaItemRid]
              properties:
                mediaSetRid:
                  type: string
                mediaSetViewRid:
                  type: string
                mediaItemRid:
                  type: string
    TimeSeriesPoint:
      type: object
      description: |
        Foundry OSv2 TimeSeriesPoint wire shape: a single (time, value)
        reading on a time series. time is ISO 8601; value is whatever the
        series stores (numeric, string, struct).
      required: [time, value]
      properties:
        time:
          type: string
          format: date-time
          description: Point timestamp (RFC3339 / ISO 8601).
          example: "2026-04-01T00:00:00Z"
        value:
          description: Point value; type depends on the series.
    GeotemporalSeriesValue:
      type: object
      description: |
        Foundry OSv2 GeotemporalSeriesValue wire shape: a single
        (time, position) reading on a geotemporal series. time is ISO 8601;
        position is a GeoJSON Point object `{type:"Point",coordinates:[lng,lat]}`.
      required: [time, position]
      properties:
        time:
          type: string
          format: date-time
          description: Value timestamp (RFC3339 / ISO 8601).
          example: "2026-04-01T00:00:00Z"
        position:
          type: object
          description: GeoJSON Point at the given timestamp.
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Point]
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: "[longitude, latitude]"
    DecryptionResult:
      type: object
      description: |
        Foundry OSv2 DecryptionResult wire shape returned by the
        CipherTextProperty decrypt endpoint.
      required: [plaintext]
      properties:
        plaintext:
          type: string
          description: Decrypted plaintext of the addressed ciphertext property.
    TransactionEditRequest:
      type: object
      description: |
        Request body for the experimental OntologyTransaction edits endpoint.
        Contains the set of edits to append to an open transaction.
      required: [edits]
      properties:
        edits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionEdit"
    TransactionEdit:
      type: object
      description: |
        One buffered edit on an OntologyTransaction. Mirrors the internal
        EditBatch payload emitted by ActionExecutor, minus the batch
        metadata.
      required: [type, objectType, primaryKey]
      properties:
        type:
          type: string
          enum: [CREATE, MODIFY, DELETE]
        objectType:
          type: string
        primaryKey:
          type: string
        properties:
          type: object
          additionalProperties: true
          description: Property values (required for CREATE/MODIFY, ignored for DELETE).
    TransactionEditResponse:
      type: object
      description: |
        Response envelope for the experimental OntologyTransaction edits
        endpoint. Reports how many edits were just appended and the
        running total buffered on the transaction.
      required: [transactionId, appendedEdits, totalEdits]
      properties:
        transactionId:
          type: string
        appendedEdits:
          type: integer
          format: int32
        totalEdits:
          type: integer
          format: int32
    SqlQueryExecuteRequest:
      type: object
      description: |
        Request body for POST /api/v2/sqlQueries/execute. The query must
        be a single-statement SELECT (or WITH ... SELECT); non-SELECT
        statements and stacked statements are rejected with a 400
        NonSelectQuery error.
      required: [query]
      properties:
        query:
          type: string
          description: A single read-only SELECT statement.
        fallbackBranchIds:
          type: array
          items:
            type: string
          description: |
            Accepted for Foundry SDK parity but ignored — the
            single-machine build has no branch concept.
    QueryStatus:
      type: object
      description: |
        Foundry QueryStatus union for the execute endpoint. Weave only
        ever produces the terminal "succeeded" / "failed" variants
        because queries run synchronously on the request goroutine; the
        "running" / "canceled" Foundry variants are documented for SDK
        compatibility but never returned by this implementation.
      required: [type, queryId]
      properties:
        type:
          type: string
          enum: [succeeded, failed, running, canceled]
        queryId:
          type: string
        errorMessage:
          type: string
          description: Present when type is "failed".
        failureReason:
          type: string
          description: |
            Present when type is "failed". Known values:
            "ExecutionError" (engine returned an error),
            "NonSelectQuery" (query was rejected at execution time),
            "StackedStatement" (more than one statement in the input),
            "SystemTableAccess" (query references pg_* / information_schema.*),
            "QueryTimeout" (query exceeded the configured timeout — US-468),
            "MaxRowsExceeded" (query streamed more than the configured row cap — US-468).
    AdminIndexRebuildRequest:
      type: object
      description: |
        Request body for POST /api/admin/indexes/rebuild. Identifies a
        single ObjectType whose Bleve index should be dropped, recreated,
        and reindexed from the authoritative object_history tail.
      required: [ontology, objectType]
      properties:
        ontology:
          type: string
          description: Ontology apiName.
        objectType:
          type: string
          description: ObjectType apiName (scoped to the ontology).
    AdminIndexRebuildResponse:
      type: object
      description: |
        Successful rebuild reply carrying the fully-scoped Bleve key that
        was rebuilt and the number of documents replayed from
        object_history into the new index.
      required: [scopedKey, indexedCount]
      properties:
        scopedKey:
          type: string
          description: "Fully qualified Bleve index key, formatted as `{ontologyApiName}__{objectTypeApiName}`."
        indexedCount:
          type: integer
          format: int32
          description: Number of documents indexed from the source.
    AdminFunnelDLQEntry:
      type: object
      description: |
        US-470: a single dead-lettered EditBatch envelope stored in the
        OBJECT_EDITS_DLQ JetStream stream. `id` is the stream sequence number
        rendered as a decimal string; it is stable across server restarts so
        callers can replay or discard by id without race risk.
      required: [id, subject, message]
      properties:
        id:
          type: string
          description: Stream sequence number for this DLQ entry.
        subject:
          type: string
          description: "DLQ subject this envelope was published under, e.g. `edits.dlq.employee`."
        message:
          $ref: "#/components/schemas/AdminFunnelDLQMessage"
    AdminFunnelDLQMessage:
      type: object
      description: |
        US-470: the wrapper envelope the consumer writes to the DLQ stream
        when a message exceeds max deliveries. `originalSubject` is the live
        edits subject the replay endpoint republishes to; `originalData` is
        the raw EditBatch payload (already JSON-encoded).
      required: [originalSubject, originalData, reason, numDelivered, maxDeliveries, terminatedAt, streamSequence, consumerSequence]
      properties:
        originalSubject:
          type: string
          description: "Live subject the consumer was about to NAK on, e.g. `edits.employee`."
        originalData:
          type: string
          format: byte
          description: Base64 JSON of the original EditBatch payload.
        reason:
          type: string
          description: Operator-readable explanation of why the message was dead-lettered.
        numDelivered:
          type: integer
          format: int64
          description: Number of delivery attempts when the message was terminated.
        maxDeliveries:
          type: integer
          format: int64
          description: Configured max deliveries threshold the consumer hit.
        terminatedAt:
          type: string
          format: date-time
        streamSequence:
          type: integer
          format: int64
          description: Sequence number on the original OBJECT_EDITS stream.
        consumerSequence:
          type: integer
          format: int64
          description: Sequence number on the consumer's delivery view.
    AdminFunnelDLQListResponse:
      type: object
      description: US-470 wire shape for `GET /api/admin/funnel/dlq`.
      required: [entries, size]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminFunnelDLQEntry"
        size:
          type: integer
          format: int64
          description: |
            Authoritative count of pending messages in the DLQ stream.
            May exceed `entries.length` when the page was capped by `limit`.
    AdminFunnelDLQReplayResponse:
      type: object
      description: US-470 wire shape for `POST /api/admin/funnel/dlq/{id}/replay`.
      required: [id, originalSubject]
      properties:
        id:
          type: string
          description: Stream sequence id of the replayed entry.
        originalSubject:
          type: string
          description: "Live subject the payload was republished onto, e.g. `edits.employee`."
    AdminFunnelDLQDiscardResponse:
      type: object
      description: US-470 wire shape for `POST /api/admin/funnel/dlq/{id}/discard`.
      required: [id, dropped]
      properties:
        id:
          type: string
        dropped:
          type: boolean
          description: True when the entry was removed from the DLQ stream.
    AdminSideEffectDLQEntry:
      type: object
      description: |
        PRD-V2 Gap-A4 round-33 entry — one failed-after-retries
        side-effect dispatch parked in `action_log_side_effect_dlq` for
        operator review/replay.
      required: [id, actionLogId, effectIndex, effectType, outcome, createdAt, replayStatus, replayCount]
      properties:
        id:
          type: integer
          format: int64
        actionLogId:
          type: integer
          format: int64
        effectIndex:
          type: integer
        effectType:
          type: string
          description: "Side-effect type, e.g. `webhook` or `log`."
        effectConfig:
          description: "Snapshot of the original SideEffect.Config blob so a future replay can dispatch without re-reading the ActionType."
        outcome:
          description: "Full SideEffectOutcome JSON ({type, status, attempts, error, durationMs})."
        createdAt:
          type: string
          format: date-time
        replayStatus:
          type: string
          enum: [pending, replayed, abandoned]
        replayedAt:
          type: string
          format: date-time
        replayCount:
          type: integer
    AdminSideEffectDLQListResponse:
      type: object
      description: PRD-V2 Gap-A4 round-34 wire shape for `GET /api/admin/side-effect-dlq`.
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminSideEffectDLQEntry"
    AdminSideEffectDLQAbandonResponse:
      type: object
      description: PRD-V2 Gap-A4 round-34 wire shape for `POST /api/admin/side-effect-dlq/{id}/abandon`.
      required: [id, abandoned, status]
      properties:
        id:
          type: integer
          format: int64
        abandoned:
          type: boolean
        status:
          type: string
          enum: [abandoned]
    AdminSideEffectDLQReplayResponse:
      type: object
      description: |
        PRD-V2 Gap-A4 round-35 wire shape for `POST
        /api/admin/side-effect-dlq/{id}/replay`. HTTP 200 indicates the
        replay MACHINERY ran (load + dispatch + persist); the
        webhook's actual success/failure lives inside `outcome.status`
        — operators reading "replayed: false" with `outcome.status:
        "failed"` know the dispatcher tried but the target is still
        broken.
      required: [id, replayed, status, replayCount, outcome]
      properties:
        id:
          type: integer
          format: int64
        replayed:
          type: boolean
          description: True when outcome.status='success' (terminal flip).
        status:
          type: string
          enum: [pending, replayed]
          description: Row's replay_status AFTER the replay attempt.
        replayCount:
          type: integer
          description: Total number of manual replay attempts so far.
        outcome:
          description: Full SideEffectOutcome ({type, status, attempts, error, durationMs}) from this attempt.
    AdminAuthKeysRotateResponse:
      type: object
      description: US-490 wire shape for `POST /api/admin/auth/keys/rotate`.
      required: [activeKeyId, keyIds, rotatedAt]
      properties:
        activeKeyId:
          type: string
          description: |
            Kid of the freshly appended key — the one stamped into the JOSE
            header of every token Sign() issues from now on.
        keyIds:
          type: array
          description: Full keyring, ordered oldest → newest. The last entry equals `activeKeyId`.
          items:
            type: string
        rotatedAt:
          type: string
          format: date-time
          description: Server timestamp at the moment the new key was appended.
    AdminAuthRevokeRequest:
      type: object
      description: |
        US-491 request body for `POST /api/auth/tokens/{jti}/revoke`. All fields
        are optional; the JTI in the path is sufficient on its own.
      properties:
        userId:
          type: string
          description: Optional subject of the token (recorded for audit).
        reason:
          type: string
          description: Free-form operator note (`logout`, `compromised`, etc.).
        expiresAt:
          type: string
          format: date-time
          description: |
            Original `exp` claim of the revoked token. When set, the background
            reaper prunes the row after this timestamp passes; otherwise a
            default 24h horizon is applied.
    AdminAuthRevokeResponse:
      type: object
      description: US-491 wire shape returned after a successful revoke.
      required: [jti, revokedAt]
      properties:
        jti:
          type: string
        revokedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      description: A single audit log entry.
      required: [id, actor_id, action, resource_type, resource_rid, ip, user_agent, ts]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_rid:
          type: string
        diff_json:
          type: object
          nullable: true
        ip:
          type: string
        user_agent:
          type: string
        ts:
          type: string
          format: date-time
    AuditEventsResponse:
      type: object
      description: Paginated list of audit events.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextPageToken:
          type: string
          description: Opaque cursor for the next page. Empty when no more pages remain.
    VertexGraphCreateRequest:
      type: object
      description: Request body for creating a Vertex SystemGraph.
      required: [ontologyRid, name]
      additionalProperties: false
      properties:
        ontologyRid:
          type: string
          description: Ontology RID the graph belongs to.
        name:
          type: string
          minLength: 1
          description: Human-readable graph name.
        versioned:
          type: boolean
          default: true
          description: Whether full graph saves should create version-history rows.
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional serialized graph workspace payload.
        createdBy:
          type: string
          description: Optional creator user ID recorded with the graph.
    VertexGraphUpdateRequest:
      type: object
      description: Request body for a full Vertex SystemGraph save.
      required: [payload]
      additionalProperties: false
      properties:
        payload:
          type: object
          additionalProperties: true
          description: Serialized graph workspace payload to persist.
    VertexGraphLayoutPatchRequest:
      type: object
      description: Request body for patching saved Vertex graph node positions.
      required: [positions]
      additionalProperties: false
      properties:
        positions:
          type: object
          additionalProperties: true
          description: Node position map merged into the graph payload's positions field.
    VertexGraphLayoutPatchResponse:
      type: object
      description: Confirmation returned after a Vertex graph layout patch.
      required: [rid]
      properties:
        rid:
          type: string
          description: Vertex graph RID whose layout was patched.
    VertexGraphDiffOp:
      type: object
      description: One RFC 6902 JSON Patch operation between two graph versions.
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace]
          description: JSON Patch operation.
        path:
          type: string
          description: RFC 6901 JSON Pointer path within the graph payload.
        value:
          nullable: true
          description: Replacement or inserted JSON value. Omitted for remove operations.
    VertexGraphDiffResponse:
      type: object
      description: RFC 6902 patch that transforms one graph version payload into another.
      required: [rid, from, to, ops]
      properties:
        rid:
          type: string
          description: Vertex graph RID.
        from:
          type: integer
          minimum: 1
          description: Source graph version number.
        to:
          type: integer
          minimum: 1
          description: Target graph version number.
        ops:
          type: array
          items:
            $ref: "#/components/schemas/VertexGraphDiffOp"
    VertexGraphTemplateSaveRequest:
      type: object
      description: Request body for saving a Vertex graph as a reusable template.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Optional template name. Blank values default to the source graph name with a template suffix.
        parameterizedFields:
          type: array
          description: JSON pointer paths that can be substituted when the template is instantiated.
          items:
            type: string
    VertexGraphTemplateSaveResponse:
      type: object
      description: Template metadata returned after saving a Vertex graph as a template.
      required: [rid, sourceGraphRid, name, parameterizedFields]
      properties:
        rid:
          type: string
          description: Resource identifier of the saved graph template.
        sourceGraphRid:
          type: string
          description: Graph RID used as the template source.
        name:
          type: string
        parameterizedFields:
          type: array
          items:
            type: string
    VertexGraphHistoryEntry:
      type: object
      description: One persisted version row for a Vertex graph.
      required: [version, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    VertexGraphHistoryResponse:
      type: object
      description: Ordered version history for a Vertex graph.
      required: [rid, versions]
      properties:
        rid:
          type: string
          description: Vertex graph RID.
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VertexGraphHistoryEntry"
    VertexGraphTemplateInstantiateRequest:
      type: object
      description: Optional substitution values for a parameterized Vertex graph template.
      additionalProperties: false
      properties:
        parameters:
          type: object
          additionalProperties: true
          description: Map of parameterized JSON pointer paths to replacement JSON values.
    VertexGraphTemplateInstantiateResponse:
      type: object
      description: Instantiated Vertex graph template payload.
      required: [sourceTemplateRid, sourceGraphRid, name, payload]
      properties:
        sourceTemplateRid:
          type: string
          description: Template RID that was instantiated.
        sourceGraphRid:
          type: string
          description: Source graph RID captured by the template.
        name:
          type: string
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Serialized graph payload with template parameters substituted.
    VertexGraph:
      type: object
      description: |
        Vertex SystemGraph wire shape. The `payload` object carries the
        serialized workspace state, including layers, edges, positions, time
        settings, and other graph-specific UI state.
      required:
        - rid
        - ontologyRid
        - name
        - version
        - versioned
        - payload
        - createdBy
        - createdAt
        - updatedAt
      properties:
        rid:
          type: string
          description: Resource identifier of the graph.
        ontologyRid:
          type: string
          description: Ontology RID the graph belongs to.
        name:
          type: string
        version:
          type: integer
          minimum: 1
        versioned:
          type: boolean
          description: Whether full graph saves create version-history rows.
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Serialized graph workspace. Share-link responses preserve the
            graph structure while masking layer object property values.
            Widget responses compact this payload by removing widget-noise
            keys such as `savedSelections` and `history`.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VertexScenarioRunCheckpoint:
      type: object
      description: Restartable checkpoint state for a Vertex scenario run.
      required: [runRid, scenarioRid, status, attemptsById, updatedAt]
      properties:
        runRid:
          type: string
          description: Scenario Run RID associated with this checkpoint.
        scenarioRid:
          type: string
          description: Scenario RID being executed.
        status:
          type: string
          enum: [pending, running, succeeded, failed, canceled]
          description: Lifecycle status captured at the checkpoint.
        completed:
          type: array
          description: Activity IDs already completed successfully.
          items:
            type: string
        lastActivity:
          type: string
          description: Last activity attempted by the workflow.
        attemptsById:
          type: object
          description: Per-activity attempt counts recorded for retry visibility.
          additionalProperties:
            type: integer
            minimum: 1
        error:
          type: string
          description: Terminal failure or cancellation message, when present.
        updatedAt:
          type: string
          format: date-time
    VertexScenarioRun:
      type: object
      description: Persisted Vertex scenario-run lifecycle record.
      required: [rid, scenarioRid, status, checkpoint, startedAt, createdAt]
      properties:
        rid:
          type: string
          description: Scenario Run RID.
        scenarioRid:
          type: string
          description: Scenario RID being executed.
        status:
          type: string
          enum: [pending, running, succeeded, failed, canceled]
          description: Current scenario-run lifecycle status.
        error:
          type: string
          description: Terminal failure or cancellation message, when present.
        checkpoint:
          $ref: "#/components/schemas/VertexScenarioRunCheckpoint"
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    VertexScenarioRunStartResponse:
      type: object
      description: Response returned after a scenario run is accepted.
      required: [runRid, status]
      properties:
        runRid:
          type: string
          description: Scenario Run RID to poll or cancel.
        status:
          type: string
          enum: [pending]
          description: Newly accepted runs start in pending status.
    VertexScenarioRunCancelResponse:
      type: object
      description: Response returned after a scenario-run cancellation is accepted.
      required: [runRid, status]
      properties:
        runRid:
          type: string
          description: Scenario Run RID whose cancellation was accepted.
        status:
          type: string
          enum: [canceling]
          description: Cancellation was signaled; poll the run for terminal canceled state.
    VertexShareLinkCreateResponse:
      type: object
      description: Opaque token minted for sharing a Vertex graph.
      required: [token, graphRid, createdBy, createdAt]
      properties:
        token:
          type: string
          description: Opaque share token used in `/api/vertex/v1/share-links/{token}/graph`.
        graphRid:
          type: string
          description: Graph RID the token resolves to.
        createdBy:
          type: string
          description: User ID that minted the share token.
        createdAt:
          type: string
          format: date-time
    VertexWidgetSaveRequest:
      type: object
      description: |
        Workshop vertex_graph widget save payload. `overrideGraphRid` lets a
        widget persist into a different target graph than the source graph in
        the URL.
      required: [payload]
      additionalProperties: false
      properties:
        payload:
          type: object
          additionalProperties: true
          description: Serialized graph payload to persist.
        overrideGraphRid:
          type: string
          description: Optional graph RID to save into instead of the source path RID.
    VertexControlPanelConfig:
      type: object
      description: |
        Vertex operator-tunable runtime knobs. GET returns these defaults
        until an admin saves a replacement through PUT.
      required:
        - defaultWindowDays
        - pollingIntervalSec
        - searchAroundMaxNodes
        - searchAroundMaxDepth
        - missingDataWarningHours
      properties:
        defaultWindowDays:
          type: integer
          minimum: 1
          default: 30
          description: Default lookback window, in days, for newly opened Vertex graphs.
        pollingIntervalSec:
          type: integer
          minimum: 1
          default: 5
          description: Live-mode polling interval in seconds.
        searchAroundMaxNodes:
          type: integer
          minimum: 1
          default: 200
          description: Maximum nodes a Vertex search-around expansion may add.
        searchAroundMaxDepth:
          type: integer
          minimum: 1
          default: 3
          description: Maximum search-around traversal depth.
        missingDataWarningHours:
          type: integer
          minimum: 1
          default: 24
          description: Hours after which stale time-series data is flagged as missing.
    VertexControlPanelUpdateRequest:
      type: object
      description: |
        Sparse update for Vertex control-panel config. Omitted fields keep
        their current values; supplied values must be strictly positive.
      additionalProperties: false
      properties:
        defaultWindowDays:
          type: integer
          minimum: 1
        pollingIntervalSec:
          type: integer
          minimum: 1
        searchAroundMaxNodes:
          type: integer
          minimum: 1
        searchAroundMaxDepth:
          type: integer
          minimum: 1
        missingDataWarningHours:
          type: integer
          minimum: 1
    CreateApplicationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-friendly display name.
        description:
          type: string
          description: Optional free-form description shown on the developer console.
        redirectUris:
          type: array
          items:
            type: string
          description: Allowed OAuth redirect URIs for authorization-code flows.
        scopes:
          type: array
          items:
            type: string
          description: Requested OAuth scopes.
    CreateApplicationResponse:
      type: object
      required: [id, name, clientId, clientSecret, createdBy, createdAt, updatedAt]
      description: |
        Created application record. `clientSecret` is the plaintext OAuth
        secret; it is returned ONLY on creation and MUST be persisted by the
        caller — it is never retrievable again.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        redirectUris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationSummary:
      type: object
      required: [id, name, clientId, createdBy, createdAt, updatedAt]
      description: Redacted application record. `clientSecret` is intentionally absent.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        clientId:
          type: string
        redirectUris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListApplicationsResponse:
      type: object
      required: [applications]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"
    ApplicationUsageResponse:
      type: object
      description: Aggregated per-window API usage summary for an OAuth application.
      required: [applicationId, clientId, windows]
      properties:
        applicationId:
          type: string
        clientId:
          type: string
        windows:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationUsageWindow"
    ApplicationUsageWindow:
      type: object
      required: [window, since, until, total, errors, byStatus, byMethod, topRoutes, p50Ms, p95Ms, p99Ms]
      properties:
        window:
          type: string
          description: Human-readable window label (24h, 7d, 30d).
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        total:
          type: integer
        errors:
          type: integer
          description: Requests with status >= 400.
        byStatus:
          type: object
          additionalProperties:
            type: integer
          description: Status-code family buckets (2xx, 3xx, 4xx, 5xx, other).
        byMethod:
          type: object
          additionalProperties:
            type: integer
        topRoutes:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationUsageRouteStat"
        p50Ms:
          type: number
        p95Ms:
          type: number
        p99Ms:
          type: number
    ApplicationUsageRouteStat:
      type: object
      required: [endpoint, method, count, errors, p95Ms]
      properties:
        endpoint:
          type: string
        method:
          type: string
        count:
          type: integer
        errors:
          type: integer
        p95Ms:
          type: number
    OAuthTokenResponse:
      type: object
      description: |
        RFC 6749 §5.1 token response. `refresh_token` is only present for the
        `authorization_code` grant; `client_credentials` returns access only.
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Opaque bearer token; use in the `Authorization` header.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds.
        refresh_token:
          type: string
          description: Opaque refresh token (authorization_code grant only).
        scope:
          type: string
          description: Space-separated list of scopes granted to this token.
    OAuthTokenError:
      type: object
      description: RFC 6749 §5.2 error envelope.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - server_error
        error_description:
          type: string
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Kubernetes liveness probe. Always returns 200 with
        `{"status":"alive"}` regardless of downstream dependency state.
        A passing liveness check means "this process is responsive".
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe (Kubernetes-conventional alias)
      description: |
        Alias for `/health`. Returned for parity with the conventional
        Kubernetes liveness probe path so cluster manifests can pin
        `livenessProbe.httpGet.path: /health/live` without a custom
        rewrite. Always returns 200 with `{"status":"alive"}`.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: |
        Kubernetes readiness probe. Returns 200 with
        `{"status":"ready","checks":{...}}` when every configured
        dependency (PostgreSQL, NATS, Bleve) passes its probe, or 503 with
        `{"status":"unready","checks":{...}}` when any configured dependency
        fails. Dependencies that are not wired (degraded mode) are reported
        as `"skipped"` and do not cause readiness to fail.

        Lifecycle gate (US-446): before the server has finished wiring
        every subsystem the response is 503 with `{"status":"starting"}`;
        once the graceful-shutdown signal fires the response flips to 503
        with `{"status":"draining"}` so orchestrators (k8s, load
        balancers) pull the pod from rotation while in-flight requests
        drain.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready (or degraded mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        "503":
          description: |
            Service is not ready — either at least one configured dependency
            probe failed (`unready`), or the server is still wiring
            (`starting`), or graceful shutdown has begun (`draining`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unready, starting, draining]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe (Kubernetes /healthz alias)
      description: |
        US-446 Kubernetes-conventional alias for `/health`. Always returns
        200 with `{"status":"alive"}` regardless of downstream dependency
        state.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /healthz/live:
    get:
      operationId: getHealthzLive
      summary: Liveness probe (Kubernetes /healthz/live alias)
      description: |
        US-446 Kubernetes-conventional alias for `/health/live`. Always
        returns 200 with `{"status":"alive"}` regardless of downstream
        dependency state.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /healthz/ready:
    get:
      operationId: getHealthzReady
      summary: Readiness probe (Kubernetes /healthz/ready alias)
      description: |
        US-446 Kubernetes-conventional alias for `/health/ready`. Same
        lifecycle gate (`starting` → `ready` → `draining`) and dependency
        probe (PostgreSQL, NATS, Bleve) semantics as `/health/ready`.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready (or degraded mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        "503":
          description: |
            Service is not ready — either at least one configured dependency
            probe failed (`unready`), or the server is still wiring
            (`starting`), or graceful shutdown has begun (`draining`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unready, starting, draining]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics scrape endpoint
      description: |
        Exposes the Weave metric registry in Prometheus text format. The
        endpoint is intentionally unauthenticated so a sidecar / scraper
        can hit it without provisioning credentials. Disable with
        `WEAVE_METRICS_ENABLED=false` if the deployment runs in an
        untrusted network. Standard metrics include
        `weave_http_requests_total`, `weave_http_request_duration_seconds`,
        `weave_nats_publish_total`, `weave_db_query_duration_seconds`,
        `weave_bleve_search_duration_seconds`, and `weave_build_info`.
      tags: [Observability]
      security: []
      responses:
        "200":
          description: Prometheus exposition format text response.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP weave_http_requests_total Total HTTP requests handled by the Weave server.
                  # TYPE weave_http_requests_total counter
                  weave_http_requests_total{method="GET",path="/health",status="200"} 5
  /mcp:
    post:
      operationId: mcpJSONRPC
      summary: Model Context Protocol JSON-RPC 2.0 endpoint
      description: |
        Single JSON-RPC 2.0 endpoint that exposes Weave's ontology to AI
        agents (Claude Desktop, Cursor, GPT, etc.) via the Model Context
        Protocol. Supported methods:

        - `initialize` — handshake; returns protocol version, capabilities, and serverInfo
        - `tools/list` — list registered Weave tools and their input schemas
        - `tools/call` — invoke a tool by name with arguments
        - `prompts/list` — returns an empty list (Weave does not yet expose prompts)
        - `resources/list` — returns an empty list
        - `ping` — liveness check

        The seven Weave tools are: `weave_list_ontologies`,
        `weave_list_object_types`, `weave_get_object`, `weave_list_objects`,
        `weave_search_objects`, `weave_list_action_types`, and
        `weave_apply_action`. See docs/mcp.md for the full catalogue.

        Per JSON-RPC 2.0, all protocol errors (parse error, invalid request,
        method not found, invalid params, internal error, application
        error) are returned in the response envelope with HTTP 200. Non-200
        status codes are reserved for transport-level failures.
      tags: [MCP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                JSON-RPC 2.0 request envelope. The `id` field is required for
                requests that expect a response and omitted for notifications.
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  description: Request id (string, number, or null). Omitted for notifications.
                method:
                  type: string
                  example: tools/call
                params:
                  type: object
      responses:
        "200":
          description: |
            JSON-RPC 2.0 response envelope. Contains either a `result` or an
            `error` object — never both. Application errors travel here too.
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc]
                properties:
                  jsonrpc:
                    type: string
                    enum: ["2.0"]
                  id:
                    description: Echo of the request id (or null).
                  result:
                    type: object
                    description: Method-specific result. Present on success.
                  error:
                    type: object
                    description: JSON-RPC error object. Present on failure.
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data: {}
        "204":
          description: Notification accepted (request had no `id` field).
        "405":
          description: HTTP method other than POST.
  /api/auth/login:
    post:
      operationId: login
      summary: Issue access and refresh tokens
      description: |
        Validates credentials, mints an RS256 JWT access token and a rotating
        refresh token. Returns the user's roles, scoped ontology roles, and
        token TTL.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh token and mint a new access token
      description: |
        Rotates the supplied refresh token (from body or
        `weave_refresh` cookie) and returns a new access + refresh pair with
        freshly resolved roles.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      description: |
        Revokes the supplied refresh token (or the cookie value), clears the
        refresh cookie, and always returns 204. Idempotent.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logout completed.
  /api/v2/me:
    get:
      operationId: getMe
      summary: Return the authenticated user
      description: Returns the resolved roles, scoped roles, and permission set.
      tags: [Auth]
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies:
    get:
      operationId: listOntologies
      summary: List ontologies
      description: Returns all ontologies. No pagination (Foundry OSv2 convention).
      tags: [Metadata]
      responses:
        "200":
          description: Ontology list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}:
    get:
      operationId: getOntology
      summary: Get a single ontology
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: The ontology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ontology"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes:
    get:
      operationId: listObjectTypes
      summary: List object types in an ontology
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: Object type list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectTypeListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      operationId: createObjectType
      summary: Create a new object type
      description: |
        Creates an ObjectType in the given ontology. If `?branch=` is
        supplied the create is recorded as an ADDED branch change instead
        of being written to main.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: branch
          required: false
          schema:
            type: string
          description: Optional branch ID to route the write through.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjectTypeRequest"
      responses:
        "201":
          description: Object type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectType"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes/{objectTypeApiName}:
    get:
      operationId: getObjectType
      summary: Get a single object type
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectTypeApiName"
      responses:
        "200":
          description: Object type wire format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectType"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes/byRid/{objectTypeRid}:
    put:
      operationId: updateObjectType
      summary: Update an existing object type
      description: |
        Updates an ObjectType by RID. If `?branch=` is supplied the update
        is recorded as a MODIFIED branch change instead of being written
        to main.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectTypeRid
          required: true
          schema:
            type: string
          description: RID of the ObjectType to update.
        - in: query
          name: branch
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObjectTypeRequest"
      responses:
        "200":
          description: Updated object type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectType"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      operationId: deleteObjectType
      summary: Delete an object type
      description: |
        Deletes an ObjectType by RID. ACTIVE / PROMOTED object types on
        main are rejected with 409; deprecate them first. If `?branch=`
        is supplied the delete is recorded as a DELETED branch change.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectTypeRid
          required: true
          schema:
            type: string
        - in: query
          name: branch
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes/byRid/{objectTypeRid}/properties:
    get:
      operationId: listPropertiesForObjectTypeAdmin
      summary: List raw Property rows for an object type (admin)
      description: |
        Returns the raw Property rows for the given ObjectType, used by the
        Ontology Manager visual property editor. If `?branch=` is supplied,
        the response reflects the branch overlay.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectTypeRid
          required: true
          schema:
            type: string
        - in: query
          name: branch
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Property list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      operationId: createProperty
      summary: Create a property on an object type
      description: |
        Creates a Property on the given ObjectType. If `?branch=` is supplied
        the create is recorded as an ADDED branch change instead of being
        written to main.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectTypeRid
          required: true
          schema:
            type: string
        - in: query
          name: branch
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
      responses:
        "201":
          description: Created property.
          content:
