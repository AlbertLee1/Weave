  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/geotemporalSeries/{propertyName}/streamHistoricValues:
    post:
      operationId: streamGeotemporalHistoricValues
      summary: Stream every historic value of a geotemporal series property
      description: |
        Returns every value in the geotemporal series ordered by time
        ascending. The request body is reserved for future range filters
        and is currently ignored on this server.
      tags: [GeotemporalSeriesProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          schema:
            type: string
        - in: path
          name: primaryKey
          required: true
          schema:
            type: string
        - in: path
