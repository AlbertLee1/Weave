        "200":
          description: Values in the series, ordered ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeotemporalSeriesValue"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/ciphertexts/{property}/decrypt:
    get:
      operationId: decryptCipherTextProperty
      summary: Decrypt a CipherTextProperty
      description: |
        Reads the ciphertext stored under the addressed object's property and
        returns the plaintext via the server-configured Decryptor. The default
        single-machine build ships an envelope-encryption AES-256-GCM
        decryptor (wire format `v1:<base64url(nonce||sealed)>`); a
        KMS-backed Decryptor can be wired in place without changing the API.
      tags: [CipherTextProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          schema:
            type: string
        - in: path
          name: primaryKey
          required: true
          schema:
            type: string
        - in: path
          name: property
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decryption result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecryptionResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/transactions/{transactionId}/edits:
    post:
      operationId: applyOntologyTransactionEdits
      summary: Append edits to an OntologyTransaction (experimental)
      description: |
        **Experimental** — this endpoint requires `?preview=true` and is
        subject to change. Appends a batch of edits to an open
        OntologyTransaction buffer identified by `{transactionId}`.
        Buffered edits are ephemeral and do NOT survive server restarts
        in the single-machine build; commit / abort semantics are
        intentionally omitted until the Foundry transaction contract
        stabilises.
      tags: [OntologyTransaction]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
          description: Opaque client-supplied identifier for the open transaction.
        - in: query
          name: preview
          required: true
          schema:
            type: string
            enum: ["true"]
          description: Must be `true`; the endpoint is experimental and gated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionEditRequest"
      responses:
        "200":
          description: Edits appended to the transaction buffer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEditResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/transactions/{transactionId}:
    get:
      operationId: getOntologyTransaction
      summary: Read the current edit buffer for an OntologyTransaction (experimental)
      description: |
        **Experimental** — this endpoint requires `?preview=true` and is
        subject to change. Returns the full append-ordered list of edits
        buffered on `{transactionId}`. Unknown transaction IDs return
        `{totalEdits: 0, edits: []}` rather than 404, matching the POST
        endpoint's "auto-created on first use" semantic.
      tags: [OntologyTransaction]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
          description: Opaque client-supplied identifier for the open transaction.
        - in: query
          name: preview
          required: true
          schema:
            type: string
            enum: ["true"]
          description: Must be `true`; the endpoint is experimental and gated.
      responses:
        "200":
          description: Current edit buffer for the transaction.
          content:
            application/json:
              schema:
                type: object
                required: [transactionId, totalEdits, edits]
                properties:
                  transactionId:
                    type: string
                  totalEdits:
                    type: integer
                  edits:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionEdit"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      operationId: abortOntologyTransaction
      summary: Discard an OntologyTransaction edit buffer (experimental)
      description: |
        **Experimental** — this endpoint requires `?preview=true` and is
        subject to change. Removes any buffered edits for
        `{transactionId}`. Idempotent: deleting an unknown transaction
        returns 204 so retries are safe.
      tags: [OntologyTransaction]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
          description: Opaque client-supplied identifier for the open transaction.
        - in: query
          name: preview
          required: true
          schema:
            type: string
            enum: ["true"]
          description: Must be `true`; the endpoint is experimental and gated.
      responses:
        "204":
          description: Transaction discarded (or did not exist).
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/sqlQueries/execute:
    post:
      operationId: executeSqlQuery
      summary: Execute a read-only SQL query
      description: |
        Executes a single-statement SELECT query against the ontology
        store and returns a Foundry QueryStatus union. Weave runs all
        queries synchronously on the request goroutine so the response
        always resolves to the terminal "succeeded" or "failed" variant;
        the "running" / "canceled" variants are documented for SDK
        compatibility but never emitted by this implementation.
      tags: [SqlQueries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryExecuteRequest"
      responses:
        "200":
          description: |
            Query completed in a terminal state. Inspect `type` to
            disambiguate success from failure; successful responses
            carry only `queryId`, failed responses add `errorMessage`
            and `failureReason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStatus"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/objects/{rid}/lineage:
    get:
      operationId: getObjectLineage
      summary: Read upstream / downstream lineage from a root RID
      description: |
        Returns the depth-bounded lineage graph rooted at `{rid}`. Each
        edge in `lineage_edges` records one upstream (action-log /
        pipeline-run / dataset / ...) → downstream (object) relation
        written by the action executor or pipeline ingest.

        Direction semantics:
          * `upstream`   — walk back via `downstream_rid` (default).
          * `downstream` — walk forward via `upstream_rid`.
          * `both`       — explore both directions in lockstep.

        Depth defaults to 1 and is capped at 10. The response sets
        `truncated: true` when any node's neighbour list hit the
        per-step page limit so callers can re-query with a smaller fan
        if completeness matters more than freshness.
      tags: [Lineage]
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            type: string
          description: |
            Root RID. Any well-formed `ri.{service}.{realm}.{type}.{...}`
            handle is accepted — typically an object RID (`ri.phonograph2-objects.main.object.<type>.<pk>`)
            but action-log / pipeline-run RIDs are valid roots too.
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum: [upstream, downstream, both]
            default: upstream
          description: Traversal direction relative to the root.
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
          description: BFS depth from the root. Capped at 10.
      responses:
        "200":
          description: Lineage graph rooted at `{rid}`.
          content:
            application/json:
              schema:
                type: object
                required: [root, direction, depth, nodes, edges]
                properties:
                  root:
                    type: string
                    description: Echo of the path RID.
                  direction:
                    type: string
                    enum: [upstream, downstream, both]
                  depth:
                    type: integer
                  truncated:
                    type: boolean
                    description: |
                      Set when any node's neighbour list hit the per-step
                      page limit. The graph is still valid — additional
                      edges simply exist beyond the BFS frontier.
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [rid]
                      properties:
                        rid:
                          type: string
                        type:
                          type: string
                          description: Resource type segment of the RID (e.g. `object`, `action-log`, `run`).
                  edges:
                    type: array
                    items:
                      type: object
                      required: [from, to, timestamp]
                      properties:
                        from:
                          type: string
                          description: upstream_rid
                        to:
                          type: string
                          description: downstream_rid
                        operation:
                          type: string
                          description: |
                            Free-form operation discriminator (CREATE / MODIFY / DELETE / ...).
                        timestamp:
                          type: string
                          format: date-time
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Lineage store is not configured (degraded mode without PostgreSQL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/lineage/property/{rid}:
    get:
      operationId: getPropertyLineage
      summary: List upstream dataset columns that feed an ObjectType property
      description: |
        US-377. Returns every `lineage_column_edges` row whose
        `dst_property_rid` matches the supplied path parameter. Edges
        are derived synchronously from `datasource_bindings.column_mapping`
        on every binding write (CREATE / UPDATE) and cleared on binding
        delete, so the result reflects the binding state in lockstep.

        Newest-first ordering by `ts` (then internal id as a tiebreaker).
        The response sets `truncated: true` when the underlying listing
        hit the per-call page limit (200) so callers know additional
        edges may exist beyond the response window.
      tags: [Lineage]
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            type: string
          description: |
            Downstream property RID
            (`ri.ontology.main.property.<uuid>`).
      responses:
        "200":
          description: Upstream column edges feeding the property.
          content:
            application/json:
              schema:
                type: object
                required: [propertyRid, upstream, truncated]
                properties:
                  propertyRid:
                    type: string
                    description: Echo of the path RID.
                  truncated:
                    type: boolean
                    description: |
                      Set when the listing hit the per-call page limit;
                      additional edges exist beyond the response window.
                  upstream:
                    type: array
                    items:
                      type: object
                      required: [bindingRid, srcDatasetRid, srcColumn, timestamp]
                      properties:
                        bindingRid:
                          type: string
                          description: Owning datasource_binding RID.
                        srcDatasetRid:
                          type: string
                        srcColumn:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Column lineage store is not configured (degraded mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/lineage/dataset-columns/impact:
    get:
      operationId: getDatasetColumnImpact
      summary: List ObjectType properties impacted by an upstream dataset column
      description: |
        US-377. Reverse-impact analysis for column-level lineage.
        Given an upstream `(dataset, column)` pair, returns every
        downstream property that derives from it via a
        `datasource_bindings.column_mapping` entry.

        Used by admin tooling to answer "what properties break if I
        drop this column?" before applying a destructive schema change.
        Newest-first ordering; `truncated: true` when the listing hit
        the per-call page limit (200).
      tags: [Lineage]
      parameters:
        - in: query
          name: dataset
          required: true
          schema:
            type: string
          description: Upstream dataset RID.
        - in: query
          name: column
          required: true
          schema:
            type: string
          description: Upstream column name within the dataset.
      responses:
        "200":
          description: Downstream properties impacted by the supplied (dataset, column).
          content:
            application/json:
              schema:
                type: object
                required: [datasetRid, column, impacted, truncated]
                properties:
                  datasetRid:
                    type: string
                  column:
                    type: string
                  truncated:
                    type: boolean
                  impacted:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          bindingRid,
                          dstObjectTypeRid,
                          dstPropertyRid,
                          dstPropertyApiName,
                          timestamp,
                        ]
                      properties:
                        bindingRid:
                          type: string
                        dstObjectTypeRid:
                          type: string
                        dstPropertyRid:
                          type: string
                        dstPropertyApiName:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Column lineage store is not configured (degraded mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/datasets/{rid}/history:
    get:
      operationId: getDatasetHistory
      summary: Walk the dataset_transactions chain for a dataset (US-379).
      description: |
        Returns the per-ontology dataset_transactions chain so SDK
        clients can audit the edit history and resolve `?asOf=tx-...`
        lookups against the OSS load API. Each EditBatch processed by
        the funnel consumer lands one row whose `txId` is the
        canonical "tx-<id>" reference and whose `parentTxId` points at
        the previous transaction for the same ontology (empty for the
        chain genesis).

        `{rid}` accepts either the ontology RID or its api name —
        matching the rest of the `/api/v2/ontologies/{ontologyApiName}`
        surface — and resolves through the OMS GetOntology lookup.

        Ordering is `committed_at` DESC (newest first); the listing is
        capped at 1000 rows for response-size sanity. Returns
        `DatasetHistoryUnavailable` 400 when the dataset_transactions
        store is not configured (degraded-mode deployments without PG).
      tags: [DatasetTransactions]
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            type: string
          description: Ontology RID or api name to fetch the chain for.
      responses:
        "200":
          description: Transaction chain for the dataset, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      required: [txId, ontologyApiName, committedAt, editsCount]
                      properties:
                        txId:
                          type: string
                          description: Canonical "tx-<id>" reference.
                        parentTxId:
                          type: string
                          description: Previous tx in the chain (empty for genesis).
                        ontologyApiName:
                          type: string
                        committedAt:
                          type: string
                          format: date-time
                        editsCount:
                          type: integer
                        userId:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Dataset not found (no ontology matches the supplied rid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/datasets/{rid}/transactions:
    post:
      operationId: createDatasetTransaction
      summary: Record an explicit dataset_transactions checkpoint (US-388).
      description: |
        Creates a fresh `dataset_transactions` row whose `parentTxId`
        points at the current chain head for the dataset's ontology, so a
        caller can pin an `?asOf=tx-...` reference to a known checkpoint
        without waiting for an EditBatch to drift through the funnel. The
        body is optional — when supplied it carries an informational
        `editsCount` and an override `userId` for non-interactive
        callers.
      tags: [DatasetTransactions]
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            type: string
          description: Ontology RID or api name.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                editsCount:
                  type: integer
      responses:
        "201":
          description: Newly recorded checkpoint transaction.
          content:
            application/json:
              schema:
                type: object
                required: [txId, ontologyApiName, committedAt, editsCount]
                properties:
                  txId:
                    type: string
                  parentTxId:
                    type: string
                  ontologyApiName:
                    type: string
                  committedAt:
                    type: string
                    format: date-time
                  editsCount:
                    type: integer
                  userId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Dataset not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/datasets/{rid}/rollback:
    post:
      operationId: rollbackDataset
      summary: Roll the dataset back to a target tx (US-388).
      description: |
        Marks every `dataset_transactions` row newer than the supplied
        `?to=tx-...` target as rolled back, replays each affected object
        back to the per-PK state captured at the target's `committedAt`
        instant via the existing US-223 `SnapshotObjectsAt` reader, and
        records a fresh "rollback" transaction at the new chain head. The
        replay deletes objects that did not yet exist at the target and
        re-indexes the prior state for everything that did.

        Returns `RollbackTargetNotFound` 404 when `?to=` references a
        transaction that does not exist; `RollbackTargetWrongOntology`
        400 when the target belongs to a different ontology than the URL
        `{rid}`. `DatasetRollbackUnavailable` 400 surfaces in degraded
        mode (no `DatasetTransactionStore`).
      tags: [DatasetTransactions]
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            type: string
          description: Ontology RID or api name.
        - in: query
          name: to
          required: true
          schema:
            type: string
          description: Rollback target — must start with `tx-`.
      responses:
        "200":
          description: Rollback summary.
          content:
            application/json:
              schema:
                type: object
                required: [rolledBackTxIds, restoredObjects, deletedObjects]
                properties:
                  rolledBackTxIds:
                    type: array
                    items:
                      type: string
                  restoredObjects:
                    type: integer
                  deletedObjects:
                    type: integer
                  newTransaction:
                    type: object
                  targetTx:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Dataset or rollback target not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/vertex/v1/graphs:
    post:
      operationId: createVertexGraph
      summary: Create a Vertex graph
      description: |
        Creates a Vertex SystemGraph workspace for an ontology. The optional
        payload carries the initial serialized graph state; when omitted, the
        server creates an empty graph payload.
      tags: [Vertex]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VertexGraphCreateRequest"
      responses:
        "201":
          description: Vertex graph created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraph"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}:
    get:
      operationId: getVertexGraph
      summary: Get a Vertex graph
      description: |
        Returns the current persisted Vertex SystemGraph payload and metadata
        for the graph identified by `{rid}`.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Vertex graph RID.
          schema:
            type: string
      responses:
        "200":
          description: Current Vertex graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraph"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateVertexGraph
      summary: Update a Vertex graph
      description: |
        Performs a full graph save by replacing the serialized payload. For
        versioned graphs, the save bumps the graph version and records a
        history row.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Vertex graph RID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VertexGraphUpdateRequest"
      responses:
        "200":
          description: Updated Vertex graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraph"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}/layout:
    patch:
      operationId: patchVertexGraphLayout
      summary: Patch Vertex graph layout
      description: |
        Merges drag-driven node positions into the graph payload's `positions`
        field without creating a new graph version.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Vertex graph RID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VertexGraphLayoutPatchRequest"
      responses:
        "200":
          description: Vertex graph layout patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraphLayoutPatchResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}/diff:
    get:
      operationId: diffVertexGraphVersions
      summary: Diff Vertex graph versions
      description: |
        Returns an RFC 6902 JSON Patch that transforms the `from` version's
        graph payload into the `to` version's graph payload.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Vertex graph RID.
          schema:
            type: string
        - in: query
          name: from
          required: true
          description: Source graph version number.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: to
          required: true
          description: Target graph version number.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Vertex graph version diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraphDiffResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}/duplicate:
    post:
      operationId: duplicateVertexGraph
      summary: Duplicate a Vertex graph
      description: |
        Creates a new graph RID with a deep-copied payload from the source
        graph. The duplicate starts at version 1 with independent history.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Source Vertex graph RID.
          schema:
            type: string
      responses:
        "201":
          description: Duplicated Vertex graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraph"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}/save-as-template:
    post:
      operationId: saveVertexGraphAsTemplate
