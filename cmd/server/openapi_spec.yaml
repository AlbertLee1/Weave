    DatasourceBinding:
      type: object
      required: [rid, datasetRid, branch, columnMapping, isPrimary]
      properties:
        rid:
          type: string
        datasetRid:
          type: string
          description: |
            Foundry-style RID of the source dataset. The current Weave ontology
            stores the *dataset* identifier verbatim; the underlying table name
            (when relevant) lives inside the column_mapping payload.
        branch:
          type: string
          description: Dataset branch this binding reads from. Defaults to "main".
        columnMapping:
          type: object
          additionalProperties: true
          description: |
            Map from ObjectType property apiName to source column name. Drives
            both materialization and column-level lineage edge derivation
            (US-377).
        isPrimary:
          type: boolean
          description: |
            One ObjectType may bind to multiple datasets; exactly one binding
            should be marked primary. Lineage queries prefer the primary
            binding when resolving the canonical source column for a property.
    CreateDatasourceBindingRequest:
      type: object
      required: [datasetRid]
      properties:
        datasetRid:
          type: string
        branch:
          type: string
        columnMapping:
          type: object
          additionalProperties: true
        isPrimary:
          type: boolean
    UpdateDatasourceBindingRequest:
      type: object
      required: [datasetRid]
      properties:
        datasetRid:
          type: string
        branch:
          type: string
        columnMapping:
          type: object
          additionalProperties: true
        isPrimary:
          type: boolean
    ActionLog:
      type: object
      required: [id, actionTypeRid, userId, status, createdAt]
