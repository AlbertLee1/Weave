  /api/v2/ontologies/{ontologyApiName}/functions:
    post:
      operationId: createFunction
      summary: Create a new Function
      tags: [Functions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: branch
          required: false
          schema:
            type: string
          description: |
            US-389: publish the row on the named ontology branch. Empty /
            omitted normalises to "main". The query parameter is
            authoritative when both ?branch= and the body's branchId field
            are present. The (ontology, name, version, branchId) UNIQUE key
            lets a branch publish its own version of an existing
            name@version without colliding with main.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sourceCode]
              properties:
                name:
                  type: string
                sourceCode:
                  type: string
                version:
                  type: string
                  description: |
                    Semver string. Defaults to "1.0.0" when omitted (US-217).
                    Posting a name+version pair that already exists in the
                    ontology+branch returns 409 — new versions never
                    overwrite older rows.
                  example: "1.0.0"
                runtime:
                  type: string
                  enum: [goja, http]
                signature:
                  type: object
                pure:
                  type: boolean
                  default: false
                  description: |
                    US-221: opt the function into the per-process LRU+TTL
                    result cache. Defaults to false.
                createdBy:
                  type: string
                branchId:
                  type: string
                  description: |
                    US-389: ontology branch the row should land on. The
                    ?branch= query parameter takes precedence when both are
                    set; empty / omitted normalises to "main".
