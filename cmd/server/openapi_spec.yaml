  /api/v2/ontologies/{ontologyApiName}/actions/{action}/apply:
    post:
      operationId: applyAction
      summary: Apply a single action (Foundry OSv2)
      description: |
        Executes a single action. The action API name is in the URL path {action}.
        Supports options.mode (VALIDATE_ONLY | VALIDATE_AND_EXECUTE) and
        options.returnEdits (ALL | ALL_V2_WITH_DELETIONS | NONE).
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyActionRequest"
      responses:
        "200":
          description: Action result (SyncApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncApplyActionResponseV2"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/{action}/applyWithOverrides:
    post:
      operationId: applyActionWithOverrides
      summary: Apply a single action with parameter overrides (Foundry OSv2)
      description: |
        Wraps an ApplyActionRequestV2 in an envelope carrying an
        ApplyActionOverrides object. Overrides.parameters are merged into
        request.parameters (overrides win on key collisions) before the
        request is routed through the normal apply code path. The response
        matches SyncApplyActionResponseV2 exactly.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyActionWithOverridesRequest"
      responses:
        "200":
          description: Action result (SyncApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncApplyActionResponseV2"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/{action}/applyBatch:
    post:
      operationId: applyActionBatch
      summary: Apply a batch of the same action (Foundry OSv2)
      description: |
        Executes a batch of the same action type. The action API name is in
        the URL path {action}. Batch is always atomic (all-or-nothing).
        Supports options.returnEdits (ALL | NONE).
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name. All batch items share this action.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyBatchRequest"
      responses:
        "200":
          description: Batch result (BatchApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchApplyActionResponseV2"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/attachments/upload:
    post:
      operationId: uploadAttachment
      summary: Upload an attachment with a server-generated RID
      description: |
        Creates a new attachment blob. The server allocates a fresh
        ri.attachments.main.attachment.* RID. The request body is the raw
        blob bytes; the Content-Type header becomes the stored mediaType.
        Attachment paths are global — they do NOT include {ontology}.
      tags: [Attachments]
      parameters:
        - in: query
          name: filename
          required: true
          description: Original filename to associate with the blob.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Attachment metadata for the freshly uploaded blob.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentV2"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/attachments/upload/{attachmentRid}:
    post:
      operationId: uploadAttachmentWithRid
      summary: Upload an attachment with a caller-supplied RID
      description: |
        Creates a new attachment blob under a caller-supplied RID. Useful
        for clients that need to reference the attachment before upload
        (e.g. constructing an Action payload). Returns 409 if the RID is
        already taken.
      tags: [Attachments]
      parameters:
        - in: path
          name: attachmentRid
          required: true
          description: Attachment RID (must match ri.attachments.main.attachment.*).
          schema:
            type: string
        - in: query
          name: filename
          required: true
          description: Original filename to associate with the blob.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Attachment metadata for the freshly uploaded blob.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentV2"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: The RID is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/ontologies/attachments/{attachmentRid}:
    get:
      operationId: getAttachmentMetadata
      summary: Get attachment metadata by RID
      description: |
        Returns the AttachmentV2 metadata record (rid, filename, sizeBytes,
        mediaType) for the given attachment RID. The blob body is retrieved
        via the companion /content endpoint.
      tags: [Attachments]
      parameters:
        - in: path
          name: attachmentRid
          required: true
          description: Attachment RID.
          schema:
            type: string
      responses:
        "200":
          description: Attachment metadata record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentV2"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/attachments/{attachmentRid}/content:
    get:
      operationId: getAttachmentContent
      summary: Download attachment blob bytes
      description: |
        Streams the raw blob bytes for the given attachment RID. The
        response Content-Type is the stored mediaType.
      tags: [Attachments]
      parameters:
        - in: path
          name: attachmentRid
          required: true
          description: Attachment RID.
          schema:
            type: string
      responses:
        "200":
          description: Raw blob bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/attachments/{property}:
    get:
      operationId: getAttachmentPropertyMetadata
      summary: Get attachment metadata via object property
      description: |
        Returns the AttachmentV2 metadata for the attachment stored in the
        given object's attachment property. For single-valued attachment
        properties the only stored RID is resolved automatically; for
        multi-valued attachmentArray properties the caller must use the
        companion /{attachmentRid} variant.
      tags: [AttachmentProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          description: ObjectType API name.
          schema:
            type: string
        - in: path
          name: primaryKey
          required: true
          description: Primary key of the object.
          schema:
            type: string
        - in: path
          name: property
          required: true
          description: Attachment property API name on the object type.
          schema:
            type: string
      responses:
        "200":
          description: Attachment metadata record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentV2"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/attachments/{property}/content:
    get:
      operationId: getAttachmentPropertyContent
      summary: Download attachment blob via object property
      description: |
        Streams the raw blob bytes for the attachment stored in the given
        object's attachment property. The response Content-Type is the
        stored mediaType.
      tags: [AttachmentProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          schema:
            type: string
