security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Kubernetes liveness probe. Always returns 200 with
        `{"status":"alive"}` regardless of downstream dependency state.
        A passing liveness check means "this process is responsive".
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: |
        Kubernetes readiness probe. Returns 200 with
        `{"status":"ready","checks":{...}}` when every configured
        dependency (PostgreSQL, NATS, Bleve) passes its probe, or 503 with
        `{"status":"unready","checks":{...}}` when any configured dependency
        fails. Dependencies that are not wired (degraded mode) are reported
        as `"skipped"` and do not cause readiness to fail.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is ready (or degraded mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        "503":
          description: Service is unready — at least one configured dependency probe failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unready]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics scrape endpoint
      description: |
        Exposes the Weave metric registry in Prometheus text format. The
        endpoint is intentionally unauthenticated so a sidecar / scraper
        can hit it without provisioning credentials. Disable with
        `WEAVE_METRICS_ENABLED=false` if the deployment runs in an
        untrusted network. Standard metrics include
        `weave_http_requests_total`, `weave_http_request_duration_seconds`,
        `weave_nats_publish_total`, `weave_db_query_duration_seconds`,
        `weave_bleve_search_duration_seconds`, and `weave_build_info`.
      tags: [Observability]
      security: []
      responses:
        "200":
          description: Prometheus exposition format text response.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP weave_http_requests_total Total HTTP requests handled by the Weave server.
                  # TYPE weave_http_requests_total counter
                  weave_http_requests_total{method="GET",path="/health",status="200"} 5
  /mcp:
    post:
      operationId: mcpJSONRPC
      summary: Model Context Protocol JSON-RPC 2.0 endpoint
      description: |
        Single JSON-RPC 2.0 endpoint that exposes Weave's ontology to AI
        agents (Claude Desktop, Cursor, GPT, etc.) via the Model Context
        Protocol. Supported methods:

        - `initialize` — handshake; returns protocol version, capabilities, and serverInfo
        - `tools/list` — list registered Weave tools and their input schemas
        - `tools/call` — invoke a tool by name with arguments
        - `prompts/list` — returns an empty list (Weave does not yet expose prompts)
        - `resources/list` — returns an empty list
        - `ping` — liveness check

        The seven Weave tools are: `weave_list_ontologies`,
        `weave_list_object_types`, `weave_get_object`, `weave_list_objects`,
        `weave_search_objects`, `weave_list_action_types`, and
        `weave_apply_action`. See docs/mcp.md for the full catalogue.

        Per JSON-RPC 2.0, all protocol errors (parse error, invalid request,
        method not found, invalid params, internal error, application
        error) are returned in the response envelope with HTTP 200. Non-200
        status codes are reserved for transport-level failures.
      tags: [MCP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                JSON-RPC 2.0 request envelope. The `id` field is required for
                requests that expect a response and omitted for notifications.
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  description: Request id (string, number, or null). Omitted for notifications.
                method:
                  type: string
                  example: tools/call
                params:
                  type: object
      responses:
        "200":
          description: |
            JSON-RPC 2.0 response envelope. Contains either a `result` or an
            `error` object — never both. Application errors travel here too.
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc]
                properties:
                  jsonrpc:
                    type: string
                    enum: ["2.0"]
                  id:
                    description: Echo of the request id (or null).
                  result:
                    type: object
                    description: Method-specific result. Present on success.
                  error:
                    type: object
                    description: JSON-RPC error object. Present on failure.
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data: {}
        "204":
          description: Notification accepted (request had no `id` field).
        "405":
          description: HTTP method other than POST.
  /api/auth/login:
    post:
      operationId: login
      summary: Issue access and refresh tokens
      description: |
        Validates credentials, mints an RS256 JWT access token and a rotating
        refresh token. Returns the user's roles, scoped ontology roles, and
        token TTL.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh token and mint a new access token
      description: |
        Rotates the supplied refresh token (from body or
        `weave_refresh` cookie) and returns a new access + refresh pair with
        freshly resolved roles.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      description: |
        Revokes the supplied refresh token (or the cookie value), clears the
        refresh cookie, and always returns 204. Idempotent.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logout completed.
  /api/v2/me:
    get:
      operationId: getMe
      summary: Return the authenticated user
      description: Returns the resolved roles, scoped roles, and permission set.
      tags: [Auth]
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies:
    get:
      operationId: listOntologies
      summary: List ontologies
      tags: [Metadata]
      responses:
        "200":
          description: Ontology list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}:
    get:
      operationId: getOntology
      summary: Get a single ontology
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: The ontology.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ontology"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes:
    get:
      operationId: listObjectTypes
      summary: List object types in an ontology
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: Object type list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectTypeListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes/{objectTypeApiName}:
    get:
      operationId: getObjectType
      summary: Get a single object type
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectTypeApiName"
      responses:
        "200":
          description: Object type wire format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectType"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objectTypes/{objectTypeApiName}/outgoingLinkTypes:
    get:
      operationId: listOutgoingLinkTypes
      summary: List outgoing link types for an object type
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectTypeApiName"
      responses:
        "200":
          description: Link type list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTypeListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/actionTypes:
    get:
      operationId: listActionTypes
      summary: List action types in an ontology
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: Action type list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionTypeListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actionTypes/{actionTypeRid}:
    get:
      operationId: getActionType
      summary: Get a single action type
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ActionTypeRid"
      responses:
        "200":
          description: Action type wire format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionType"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/fullMetadata:
    get:
      operationId: getFullMetadata
      summary: Get the full ontology metadata in one response
      description: Returns the ontology, its object types (with properties), link types, action types, and interfaces in a single payload.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: Full metadata payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyExport"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}:
    get:
      operationId: listObjects
      summary: List objects of a given type
      description: Paginated, optionally ordered list of objects.
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - in: query
          name: pageSize
          schema:
            type: integer
        - in: query
          name: pageToken
          schema:
            type: string
        - in: query
          name: orderBy
          schema:
            type: string
      responses:
        "200":
          description: Object page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}:
    get:
      operationId: getObject
      summary: Get a single object by primary key
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - $ref: "#/components/parameters/PrimaryKey"
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/search:
    post:
      operationId: searchObjects
      summary: Search objects with a where clause
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchObjectsRequest"
      responses:
        "200":
          description: Object page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/links/{linkType}:
    get:
      operationId: listLinkedObjects
      summary: List objects linked to a source object via a link type
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - $ref: "#/components/parameters/PrimaryKey"
        - in: path
          name: linkType
          required: true
          schema:
            type: string
        - in: query
          name: direction
          schema:
            type: string
            enum: [forward, reverse]
        - in: query
          name: pageSize
          schema:
            type: integer
        - in: query
          name: pageToken
          schema:
            type: string
      responses:
        "200":
          description: Linked object page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/history:
    get:
      operationId: getObjectHistory
      summary: Get the change history for a single object
      description: |
        Returns the most recent revisions of an object's state, ordered by
        version DESC, plus the total number of versions ever recorded. Each
        history row carries a pre/post-state snapshot, the edit type
        (CREATE / MODIFY / DELETE), the user that triggered the change, and
        the recorded timestamp.
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - $ref: "#/components/parameters/PrimaryKey"
        - in: query
          name: limit
          description: Maximum number of history rows to return (default 50, max 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Object history page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
