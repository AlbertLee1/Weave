    get:
      operationId: getSharedPropertyTypeByApiName
      summary: Get a single SharedProperty by API name (Foundry OSv2)
      description: |
        Foundry-1:1 sibling of listSharedPropertyTypes — keyed by
        API name (not RID). The current implementation scans the
        ontology-scoped list and filters; ontology-scoped sets are
        small in practice and SDK caches absorb repeat calls.
      tags: [Metadata]
