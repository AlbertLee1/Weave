          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}/share-links:
    post:
      operationId: createVertexShareLink
      summary: Create a Vertex graph share link
      description: |
        Mints an opaque share token for the graph identified by `{rid}`.
        Only the graph owner or an admin may create share links. Recipients
        exchange the returned token through
        `/api/vertex/v1/share-links/{token}/graph`.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Vertex graph RID.
          schema:
            type: string
      responses:
        "201":
          description: Share link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexShareLinkCreateResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listVertexShareLinksForGraph
      summary: List share links for a Vertex graph (round 69)
      description: |
        Returns every share-link minted on the graph (including revoked
        ones — the owner needs to see them to explain 410 Gone errors
        on revoked URLs). Same canManageShareLinks ACL as createShare
        Link so management mirrors mutation.

        Security: the full token is NEVER returned in this list. Each
        row carries `tokenSuffix` (last 8 chars) for identification
        only — full tokens are one-time disclosures at create time.
        Returning full tokens here would let anyone with graph-manage
        access enumerate every live share URL.
      tags: [Vertex]
      parameters:
        - in: path
          name: rid
          required: true
          description: Vertex graph RID.
          schema:
            type: string
      responses:
        "200":
          description: Share link list.
          content:
            application/json:
              schema:
                type: object
                required: [shareLinks]
                properties:
                  shareLinks:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/share-links/{token}:
    delete:
      operationId: revokeVertexShareLink
      summary: Revoke a Vertex graph share link
      description: |
        Revokes a previously minted share token. The token creator or an
        admin may revoke the link; repeated revocation is safe from the
        caller's perspective once the token is known.
      tags: [Vertex]
      parameters:
        - in: path
          name: token
          required: true
          description: Opaque share token.
          schema:
            type: string
      responses:
        "204":
          description: Share link revoked.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/share-links/{token}/graph:
    get:
      operationId: getVertexGraphViaShareLink
      summary: Fetch a shared Vertex graph
      description: |
        Resolves a share token to its graph. The response preserves graph
        structure while masking layer object property values so recipients can
        inspect topology without seeing raw property data. Revoked tokens
        return 410 Gone.
      tags: [Vertex]
      parameters:
        - in: path
          name: token
          required: true
          description: Opaque share token.
          schema:
            type: string
      responses:
        "200":
          description: Masked shared graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexGraph"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          description: Share link has been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/vertex/v1/graphs/{rid}/widget:
    get:
      operationId: getVertexGraphWidget
      summary: Get a compact Vertex graph for a Workshop widget
      description: |
        Returns the graph in the same wire shape as a normal Vertex graph
        read, but compacts the payload for embedded widgets by stripping
        widget-noise keys such as `savedSelections` and `history` while
        preserving layers, edges, and positions.
      tags: [Vertex]
      parameters:
