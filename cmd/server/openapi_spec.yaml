  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/timeseries/{propertyName}/latestValue:
    get:
      operationId: getTimeSeriesLatestValue
      summary: Get the latest value of a time series value bank property
      description: |
        Returns the most recent TimeSeriesPoint for the value bank stored
        in the given object's TimeSeriesValueBankProperty. Semantically
        equivalent to `lastPoint` for TimeSeriesProperty. The path
        parameter name is `propertyName` (not `property`) — this matches
        Foundry's API exactly.
      tags: [TimeSeriesValueBankProperty]
