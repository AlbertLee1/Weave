  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/ciphertexts/{property}/decrypt:
    get:
      operationId: decryptCipherTextProperty
      summary: Decrypt a CipherTextProperty
      description: |
        Reads the ciphertext stored under the addressed object's property and
        returns the plaintext via the server-configured Decryptor. The default
        single-machine build ships an envelope-encryption AES-256-GCM
        decryptor (wire format `v1:<base64url(nonce||sealed)>`); a
        KMS-backed Decryptor can be wired in place without changing the API.
      tags: [CipherTextProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          schema:
            type: string
        - in: path
          name: primaryKey
          required: true
          schema:
            type: string
        - in: path
          name: property
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decryption result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecryptionResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/transactions/{transactionId}/edits:
    post:
      operationId: applyOntologyTransactionEdits
      summary: Append edits to an OntologyTransaction (experimental)
      description: |
        **Experimental** — this endpoint requires `?preview=true` and is
        subject to change. Appends a batch of edits to an open
        OntologyTransaction buffer identified by `{transactionId}`.
        Buffered edits are ephemeral and do NOT survive server restarts
        in the single-machine build; commit / abort semantics are
        intentionally omitted until the Foundry transaction contract
        stabilises.
      tags: [OntologyTransaction]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
          description: Opaque client-supplied identifier for the open transaction.
        - in: query
          name: preview
          required: true
          schema:
            type: string
            enum: ["true"]
          description: Must be `true`; the endpoint is experimental and gated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionEditRequest"
      responses:
        "200":
          description: Edits appended to the transaction buffer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEditResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/sqlQueries/execute:
    post:
      operationId: executeSqlQuery
      summary: Execute a read-only SQL query
      description: |
        Executes a single-statement SELECT query against the ontology
        store and returns a Foundry QueryStatus union. Weave runs all
        queries synchronously on the request goroutine so the response
        always resolves to the terminal "succeeded" or "failed" variant;
        the "running" / "canceled" variants are documented for SDK
        compatibility but never emitted by this implementation.
      tags: [SqlQueries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryExecuteRequest"
      responses:
        "200":
          description: |
            Query completed in a terminal state. Inspect `type` to
            disambiguate success from failure; successful responses
            carry only `queryId`, failed responses add `errorMessage`
            and `failureReason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStatus"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/admin/auditEvents:
    get:
      operationId: listAuditEvents
      summary: List audit events with optional filters
      description: |
        Returns audit events matching the supplied filters with cursor-based
        pagination. Gated to admin-level roles via `user.manage`.
      tags: [Admin]
      parameters:
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by actor ID.
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action (e.g. CREATE, UPDATE, DELETE, login_success).
        - name: resource_type
          in: query
          schema:
            type: string
          description: Filter by resource type (e.g. ObjectType, Property, Session).
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only events at or after this RFC 3339 timestamp.
        - name: until
          in: query
          schema:
            type: string
            format: date-time
          description: Only events at or before this RFC 3339 timestamp.
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of events per page.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Opaque pagination cursor from a previous response.
      responses:
        "200":
          description: Matching audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Audit store is not configured (no PostgreSQL pool).
  /api/v2/developer/applications:
    post:
      operationId: createApplication
      summary: Register a new OAuth application
      description: |
        Registers a new OAuth application owned by the authenticated user.
        The response body contains the generated `clientId` and `clientSecret`;
        the plaintext secret is returned EXACTLY once at creation and is never
        retrievable afterwards. Callers MUST persist it at this point.
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created; `clientSecret` is included in the body ONCE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listApplications
      summary: List the authenticated user's OAuth applications
      description: |
        Returns the calling user's applications in redacted form. The
        `clientSecret` is NEVER present in this response.
      tags: [Developer]
      responses:
        "200":
          description: Applications owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApplicationsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/developer/applications/{id}:
    get:
      operationId: getApplication
      summary: Get a single OAuth application by id
      description: |
        Returns the redacted application record. Only the owning user can
        read the row; other callers receive 403.
      tags: [Developer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Application UUID.
      responses:
        "200":
          description: Application details (redacted — no `clientSecret`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSummary"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      operationId: deleteApplication
      summary: Delete an OAuth application
      description: |
        Hard-deletes the application. Any tokens previously issued against
        its client_id become unusable the moment the row is removed.
      tags: [Developer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Application UUID.
      responses:
        "204":
          description: Application removed.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/developer/applications/{id}/usage:
    get:
      operationId: getApplicationUsage
      summary: Aggregated API usage metrics for an OAuth application
      description: |
        Returns per-window counters (24h / 7d / 30d) for requests made with
        access tokens issued against this application's client_id. The
        summary is computed in-process from a bounded sample log; the
        underlying Prometheus counters are always available on /metrics.
        Only the owning user can read these metrics; other callers get 403.
      tags: [Developer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Application UUID.
      responses:
        "200":
          description: Aggregated usage for the caller's application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationUsageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /oauth/authorize:
    get:
      operationId: oauthAuthorizeGET
      summary: OAuth 2.0 authorization endpoint (consent screen)
      description: |
        Renders the HTML consent page for an OAuth 2.0 authorization_code
        flow. The caller (a browser) is redirected here by a third-party
        client; after the resource owner approves, POST /oauth/authorize
        redirects back to the client with a short-lived authorization code.
        PKCE (`code_challenge` with method `S256`) is required; `plain` is
        rejected.
      tags: [Developer]
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The OAuth client_id issued by /api/v2/developer/applications.
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: Must exactly match one of the application's registered redirect_uris.
        - name: response_type
          in: query
          required: false
          schema:
            type: string
            enum: [code]
          description: Only `code` is supported.
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of requested OAuth scopes.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque value round-tripped to the redirect URL for CSRF protection.
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: PKCE S256 challenge (base64url SHA-256 of code_verifier).
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256]
          description: Only S256 is accepted.
      responses:
        "200":
          description: HTML consent page.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
    post:
      operationId: oauthAuthorizePOST
      summary: OAuth 2.0 authorization approval
      description: |
        Records the resource owner's consent decision. On `approve` the
        server issues a single-use authorization code and redirects to
        `redirect_uri?code=...&state=...`. On `deny` the server redirects
        to `redirect_uri?error=access_denied&state=...`.
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - redirect_uri
                - code_challenge
                - decision
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                response_type:
                  type: string
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                decision:
                  type: string
                  enum: [approve, deny]
      responses:
        "302":
          description: Redirect to `redirect_uri` with either `code` or `error`.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /oauth/token:
    post:
      operationId: oauthToken
      summary: OAuth 2.0 token endpoint
      description: |
        Exchanges an authorization code for an access (and refresh) token,
        or issues an app-level access token under the client_credentials
        grant. Follows RFC 6749 §4.1.3 / §4.4.

        Two grant types are supported:

        - `authorization_code` with PKCE — requires `code`, `redirect_uri`,
          `client_id`, and `code_verifier`. Returns `access_token` +
          `refresh_token`.
        - `client_credentials` — requires `client_id` + `client_secret`
          either via HTTP Basic Authorization or in the form body.
          Returns `access_token` only (no refresh token).
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, client_credentials]
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                code_verifier:
                  type: string
                scope:
                  type: string
      responses:
        "200":
          description: Token response (RFC 6749 §5.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: Invalid request / invalid_grant / unsupported_grant_type (RFC 6749 §5.2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenError"
        "401":
          description: invalid_client (unknown client_id or bad client_secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenError"
  /api/admin/indexes/rebuild:
    post:
      operationId: adminIndexRebuild
      summary: Rebuild a Bleve index for a single ObjectType
      description: |
        Drops the per-ObjectType Bleve index, recreates it with a fresh
        mapping derived from the current property schema (typeclasses
        included), then reindexes every primary key from the authoritative
        object_history tail. Idempotent and safe to run repeatedly. Gated to
        admin-level roles via `user.manage`; the endpoint is intended for
        operators applying a schema / analyzer change without a full server
        restart.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIndexRebuildRequest"
      responses:
        "200":
          description: Rebuild completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIndexRebuildResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
