  /api/v2/ontologies/{ontologyApiName}/objectTypes/{objectTypeApiName}/typeGroups:
    get:
      operationId: listObjectTypeTypeGroups
      summary: List the TypeGroups an ObjectType belongs to (Foundry OSv2)
      description: |
        Reverse-lookup keyed by ObjectType API name — given an
        ObjectType, return every TypeGroup it is assigned to. SDKs
        and the SPA ObjectType detail card use the result to render
        category chips without round-tripping /fullMetadata. The
        envelope is {"data":[...]} and NEVER null; an ObjectType with
        zero assignments returns {"data":[]} so SDK iterators don't
        NPE. Unknown ObjectType API name surfaces as 404
        ObjectTypeNotFound, mirroring GetObjectType's error contract.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectTypeApiName"
      responses:
        "200":
          description: TypeGroup list envelope.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TypeGroup"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/typeGroups:
    get:
      operationId: listTypeGroups
      summary: List type groups (Foundry OSv2)
      description: |
        Foundry 1:1 — returns every TypeGroup registered in the
        ontology. TypeGroups organise ObjectTypes into categories
        (e.g. "People", "Finance") and SDKs/UIs use the list to drive
        category-aware navigation. The envelope is {"data": [...]} and
        is NEVER null; an ontology with zero TypeGroups returns
        {"data": []} so SDK iterators don't NPE. Prior to this
        endpoint TypeGroups were only visible by parsing the bulky
        /fullMetadata response.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      responses:
        "200":
          description: TypeGroup list envelope.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TypeGroup"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/typeGroups/{typeGroup}:
    get:
      operationId: getTypeGroupByApiName
      summary: Get a single TypeGroup by API name (Foundry OSv2)
      description: |
        Foundry-1:1 sibling of listTypeGroups — keyed by API name
        (not RID). The current implementation scans the
        ontology-scoped list and filters; sets are small in practice
        and SDK caches absorb repeat calls.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: typeGroup
          required: true
          description: TypeGroup API name (not the RID).
          schema:
            type: string
      responses:
        "200":
          description: TypeGroup wire object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeGroup"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/sharedPropertyTypes:
    get:
      operationId: listSharedPropertyTypes
      summary: List shared property types (Foundry OSv2)
      description: |
        Foundry 1:1 — returns every SharedProperty registered in the
        ontology. The envelope is {"data": [...]} and is NEVER null;
        an ontology with zero shared properties returns {"data": []}
        so SDK iterators don't NPE. Prior to this endpoint, SDKs
        could discover SharedProperties only by parsing the bulky
        /fullMetadata response — this restores access at the
        canonical Foundry path.
      tags: [Metadata]
