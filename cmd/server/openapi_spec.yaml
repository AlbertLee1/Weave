      responses:
        "200":
          description: Aggregation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/count:
    post:
      operationId: countObjects
      summary: Count the number of objects of a given type (optionally filtered)
      description: |
        Foundry OSv2 1:1 alignment: the request body is OPTIONAL but,
        when supplied with a `where` clause, the response counts ONLY
        matching objects (and respects any row-level security policy
        the caller is subject to). An empty body or {} keeps the
        backward-compatible fast indexMgr.DocCount path so callers
        that never sent a body see no behaviour change.
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountObjectsRequest"
      responses:
        "200":
          description: Object count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountObjectsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/links/{linkType}:
    get:
      operationId: listLinkedObjects
      summary: List objects linked to a source object via a link type
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - $ref: "#/components/parameters/PrimaryKey"
        - in: path
          name: linkType
          required: true
          schema:
            type: string
        - in: query
          name: direction
          schema:
            type: string
            enum: [forward, reverse]
        - in: query
          name: pageSize
          schema:
            type: integer
        - in: query
          name: pageToken
          schema:
            type: string
      responses:
        "200":
          description: Linked object page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/activity:
    get:
      operationId: getObjectActivity
      summary: Get the activity timeline for a single object
      description: |
        Returns the change history for one (objectType, primaryKey) tuple,
        ordered version-DESC, with cursor-based pagination so the
        ObjectDetail UI can stream long timelines without over-fetching.
        Each entry is a snapshot-pair: `prevState` is the JSONB before the
        edit (absent for CREATE rows) and `newState` is the JSONB after
        (absent for DELETE rows). `pageToken` is opaque — pass the
        `nextPageToken` from the previous response back as `pageToken` to
        fetch the next (older) page; absence of `nextPageToken` indicates
        the final page. The endpoint relies on the per-object
        `object_history` tail; in degraded mode (no PG bootstrap) it
        responds 500 ActivityStoreNotConfigured.
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - $ref: "#/components/parameters/PrimaryKey"
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: pageToken
          schema:
            type: string
      responses:
        "200":
          description: Activity timeline page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  nextPageToken:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/links/{linkType}/{linkedObjectPrimaryKey}:
    get:
      operationId: getLinkedObject
      summary: Get a specific linked object by its primary key
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - $ref: "#/components/parameters/PrimaryKey"
        - in: path
          name: linkType
          required: true
          schema:
            type: string
        - in: path
          name: linkedObjectPrimaryKey
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The linked object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireObject"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/loadObjects:
    post:
      operationId: loadObjectSet
      summary: Materialize an ObjectSet definition into a page of objects
      description: |
        Returns the live state of every object in the ObjectSet. When the
        optional `asOf` query parameter is supplied (RFC3339 timestamp,
        e.g. `2026-01-01T00:00:00Z`) the handler scans `object_history`
        for the snapshot whose `[valid_from, valid_to)` validity window
        covers `asOf` and returns the object as it existed at that
        instant. Time-travel currently only supports `base` ObjectSet
        definitions; composite types (`filter`, `union`, `intersect`,
        `searchAround`, ...) reject `asOf` with `TimeTravelUnsupportedObjectSet`.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: asOf
          required: false
          schema:
            type: string
            format: date-time
          description: |
            US-223 time-travel: RFC3339 timestamp at which to read object
            state. When set the response reflects the snapshot recorded
            in object_history at that instant rather than the live Bleve
            index. Errors: `InvalidAsOf` (malformed timestamp),
            `TimeTravelUnavailable` (provider not wired in degraded
            mode), `TimeTravelUnsupportedObjectSet` (non-base ObjectSet),
            `TimeTravelFailed` (snapshot read backend error).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadObjectSetRequest"
      responses:
        "200":
          description: ObjectSet load response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadObjectSetResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/loadLinks:
    post:
      operationId: loadObjectSetLinks
      summary: Load linked objects from an ObjectSet via a link type
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadLinksRequest"
      responses:
        "200":
          description: Linked objects response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadObjectSetResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/aggregate:
    post:
      operationId: aggregateObjectSet
      summary: Aggregate objects in an ObjectSet
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregateObjectSetRequest"
      responses:
        "200":
          description: Aggregation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/createTemporary:
    post:
      operationId: createTemporaryObjectSet
      summary: Cache an ObjectSet definition for later reuse
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemporaryRequest"
      responses:
        "200":
          description: Temporary ObjectSet handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTemporaryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/diff:
    post:
      operationId: diffObjectSets
      summary: Compute the set diff between two ObjectSet definitions (US-430)
      description: |
        Bloom-filter-pre-screened set diff. Both sides resolve through the same
        executor so `?branch=` and `?asOf=` semantics flow through unchanged.
        Both ObjectSets MUST resolve to the same ObjectType. Result PK lists
        are sorted ascending so SDK clients can stream-merge against existing
        snapshots without buffering the full payload.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: branch
          schema: { type: string }
          description: Optional branch overlay (US-381). Defaults to "main".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiffObjectSetRequest"
      responses:
        "200":
          description: Diff result with per-side cardinalities and execution stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffObjectSetResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/loadObjectsMultipleObjectTypes:
    post:
      operationId: loadObjectSetV2MultipleObjectTypes
      summary: Materialize an ObjectSet into a page of objects keyed by apiName (preview)
      description: |
        Preview endpoint. Requires ?preview=true.
        Each data item uses the $rid / $primaryKey / $apiName prefix so that
        multi-type result rows can be disambiguated by the caller.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: preview
          required: true
          schema:
            type: string
            enum: ["true"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadObjectSetRequest"
      responses:
        "200":
          description: Multi-type ObjectSet load response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadObjectSetV2MultipleObjectTypesResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/loadObjectsOrInterfaces:
    post:
      operationId: loadObjectSetV2ObjectsOrInterfaces
      summary: Materialize an ObjectSet whose root may be an interface base set (preview)
      description: |
        Preview endpoint. Requires ?preview=true.
        Like loadObjectsMultipleObjectTypes but semantically allows the root
        ObjectSet to be an interface base set. Each data item uses the
        $rid / $primaryKey / $apiName prefix.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: preview
          required: true
          schema:
            type: string
            enum: ["true"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadObjectSetRequest"
      responses:
        "200":
          description: Object-or-interface ObjectSet load response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadObjectSetV2MultipleObjectTypesResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/{objectSetRid}:
    get:
      operationId: getObjectSet
      summary: Get an ObjectSet definition by its RID
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectSetRid
          required: true
          schema:
            type: string
          description: The RID of the ObjectSet to retrieve
      responses:
        "200":
          description: ObjectSet definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectSetDefinition"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/{objectSetRid}/snapshot:
    post:
      operationId: createObjectSetSnapshot
      summary: Freeze an ObjectSet's primary key list into a versioned snapshot
      description: |
        US-224. Executes the ObjectSet referenced by `{objectSetRid}` (created
        earlier via `createTemporary`) and persists the resulting
        `(objectType, primaryKeys, definition)` tuple as an
        `object_set_snapshots` row. The returned `snapshotRid` (format
        `ri.objectsets.main.snapshot.<uuid>`) is durable and can be passed to
        `getObjectSetSnapshot` later to read back the same membership even
        after the underlying base set mutates. v1 freezes membership only;
        property values returned by `getObjectSetSnapshot` come from the live
        Bleve index at read time.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectSetRid
          required: true
          schema:
            type: string
          description: The RID of the ObjectSet to freeze (must be a previously stored ObjectSet, e.g. via createTemporary).
      responses:
        "200":
          description: Snapshot persisted. Returns the new snapshotRid plus the materialised primary keys.
          content:
            application/json:
              schema:
                type: object
                required: [snapshotRid, objectType, primaryKeys, totalCount, createdAt]
                properties:
                  snapshotRid:
                    type: string
                    description: Newly assigned snapshot RID (`ri.objectsets.main.snapshot.<uuid>`).
                  objectType:
                    type: string
                    description: API name of the ObjectType the materialised PKs resolve under.
                  primaryKeys:
                    type: array
                    items: { type: string }
                    description: The frozen primary key list at create time.
                  totalCount:
                    type: string
                    description: Number of primary keys in the snapshot, encoded as a string for API parity with loadObjects.
                  truncated:
                    type: boolean
                    description: True when the underlying executor hit its 10000-PK cap and the snapshot is an approximate prefix.
                  createdAt:
                    type: string
                    format: date-time
                    description: Server-assigned creation timestamp (UTC).
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/snapshots/{snapshotRid}:
    get:
      operationId: getObjectSetSnapshot
      summary: Read back a previously frozen ObjectSet snapshot
      description: |
        US-224. Loads the persisted snapshot row for `{snapshotRid}` and
        returns its frozen primary keys rendered through the live Bleve
        index using the same WireObject envelope `loadObjects` produces. PK
        membership is frozen at create time; current property values come
        from the index at read time.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: snapshotRid
          required: true
          schema:
            type: string
          description: Snapshot RID returned by createObjectSetSnapshot.
      responses:
        "200":
          description: Frozen rows for the snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [snapshotRid, objectType, data, totalCount, createdAt]
                properties:
                  snapshotRid:
                    type: string
                  objectType:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WireObject"
                  totalCount:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFoundError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/{objectSetRid}/lineage:
    get:
      operationId: getObjectSetLineage
      summary: Read the derivation lineage (filter / union / aggregation chain) of an ObjectSet
      description: |
        US-303. Walks the stored Definition tree referenced by `{objectSetRid}`
        and emits a directed acyclic graph of the operations that produce the
        final set. Each operation step (base / filter / union / intersect /
        subtract / searchAround / withProperties / sample / nearestNeighbors /
        ...) becomes one node; edges point from each input ObjectSet to the
        enclosing operation, so callers can render the chain or compute
        downstream impact without executing the set.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectSetRid
          required: true
          schema:
            type: string
          description: The RID of the ObjectSet whose derivation tree should be returned.
      responses:
        "200":
          description: ObjectSet lineage graph.
          content:
            application/json:
              schema:
                type: object
                required: [rid, root, nodes, edges]
                properties:
                  rid:
                    type: string
                    description: Echo of the ObjectSet RID supplied in the path parameter.
                  root:
                    type: string
                    description: Synthetic id of the node representing the requested ObjectSet (always present in `nodes`).
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [id, type]
                      properties:
                        id: { type: string }
                        type:
                          type: string
                          description: ObjectSet definition type (`base`, `filter`, `union`, `withProperties`, ...).
                        objectType: { type: string }
                        where:
                          type: object
                          additionalProperties: true
                        link: { type: string }
                        direction: { type: string }
                        path:
                          type: array
                          items:
                            type: object
                            properties:
                              link: { type: string }
                              direction: { type: string }
                              expectedObjectType: { type: string }
                        reference: { type: string }
                        interfaceType: { type: string }
                        interfaceLink: { type: string }
                        input: { type: string }
                        size: { type: integer }
                        seed: { type: integer }
                        derivedProperties:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              link: { type: string }
                              direction: { type: string }
                              metric: { type: string }
                              field: { type: string }
                              formula: { type: string }
                  edges:
                    type: array
                    items:
                      type: object
                      required: [from, to, operation]
                      properties:
                        from: { type: string }
                        to: { type: string }
                        operation: { type: string }
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/objectSets/{objectSetRid}/subscribe:
    get:
      operationId: subscribeObjectSet
      summary: Subscribe to an ObjectSet change stream over Server-Sent Events (US-055 scaffold)
      description: |
        Streams object change events for the given ObjectSet rid as
        Server-Sent Events. Each event is emitted on a `data:` line as
        JSON: `{"eventType":"ADDED_OR_UPDATED"|"DELETED","object":WireObject}`.
        The ObjectSet definition's base ObjectType is used to filter the
        in-process funnel broadcaster, so only events matching the
        ObjectSet are delivered. Where-clause filtering, Last-Event-ID
        replay, heartbeats and per-user connection limits are layered on
        by follow-up stories (US-056 ~ US-058).

        US-307 reconnect/replay: each event carries an `id:` line whose
        value is the originating NATS stream sequence. Reconnecting
        clients pass that sequence as the resume cursor through EITHER
        the `Last-Event-ID` HTTP header (browsers' canonical SSE channel,
        sent automatically by EventSource on its own auto-reconnect cycle)
        OR the `?lastEventId=` query parameter (the manual fallback for
        application code that explicitly recreates the EventSource — the
        browser API forbids custom headers on those connects). When both
        are supplied the header wins. The server replays any buffered
        events with `Sequence > cursor` from a 1024-event ring buffer
        before attaching the live stream so no event falls between the
        replay tail and the live head. Malformed cursors degrade to
        fromSeq=0 (full ring replay) rather than 4xx.
      tags: [ObjectSets]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectSetRid
          required: true
          schema:
            type: string
          description: The RID of the ObjectSet to subscribe to.
        - in: query
          name: lastEventId
          required: false
          schema:
            type: string
          description: |
            US-307 resume cursor — last NATS sequence the client observed.
            Only consulted when the `Last-Event-ID` header is absent (the
            header wins when both are present). Browsers that recreate
            EventSource explicitly cannot set the header, so this query
            param is the only resume channel for that path. Non-numeric
            values degrade to a full ring replay rather than 4xx.
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
          description: |
            US-307 resume cursor — last NATS sequence the client observed.
            Sent automatically by browsers on EventSource auto-reconnect.
            Wins over `?lastEventId=` query param when both are present.
            Non-numeric values degrade to a full ring replay rather than 4xx.
      responses:
        "200":
          description: SSE stream. Response body is an unbounded sequence of `data:` lines carrying JSON event payloads.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/{action}/apply:
    post:
      operationId: applyAction
      summary: Apply a single action (Foundry OSv2)
      description: |
        Executes a single action. The action API name is in the URL path {action}.
        Supports options.mode (VALIDATE_ONLY | VALIDATE_AND_EXECUTE) and
        options.returnEdits (ALL | ALL_V2_WITH_DELETIONS | NONE).

        US-240: setting ?async=true returns 202 Accepted with a jobId; the
        action then runs in the background and its state can be polled via
        GET /actions/jobs/{jobId}. In degraded deployments without a job
        store, the async query is silently ignored and the endpoint falls
        through to the synchronous 200 response.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name.
          schema:
            type: string
        - in: query
          name: async
          required: false
          description: "US-240: when true, run the action asynchronously and return 202 {jobId}. Poll GET /actions/jobs/{jobId} for progress/result."
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyActionRequest"
      responses:
        "200":
          description: Action result (SyncApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncApplyActionResponseV2"
        "202":
          description: |
            US-240: async job accepted (when ?async=true and a job store is
            wired). US-242: pending approval enqueued (when the ActionType is
            flagged requiresApproval and an approval store is wired).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AsyncApplyActionResponse"
                  - $ref: "#/components/schemas/PendingApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/{action}/validate:
    post:
      operationId: validateAction
      summary: Validate an action without executing it (Foundry OSv2)
      description: |
        Dedicated validation surface SDKs hit on every form-field change.
        The wire envelope is a validation REPORT — the response is always
        HTTP 200 when the path is well-formed, even when result=INVALID.
        Unknown action types surface as INVALID with a submissionCriterion
        message rather than a 404, so a stale actionType slug renders as a
        regular form validation error instead of an HTTP exception that
        breaks the form. A missing {action} path segment IS rejected with
        400 MissingActionType because that is a malformed URL, not a
        validation outcome. Validate MUST NOT publish to NATS or fire
        side effects.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyActionRequest"
      responses:
        "200":
          description: |
            Validation report. result is VALID or INVALID. parameters is
            keyed by parameter id; each entry carries result, required,
            and evaluatedConstraints. submissionCriteria is non-empty on
            INVALID with at least one entry carrying configuredFailureMessage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateActionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/jobs/{jobId}:
    get:
      operationId: getActionJob
      summary: Get async action job status (US-240)
      description: |
        Returns the current state of an async action job created by
        POST /actions/{action}/apply?async=true. Pollers should back off on
        PENDING/RUNNING responses and read .result once status=SUCCEEDED.
        status=FAILED surfaces the underlying error via .errorMessage.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: jobId
          required: true
          description: Async job ID returned from apply?async=true.
          schema:
            type: string
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionJob"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      operationId: deleteActionJob
      summary: Delete (cancel) an in-flight async action job (US-426)
      description: |
        REST-style alias of POST /jobs/{jobId}/cancel. Signals the in-flight
        worker for jobId to stop AND durably flips the job row to CANCELED in
        a single step so the response carries the post-cancel state inline.
        202 Accepted with the (now CANCELED) ActionJob row when the job was
        in-flight; 404 when the jobId is unknown; 409 ActionJobAlreadyTerminal
        when the job has already reached SUCCEEDED / FAILED / CANCELED.
        Idempotent on the durable side — the cancel signal itself is best
        effort and may report no-op when the runner already finished but its
        flush race lost.

        A background reaper drops terminal-state rows older than 24h (hourly
        sweep), so callers should not rely on GET /jobs/{jobId} returning the
        cancelled row indefinitely.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: jobId
          required: true
          description: Async job ID to cancel.
          schema:
            type: string
      responses:
        "202":
          description: Cancel accepted; row is now CANCELED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionJob"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/jobs/{jobId}/cancel:
    post:
      operationId: cancelActionJob
      summary: Cancel an in-flight async action job (US-318)
      description: |
        Signals the in-flight worker for jobId to stop. The runner observes
        ctx cancellation at the next iteration boundary and marks the job
        CANCELED. Returns 202 Accepted with the current job row when a
        runner was signalled, 404 when the jobId is unknown, and 409
        ActionJobAlreadyTerminal when the job has already reached SUCCEEDED
        / FAILED / CANCELED. Browser clients should subscribe to live
        progress via the WebSocket subscribeActionJob channel; this endpoint
        is the imperative side of that flow.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: jobId
          required: true
          description: Async job ID to cancel.
          schema:
            type: string
      responses:
        "202":
          description: Cancel signal accepted; runner will mark the job CANCELED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionJob"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/history:
    get:
      operationId: listActionHistory
      summary: List action execution history (US-317)
      description: |
        Returns the action_logs rows scoped to a single ontology, paginated
        and ordered by created_at DESC. All filter parameters are optional;
        when present they AND together. Unknown actionType apiNames return
        an empty page rather than 404 so the UI dropdown can render "no
        results" without distinguishing "wrong name" from "no executions".
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: actionType
          required: false
          description: Filter by ActionType apiName.
          schema:
            type: string
        - in: query
          name: status
          required: false
          description: Filter by execution status (SUCCESS or FAILED).
          schema:
            type: string
            enum: [SUCCESS, FAILED]
        - in: query
          name: userId
          required: false
          description: Filter by the executing user ID.
          schema:
            type: string
        - in: query
          name: since
          required: false
          description: RFC3339 lower bound (inclusive) on created_at.
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          required: false
          description: RFC3339 upper bound (exclusive) on created_at.
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          description: Page size, 1..500 (default 50).
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Result offset, ≥0 (default 0).
          schema:
            type: integer
      responses:
        "200":
          description: Action history page.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActionLog"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  nextOffset:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/history/{logId}:
    get:
      operationId: getActionHistoryEntry
      summary: Get a single action_log row (US-317)
      description: |
        Returns one action_log row including parameters, edits, and
        prevEdits so a detail panel can render the full audit trail without
        paging the list. Cross-ontology access is denied (404) — the URL's
        ontology must match the row's ActionType.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: logId
          required: true
          description: BIGSERIAL id of the action_log row.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Single ActionLog row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionLog"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/approvals:
    get:
      operationId: listActionApprovals
      summary: List ActionApproval rows (US-243)
      description: |
        Returns the approval queue scoped to the current ontology. The `mine`
        query parameter (default `true`) restricts the result to rows the
        caller can review — an entry matches when `user.ID` equals any of
        the approval's snapshotted `approvers` OR `user.Roles` intersects
        that list. Set `mine=false` for an unscoped admin / audit view. The
        `status` filter defaults to `PENDING`; `ALL` lifts the filter.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: status
          required: false
          description: |
            Filter by status. One of PENDING (default), APPROVED, REJECTED,
            or ALL / * (no filter).
          schema:
            type: string
        - in: query
          name: mine
          required: false
          description: |
            Restrict to rows the caller can review (default `true`).
          schema:
            type: string
            enum: ["true", "false"]
        - in: query
          name: limit
          required: false
          description: Max rows to return (1..500, default 100).
          schema:
            type: integer
      responses:
        "200":
          description: Approval queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActionApproval"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/approvals/{approvalId}/approve:
    post:
      operationId: approveAction
      summary: Approve a pending ActionApproval (US-242)
      description: |
        Transitions a PENDING ActionApproval row to APPROVED. The caller's
        user.ID or any of user.Roles must intersect the approval's snapshotted
        approvers list. Already-terminal rows return 409 Conflict.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: approvalId
          required: true
          description: ID of the pending approval row.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalReviewRequest"
      responses:
        "200":
          description: Approval transitioned to APPROVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalReviewResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/actions/approvals/{approvalId}/reject:
    post:
      operationId: rejectAction
      summary: Reject a pending ActionApproval (US-242)
      description: |
        Transitions a PENDING ActionApproval row to REJECTED. Authorization
        and conflict rules match the approve endpoint.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: approvalId
          required: true
          description: ID of the pending approval row.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalReviewRequest"
      responses:
        "200":
          description: Approval transitioned to REJECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalReviewResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v2/ontologies/{ontologyApiName}/actions/{action}/applyWithOverrides:
    post:
      operationId: applyActionWithOverrides
      summary: Apply a single action with parameter overrides (Foundry OSv2)
      description: |
        Wraps an ApplyActionRequestV2 in an envelope carrying an
        ApplyActionOverrides object. Overrides.parameters are merged into
        request.parameters (overrides win on key collisions) before the
        request is routed through the normal apply code path. The response
        matches SyncApplyActionResponseV2 exactly.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyActionWithOverridesRequest"
      responses:
        "200":
          description: Action result (SyncApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncApplyActionResponseV2"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/{action}/applyBatch:
    post:
      operationId: applyActionBatch
      summary: Apply a batch of the same action (Foundry OSv2)
      description: |
        Executes a batch of the same action type. The action API name is in
        the URL path {action}. Batch is always atomic (all-or-nothing).
        Supports options.returnEdits (ALL | NONE).
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: action
          required: true
          description: Action API name. All batch items share this action.
          schema:
            type: string
        - in: query
          name: atomic
          required: false
          description: "US-238: when true, wrap the action_log writes in a PG transaction that commits before the NATS publish."
          schema:
            type: boolean
        - in: query
          name: saga
          required: false
          description: "US-239: when true, route through the saga coordinator. On any prepare/commit failure, previously-prepared actions' compensators fire in reverse declaration order."
          schema:
            type: boolean
        - in: query
          name: async
          required: false
          description: "US-318: when true, run the batch asynchronously and return 202 {jobId}. Each action runs sequentially with progress reported via the WebSocket subscribeActionJob channel and persisted to GET /actions/jobs/{jobId}. Cancel mid-flight via POST /actions/jobs/{jobId}/cancel. Async batches are non-atomic by construction; combine with ?atomic=true / ?saga=true is rejected (the sync paths own those semantics)."
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyBatchRequest"
      responses:
        "200":
          description: Batch result (BatchApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchApplyActionResponseV2"
        "202":
          description: "US-318: async batch accepted. Returns the new job's id; subscribe via WebSocket subscribeActionJob or poll GET /actions/jobs/{jobId}."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncApplyActionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/applySaga:
    post:
      operationId: applyActionSaga
      summary: Apply a multi-step saga (US-369)
      description: |
        Runs an ordered list of actions as a saga: every step is prepared in
        declaration order; on any prepare/commit failure the previously
        prepared steps' compensators (CompensateActionRID) fire in reverse
        order. When the executor's SagaStore is wired, an idempotency_key
        replays the prior result instead of re-executing, and any compensator
        that itself fails to prepare or commit is enqueued to the dead-letter
        queue (action_saga_dlq) for manual or scheduled retry.

        US-469: clients can choose how the reverse-walk reacts to a broken
        compensator via `compensationStrategy`: `best-effort` (default —
        skip the broken compensator and keep running the rest) or
        `stop-on-first` (halt the walk on the first failure; remaining
        prepared steps are recorded as skipped). Either way, the structured
        `failedCompensations` slice tells callers which steps did not
        compensate cleanly.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                idempotencyKey:
                  type: string
                  description: |
                    Optional dedupe token. Two requests with the same key
                    return the same SagaResult; the second is marked
                    replayed=true and does not re-execute.
                compensationStrategy:
                  type: string
                  enum: [best-effort, stop-on-first]
                  description: |
                    US-469 rollback strategy. `best-effort` (default) keeps
                    compensating the rest of the prepared steps even when
                    one compensator fails; `stop-on-first` halts walking on
                    the first failure. Empty string is accepted and means
                    best-effort.
                steps:
                  type: array
                  description: Ordered list of action invocations.
                  items:
                    type: object
                    required: [actionType]
                    properties:
                      actionType:
                        type: string
                      parameters:
                        type: object
                        additionalProperties: true
      responses:
        "200":
          description: Saga result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [saga]
                  sagaId:
                    type: string
                  status:
                    type: string
                    enum: [SUCCESS, COMPENSATED, FAILED]
                  idempotencyKey:
                    type: string
                  replayed:
                    type: boolean
                  batchId:
                    type: string
                  applied:
                    type: array
                    items:
                      type: object
                  compensations:
                    type: array
                    items:
                      type: object
                  dlqEntries:
                    type: array
                    items:
                      type: string
                  compensationStrategy:
                    type: string
                    enum: [best-effort, stop-on-first]
                    description: |
                      US-469. Echoes the strategy that drove the rollback walk.
                  failedCompensations:
                    type: array
                    description: |
                      US-469. Per-step record of compensators that did not
                      complete cleanly. Each entry identifies the failing
                      primary step (stepIndex / stepId / actionType /
                      compensateRid), the phase the failure occurred in
                      (prepare / commit / skipped), a human-readable reason,
                      and the action_saga_dlq row id when one was enqueued
                      (skipped entries under stop-on-first carry no dlqId).
                    items:
                      type: object
                      required: [stepIndex, actionType, phase, reason]
                      properties:
                        stepIndex:
                          type: integer
                        stepId:
                          type: string
                        actionType:
                          type: string
                        compensateRid:
                          type: string
                        phase:
                          type: string
                          enum: [prepare, commit, skipped]
                        reason:
                          type: string
                        dlqId:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/sagas:
    get:
      operationId: listActionSagas
      summary: List action sagas (US-044)
      description: |
        Returns saga headers for the active ontology ordered by created_at
        descending. Optional status, limit, and offset filters power the
        Saga Jobs monitoring list while keeping SDK consumers on the same
        typed contract.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: status
          required: false
          description: Filter by saga lifecycle status.
          schema:
            type: string
            enum: [RUNNING, SUCCESS, COMPENSATING, COMPENSATED, FAILED]
        - in: query
          name: limit
          required: false
          description: Max rows to return (default 100, max 1000).
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Result offset, >=0.
          schema:
            type: integer
      responses:
        "200":
          description: Saga headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSagasResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/ontologies/{ontologyApiName}/actions/sagas/{sagaId}:
    get:
      operationId: getActionSaga
      summary: Get an action saga (US-044)
      description: |
        Returns one saga header plus its ordered step timeline so clients can
        render the action lifecycle, compensation markers, and persisted
        per-step edit snapshots.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: sagaId
          required: true
          description: Saga ID returned by applySaga.
          schema:
            type: string
      responses:
        "200":
          description: Saga detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSagaResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/ontologies/{ontologyApiName}/actions/saga/dlq:
    get:
      operationId: listSagaDLQ
      summary: List dead-letter saga rows (US-369)
      description: |
        Returns DLQ rows whose status matches the ?status filter (default
        PENDING). Each row records a compensator that failed during a saga
        rollback. Operators can replay the inverse-edit batch via the retry
        endpoint or dismiss the row via the drop endpoint.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: query
          name: status
          required: false
          description: PENDING (default), RESOLVED, or DROPPED.
          schema:
            type: string
            enum: [PENDING, RESOLVED, DROPPED]
        - in: query
          name: limit
          required: false
          description: Max rows to return (default 100, max 1000).
          schema:
            type: integer
      responses:
        "200":
          description: DLQ entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/actions/saga/dlq/{dlqId}/retry:
    post:
      operationId: retrySagaDLQ
      summary: Retry a dead-letter saga row (US-369)
      description: |
        Re-publishes the inverse-edit batch carried by a PENDING DLQ row.
        On success the row transitions to RESOLVED. On failure the row
        stays PENDING with attempts incremented and failure_message
        updated.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: dlqId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DLQ row resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dlqId:
                    type: string
                  status:
                    type: string
                    enum: [RESOLVED]
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          description: Retry failed; row stays PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/v2/ontologies/{ontologyApiName}/actions/saga/dlq/{dlqId}/drop:
    post:
      operationId: dropSagaDLQ
      summary: Dismiss a dead-letter saga row (US-369)
      description: |
        Manual operator dismissal — transitions a DLQ row to DROPPED
        without replaying its edits. Use when the inverse edits are not
        appropriate to publish (e.g. the corresponding object has since
        been recreated by other workflows).
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: dlqId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DLQ row dropped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dlqId:
                    type: string
                  status:
                    type: string
                    enum: [DROPPED]
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/actions/revert:
    post:
      operationId: revertAction
      summary: Revert a previously executed action (US-105)
      description: |
        Undoes a previously executed action by loading its ActionLog, generating
        reverse edits (CREATE→DELETE, MODIFY→restore PrevState, DELETE→CREATE),
        and publishing the reverse EditBatch. The original ActionLog is marked
        as REVERTED. Double-revert returns 409 Conflict.
      tags: [Actions]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionLogId]
              properties:
                actionLogId:
                  type: integer
                  format: int64
                  description: The ID of the ActionLog to revert.
      responses:
        "200":
          description: Revert result (SyncApplyActionResponseV2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncApplyActionResponseV2"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Action has already been reverted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontologyApiName}/streams/{objectType}/ingest:
    post:
      operationId: streamIngest
      summary: Bulk-ingest edits into an ObjectType stream (US-061)
      description: |
        Pushes a batch of edits directly into the NATS edit stream for the
        specified ObjectType, bypassing Action rules. Edits are automatically
        tagged with source="ingest" for the user-edit-wins conflict resolver.
        Maximum 1000 edits per request. Requires the stream.ingest permission
        (ontology-owner or admin role).
      tags: [Streams]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          description: ObjectType API name to ingest into.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamIngestRequest"
      responses:
        "200":
          description: Ingest accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamIngestResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/v2/ontologies/attachments/upload:
    post:
      operationId: uploadAttachment
      summary: Upload an attachment with a server-generated RID
      description: |
        Creates a new attachment blob. The server allocates a fresh
        ri.attachments.main.attachment.* RID. The request body is the raw
        blob bytes; the Content-Type header becomes the stored mediaType.
        Attachment paths are global — they do NOT include {ontology}.
      tags: [Attachments]
      parameters:
        - in: query
          name: filename
          required: true
          description: Original filename to associate with the blob.
          schema:
            type: string
