        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v2/ontologies/{ontology}/queries/{queryApiName}/execute:
    post:
      operationId: executeQueryType
      summary: Execute a stored QueryType
      tags: [Metadata]
      parameters:
