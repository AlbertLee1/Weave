    post:
      operationId: createLinkProperty
      summary: Create a link property
      description: |
        Declares a typed property on a LinkType's edges. The schema row
        lives in the link_properties table; per-edge values ride on
        link_edges.edge_properties (JSONB) and are written via the
        PUT edges/properties endpoint (US-210).
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: linkTypeRid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiName, baseType]
              properties:
                apiName:
                  type: string
                displayName:
                  type: string
                description:
                  type: string
                baseType:
                  type: string
                typeConfig:
                  type: object
                isArray:
                  type: boolean
                isNullable:
                  type: boolean
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
