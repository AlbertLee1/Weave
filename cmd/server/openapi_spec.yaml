  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/{primaryKey}/timeseries/{property}/streamPoints:
    post:
      operationId: streamTimeSeriesPoints
      summary: Stream every point of a time series property
      description: |
        Returns every point in the series ordered by time ascending. The
        optional `format` query parameter mirrors Foundry's JSON/ARROW
        toggle; this server only emits JSON and rejects `format=ARROW`
        with 400 UnsupportedFormat.
      tags: [TimeSeriesProperty]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: objectType
          required: true
          schema:
            type: string
        - in: path
          name: primaryKey
          required: true
          schema:
            type: string
        - in: path
          name: property
          required: true
          schema:
            type: string
        - in: query
          name: format
          required: false
          description: Response format. Only JSON is supported.
          schema:
            type: string
