  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/search:
    post:
      operationId: searchObjects
      summary: Search objects with a where clause
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - $ref: "#/components/parameters/ObjectType"
        - name: fuzziness
          in: query
          required: false
          description: |
            Levenshtein edit distance for fuzzy matching. 0 disables fuzzy
            (exact match), 1 tolerates one edit (e.g. "Kafka" matches "Kafca"),
            2 tolerates two edits. When set, overrides any `fuzzy` body field.
          schema:
            type: integer
            minimum: 0
            maximum: 2
            enum: [0, 1, 2]
        - name: regex
          in: query
          required: false
          description: |
            Shorthand for a single regex where-clause: `field:pattern` (split on
            the FIRST colon so patterns may contain colons). Pattern must be a
            valid RE2 / Go regexp/syntax Perl expression and is capped at 1024
            characters. Execution is bounded by a 500ms server-side timeout.
            When set, REPLACES any `where` body field — use the structured
            body form for AND/OR composition.
          schema:
            type: string
            example: "name:^A.*"
        - name: highlight
          in: query
          required: false
          description: |
            US-235 highlight shorthand. `true`/`1`/`on`/`yes` enables default
            highlighting (every searchable text field wrapped with
            <mark>...</mark> using Bleve's "html" style). `false`/`0`/`off`/
            `no` disables highlighting even when the body's `highlight` field
            is set. A comma-separated list (`body,title`) restricts
            highlighting to the listed property apiNames. When set, the
            response rows carry a `_highlights: { field: [snippet...] }` key.
          schema:
            type: string
            example: "body,title"
        - name: facets
          in: query
          required: false
          description: |
            US-236 facet shorthand. Comma-separated list of property
            apiNames to compute term-count buckets for. Duplicates are
            dropped; unknown / non-indexed fields yield an empty bucket
            list. When present, REPLACES any `facets` body field. An
            empty / all-whitespace list is a 400
            (`errorName: InvalidFacets`). Response shape:
            `facets: { field: [{value, count}, ...] }`.
          schema:
            type: string
            example: "objectType,owner,createdAt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchObjectsRequest"
      responses:
        "200":
          description: Object page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/ontologies/{ontologyApiName}/objects/{objectType}/aggregate:
    post:
      operationId: aggregateObjects
      summary: Aggregate objects via Bleve facets
      tags: [Objects]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
