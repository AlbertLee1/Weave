  /api/v2/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the authenticated user
      tags: [Notifications]
      parameters:
        - name: unread
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter for unread notifications only
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Filter to one or more notification type tags (mention / watch /
            approval / system / ...). Repeat the query parameter or pass a
            comma-separated list (?type=mention,watch). Empty / unknown values
            are ignored. (US-343)
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      summary: Lightweight unread-count badge for the navbar
      description: |
        Round 66 (PRD-V2 上层体验). Returns the authenticated user's
        unread-notification count without loading any rows. The Foundry
        navbar polls this every few seconds; backing it via a dedicated
        COUNT(*) over the existing idx_notifications_user_unread partial
        index keeps the request O(returned-count) regardless of table
        size. The response carries `count` only — there is intentionally
        no `data` array so the badge poll stays bandwidth-cheap.
      tags: [Notifications]
      responses:
        "200":
          description: The unread count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every unread notification belonging to the caller as read
      description: |
        Bulk-mark-read endpoint (US-343). Optionally narrowed by ?type=<tag> to
        scope the action to one or more notification type tags. Returns the
        number of rows updated.
      tags: [Notifications]
      parameters:
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Restrict the bulk-read to one or more notification type tags.
            Repeat the query parameter or pass a comma-separated list.
            Empty / unknown values are ignored.
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                    minimum: 0
        "503":
          description: Bulk endpoint not configured (degraded mode)
        "500":
          $ref: "#/components/responses/InternalError"
