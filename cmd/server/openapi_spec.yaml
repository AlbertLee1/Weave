          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateVertexControlPanel
      summary: Update Vertex control-panel configuration
      description: |
        Updates one or more Vertex runtime knobs. The request body is
        sparse: omitted fields retain their previous value. Requires an
        admin role.
      tags: [Vertex, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VertexControlPanelUpdateRequest"
      responses:
        "200":
          description: Updated Vertex control-panel config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VertexControlPanelConfig"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/actions/{rid}/impact:
    get:
      operationId: getActionImpact
      summary: List objects affected by a specific action invocation
      description: |
        Returns the impact summary for the action-log row identified by
        `{rid}`. Each row in `lineage_edges` whose `upstream_rid` matches
        is rendered as one ImpactObject describing the affected object,
        the operation (CREATE / MODIFY / DELETE), and when the edge was
        recorded.

        When the action-log row can be loaded (parsed id from the RID's
        suffix) it is returned under `actionLog` so callers can correlate
        the action with its parameters and timestamp without a second
        roundtrip. A missing log silently omits the field — the lineage
        view is the authoritative answer.
      tags: [Actions, Lineage]
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            type: string
          description: |
            Action-log RID — must match the prefix
            `ri.actions.main.action-log.` produced by the executor when
            it stamps a lineage edge. Other RID shapes are rejected with
            `InvalidActionRID` 400.
      responses:
        "200":
          description: Impact summary rooted at the action-log RID.
          content:
            application/json:
              schema:
                type: object
                required: [actionRid, objects]
                properties:
                  actionRid:
                    type: string
                    description: Echo of the path RID.
                  actionLog:
                    type: object
                    description: |
                      The underlying action-log row (best-effort
                      enrichment). Omitted when the row cannot be loaded.
                  objects:
                    type: array
                    description: |
                      One entry per `lineage_edges` row whose
                      `upstream_rid` matches the action-log RID. Always
                      a non-null array so SDKs can read `len(objects)`
                      without a nil-check.
                    items:
                      type: object
                      required: [rid, timestamp]
                      properties:
                        rid:
                          type: string
                          description: downstream_rid of the lineage edge.
                        objectType:
                          type: string
                          description: |
                            Decoded ObjectType API name when the RID
                            matches the canonical
                            `ri.phonograph2-objects.main.object.<type>.<pk>`
                            shape. Empty string for legacy / non-object
                            downstream RIDs.
                        primaryKey:
                          type: string
                          description: |
                            Decoded primary key (may itself contain
                            dots when composite keys are in play).
                        operation:
                          type: string
                          description: |
                            Free-form operation discriminator
                            (CREATE / MODIFY / DELETE / ...).
                        timestamp:
                          type: string
                          format: date-time
                  truncated:
                    type: boolean
                    description: |
                      Set when the per-request edge fanout hit its
                      window limit (200). Additional impacted objects
                      may exist beyond what is reported here.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Lineage store is not configured (degraded mode without PostgreSQL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/admin/auditEvents:
    get:
      operationId: listAuditEvents
      summary: List audit events with optional filters
      description: |
        Returns audit events matching the supplied filters with cursor-based
        pagination. Gated to admin-level roles via `user.manage`.
      tags: [Admin]
      parameters:
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by actor ID.
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action (e.g. CREATE, UPDATE, DELETE, login_success).
        - name: resource_type
          in: query
          schema:
            type: string
          description: Filter by resource type (e.g. ObjectType, Property, Session).
        - name: resourceRid
          in: query
          schema:
            type: string
          description: |
            Filter by exact resource RID. Returns every audit event whose
            `resource_rid` equals this value — useful for "show me
            everything that ever happened to this ObjectType / Session /
            Policy". Snake-case alias `resource_rid` is also accepted.
            Added in US-493.
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only events at or after this RFC 3339 timestamp.
        - name: until
          in: query
          schema:
            type: string
            format: date-time
          description: Only events at or before this RFC 3339 timestamp.
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of events per page.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Opaque pagination cursor from a previous response.
      responses:
        "200":
          description: Matching audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Audit store is not configured (no PostgreSQL pool).
  /api/admin/audit:
    get:
      operationId: listAuditEventsLegacyAlias
      summary: List audit events (PRD-literal alias, US-493)
      description: |
        PRD-literal alias for `/api/v2/admin/auditEvents`. Same handler,
        same query params, same response shape — exists so the PRD
        specification's literal path is also routable. Prefer the
        versioned path in new SDK / CLI integrations.
      tags: [Admin]
      parameters:
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by actor ID.
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action.
        - name: resource_type
          in: query
          schema:
            type: string
          description: Filter by resource type.
        - name: resourceRid
          in: query
          schema:
            type: string
          description: |
            Filter by exact resource RID. Snake-case alias `resource_rid`
            is also accepted.
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only events at or after this RFC 3339 timestamp.
        - name: until
          in: query
          schema:
            type: string
            format: date-time
          description: Only events at or before this RFC 3339 timestamp.
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of events per page.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Opaque pagination cursor from a previous response.
      responses:
        "200":
          description: Matching audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Audit store is not configured (no PostgreSQL pool).
  /api/v2/developer/applications:
    post:
      operationId: createApplication
      summary: Register a new OAuth application
      description: |
        Registers a new OAuth application owned by the authenticated user.
        The response body contains the generated `clientId` and `clientSecret`;
        the plaintext secret is returned EXACTLY once at creation and is never
        retrievable afterwards. Callers MUST persist it at this point.
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created; `clientSecret` is included in the body ONCE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listApplications
      summary: List the authenticated user's OAuth applications
      description: |
        Returns the calling user's applications in redacted form. The
        `clientSecret` is NEVER present in this response.
      tags: [Developer]
      responses:
        "200":
          description: Applications owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApplicationsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/developer/applications/{id}:
    get:
      operationId: getApplication
      summary: Get a single OAuth application by id
      description: |
        Returns the redacted application record. Only the owning user can
        read the row; other callers receive 403.
      tags: [Developer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Application UUID.
      responses:
        "200":
          description: Application details (redacted — no `clientSecret`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSummary"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      operationId: deleteApplication
      summary: Delete an OAuth application
      description: |
        Hard-deletes the application. Any tokens previously issued against
        its client_id become unusable the moment the row is removed.
      tags: [Developer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Application UUID.
      responses:
        "204":
          description: Application removed.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/developer/applications/{id}/usage:
    get:
      operationId: getApplicationUsage
      summary: Aggregated API usage metrics for an OAuth application
      description: |
        Returns per-window counters (24h / 7d / 30d) for requests made with
        access tokens issued against this application's client_id. The
        summary is computed in-process from a bounded sample log; the
        underlying Prometheus counters are always available on /metrics.
        Only the owning user can read these metrics; other callers get 403.
      tags: [Developer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Application UUID.
      responses:
        "200":
          description: Aggregated usage for the caller's application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationUsageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /oauth/authorize:
    get:
      operationId: oauthAuthorizeGET
      summary: OAuth 2.0 authorization endpoint (consent screen)
      description: |
        Renders the HTML consent page for an OAuth 2.0 authorization_code
        flow. The caller (a browser) is redirected here by a third-party
        client; after the resource owner approves, POST /oauth/authorize
        redirects back to the client with a short-lived authorization code.
        PKCE (`code_challenge` with method `S256`) is required; `plain` is
        rejected.
      tags: [Developer]
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The OAuth client_id issued by /api/v2/developer/applications.
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: Must exactly match one of the application's registered redirect_uris.
        - name: response_type
          in: query
          required: false
          schema:
            type: string
            enum: [code]
          description: Only `code` is supported.
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of requested OAuth scopes.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque value round-tripped to the redirect URL for CSRF protection.
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: PKCE S256 challenge (base64url SHA-256 of code_verifier).
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256]
          description: Only S256 is accepted.
      responses:
        "200":
          description: HTML consent page.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
    post:
      operationId: oauthAuthorizePOST
      summary: OAuth 2.0 authorization approval
      description: |
        Records the resource owner's consent decision. On `approve` the
        server issues a single-use authorization code and redirects to
        `redirect_uri?code=...&state=...`. On `deny` the server redirects
        to `redirect_uri?error=access_denied&state=...`.
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - redirect_uri
                - code_challenge
                - decision
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                response_type:
                  type: string
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                decision:
                  type: string
                  enum: [approve, deny]
      responses:
        "302":
          description: Redirect to `redirect_uri` with either `code` or `error`.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /oauth/token:
    post:
      operationId: oauthToken
      summary: OAuth 2.0 token endpoint
      description: |
        Exchanges an authorization code for an access (and refresh) token,
        rotates a refresh token for a fresh pair, or issues an app-level
        access token under the client_credentials grant. Follows RFC 6749
        §4.1.3 / §4.4 / §6.

        Three grant types are supported:

        - `authorization_code` with PKCE — requires `code`, `redirect_uri`,
          `client_id`, and `code_verifier`. Returns `access_token` +
          `refresh_token`.
        - `client_credentials` — requires `client_id` + `client_secret`
          either via HTTP Basic Authorization or in the form body.
          Returns `access_token` only (no refresh token).
        - `refresh_token` — requires `refresh_token` + `client_id`. The
          presented refresh token is consumed (rotation, RFC 9700) and a
          new (access, refresh) pair is issued. Optional `scope` form
          parameter narrows the new grant — widening is rejected with
          `invalid_scope`. Confidential clients (registered with a
          client_secret) MUST also authenticate via Basic auth or form
          body; public clients (no registered secret) authenticate by
          `client_id` alone.
      tags: [Developer]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, client_credentials, refresh_token]
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                  description: |
                    The refresh token to rotate. Required when
                    grant_type=refresh_token. The token is single-use:
                    re-presenting it after rotation returns invalid_grant.
                scope:
                  type: string
      responses:
        "200":
          description: Token response (RFC 6749 §5.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: Invalid request / invalid_grant / unsupported_grant_type (RFC 6749 §5.2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenError"
        "401":
          description: invalid_client (unknown client_id or bad client_secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenError"
  /api/admin/indexes/rebuild:
    post:
      operationId: adminIndexRebuild
      summary: Rebuild a Bleve index for a single ObjectType
      description: |
        Drops the per-ObjectType Bleve index, recreates it with a fresh
        mapping derived from the current property schema (typeclasses
        included), then reindexes every primary key from the authoritative
        object_history tail. Idempotent and safe to run repeatedly. Gated to
        admin-level roles via `user.manage`; the endpoint is intended for
        operators applying a schema / analyzer change without a full server
        restart.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIndexRebuildRequest"
      responses:
        "200":
          description: Rebuild completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIndexRebuildResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/index/reindex/{objectType}:
    post:
      operationId: adminIndexReindexByPath
      summary: Rebuild a Bleve index by path-style ObjectType (US-461)
      description: |
        REST-shaped sibling of `/api/admin/indexes/rebuild`: the ObjectType
        API name travels in the URL path and the ontology API name travels in
        the `ontology` query parameter. Same rebuild machinery, same
        `{scopedKey, indexedCount}` response, same 503 fallback when no
        Bleve backend is configured.
      tags: [Admin]
      parameters:
        - in: path
          name: objectType
          required: true
          schema:
            type: string
          description: ObjectType API name to reindex.
        - in: query
          name: ontology
          required: true
          schema:
            type: string
          description: Ontology API name that owns the ObjectType.
      responses:
        "200":
          description: Rebuild completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIndexRebuildResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/funnel/dlq:
    get:
      operationId: adminFunnelDLQList
      summary: List dead-lettered EditBatch envelopes (US-470)
      description: |
        Lists pending entries in the `OBJECT_EDITS_DLQ` JetStream stream so
        operators can inspect what failed and triage replay vs. discard.
        Returns the per-entry envelope plus the authoritative `size` field
        (used by `weave_funnel_dlq_size`). Gated behind `user.manage`; 503
        when NATS isn't configured.
      tags: [Admin]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of entries to return.
      responses:
        "200":
          description: Pending DLQ entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFunnelDLQListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/side-effect-dlq:
    get:
      operationId: adminSideEffectDLQList
      summary: List pending failed-after-retries side-effect dispatches (Gap-A4 round 34)
      description: |
        Lists pending entries in the `action_log_side_effect_dlq`
        table — one row per side-effect dispatch whose retry budget
        (set in round 30) was exhausted. The admin UI consumes this
        to render an operator-actionable inbox. Gated behind
        `user.manage`. 503 when the OMS repository isn't wired.
      tags: [Admin]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of entries to return.
      responses:
        "200":
          description: Pending DLQ entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSideEffectDLQListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/side-effect-dlq/{id}/abandon:
    post:
      operationId: adminSideEffectDLQAbandon
      summary: Flip a side-effect DLQ row to `abandoned` (Gap-A4 round 34)
      description: |
        Marks a pending side-effect DLQ row as `abandoned` — the
        operator's "reviewed and will not replay" signal. Idempotent
        on rows already in `abandoned`. Returns 409 Conflict when the
        row is in `replayed` status (can't mask a successful dispatch).
        Gated behind `user.manage`.
      tags: [Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: BIGSERIAL primary key of the DLQ row.
      responses:
        "200":
          description: Row flipped to abandoned (or already there).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSideEffectDLQAbandonResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/side-effect-dlq/{id}/replay:
    post:
      operationId: adminSideEffectDLQReplay
      summary: Re-dispatch a failed side-effect from the DLQ (Gap-A4 round 35)
      description: |
        Loads the snapshotted `effect_config` plus the linked
        `action_logs` row, reconstructs an `ActionResult`, and fires
        the webhook through the round-30 retry loop. Persists the
        per-attempt outcome to the DLQ row (bumps `replay_count`,
        stamps `replayed_at`). On success flips `replay_status` to
        `replayed` (terminal); on failure stays `pending` so the
        operator can try again later.

        HTTP 200 means the replay MACHINERY ran. The webhook's actual
        success/failure is encoded inside `outcome.status` — a 200
        response with `replayed: false` + `outcome.status: "failed"`
        means "we dispatched but the target is still broken".

        Returns 409 when the row is not in `pending` status (already
        replayed or abandoned). Returns 404 when either the DLQ row
        or its linked `action_log` row is missing. Gated behind
        `user.manage`.
      tags: [Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: BIGSERIAL primary key of the DLQ row.
      responses:
        "200":
          description: Replay machinery ran (webhook may still have failed — see outcome.status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSideEffectDLQReplayResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/funnel/dlq/{id}/replay:
    post:
      operationId: adminFunnelDLQReplay
      summary: Replay a dead-lettered EditBatch (US-470)
      description: |
        Republishes the DLQ entry's `originalData` onto its
        `originalSubject` (the live edits subject) and removes the entry
        from the DLQ stream so dashboards and the
        `weave_funnel_dlq_size` gauge reflect the drain. Publish failure
        leaves the entry in place so operators can retry. 503 when the
        publisher isn't wired.
      tags: [Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Stream sequence id returned by the list endpoint.
      responses:
        "200":
          description: Entry replayed and removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFunnelDLQReplayResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/tokens/{jti}/revoke:
    post:
      operationId: adminAuthRevokeToken
      summary: Revoke a JWT access token by jti (US-491)
      description: |
        Inserts the supplied jti into the `auth_revoked_tokens` blacklist so
        subsequent requests carrying that token are rejected with
        `401 TokenRevoked` even when the token's signature and `exp` claim
        are still valid. The middleware fronts the table with a 30s TTL
        cache; the admin handler invalidates the cache for the affected jti
        so same-process callers observe the revoke on the very next request.
        Gated behind `user.manage`. Returns 503 when the process boots
        without a PG-backed RevocationStore (degraded mode).
      tags: [Admin]
      parameters:
        - in: path
          name: jti
          required: true
          schema:
            type: string
          description: The JWT ID (`jti` claim) of the access token to revoke.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthRevokeRequest"
      responses:
        "200":
          description: Token added to the revocation blacklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthRevokeResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InternalError"
  /api/admin/auth/keys/rotate:
    post:
      operationId: adminAuthKeysRotate
      summary: Rotate the JWT signing keyring (US-490)
      description: |
        Generates a fresh RSA-2048 keypair and appends it to the in-memory
        JWT signing keyring. The new key becomes the active signing key
        immediately; tokens previously minted under older keys keep
        verifying because every kid in the ring participates in `Verify()`
        until those tokens reach their natural expiration. Gated behind
        `user.manage`. 503 when the process is running without a configured
        signer (degraded boot / dev-without-keys).
      tags: [Admin]
      responses:
        "200":
          description: Rotation completed; the response carries the new active kid plus the full ordered keyring.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthKeysRotateResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InternalError"
  /api/admin/funnel/dlq/{id}/discard:
    post:
      operationId: adminFunnelDLQDiscard
      summary: Discard a dead-lettered EditBatch without replaying (US-470)
      description: |
        Removes the DLQ entry without republishing it; useful when the
        underlying ObjectType has been retired or the payload is
        unrecoverable. 404 when the id is unknown.
      tags: [Admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Stream sequence id returned by the list endpoint.
      responses:
        "200":
          description: Entry removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFunnelDLQDiscardResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
