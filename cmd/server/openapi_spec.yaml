openapi: 3.0.3
info:
  title: Weave Ontology API
  version: 1.0.0
  description: |
    Weave is a single-machine Ontology Layer engine aligned with Palantir Foundry OSv2.
    This document describes its REST API: ontology metadata, object retrieval and
    search, ObjectSet composition, aggregation, link traversal, action execution,
    and authentication.
  license:
    name: Proprietary
servers:
  - url: http://localhost:9117
    description: Local development (port configurable via WEAVE_PORT).
tags:
  - name: Health
    description: Liveness/readiness probes.
  - name: Observability
    description: Prometheus metrics scrape endpoint.
  - name: Auth
    description: JWT login, refresh, and logout.
  - name: Metadata
    description: Read-only ontology metadata (V2).
  - name: Objects
    description: Object retrieval, search, listing, and link traversal.
  - name: ObjectSets
    description: Composable object set definitions and aggregation.
  - name: Actions
    description: Apply and apply-batch action execution.
  - name: MCP
    description: |
      Model Context Protocol (JSON-RPC 2.0) endpoint for AI agents.
      See https://modelcontextprotocol.io/specification for the protocol
      contract; Weave's tool catalogue is documented in docs/mcp.md.
  - name: SqlQueries
    description: |
      Foundry-aligned read-only SQL query execution. Single top-level
      resource (NOT scoped under an ontology). Only single-statement
      SELECT queries are accepted; non-SELECT statements are rejected
      before reaching the engine.
  - name: Admin
    description: |
      Operator-only administrative endpoints, gated to admin-level roles.
      Covers disruptive actions like rebuilding per-ObjectType Bleve
      indexes from the authoritative object_history tail.
  - name: Vertex
    description: Upper-layer graph, scenario, and operator-control surfaces.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256-signed JWT issued via /api/auth/login. Send as
        `Authorization: Bearer <token>`.
    apiKey:
      type: apiKey
      in: header
      name: X-Weave-Api-Key
      description: Reserved for future API-key-based service-to-service auth.
  responses:
    BadRequestError:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The caller is authenticated but lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDeniedError:
      description: The caller does not have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    OntologyApiName:
      in: path
      name: ontologyApiName
      required: true
      description: API name (or RID) of the ontology.
      schema:
        type: string
    ObjectTypeApiName:
      in: path
      name: objectTypeApiName
      required: true
      description: API name of the object type.
      schema:
        type: string
    ObjectType:
      in: path
      name: objectType
      required: true
      description: API name of the object type.
      schema:
        type: string
    PrimaryKey:
      in: path
      name: primaryKey
      required: true
      description: Primary key of the object.
      schema:
        type: string
    ActionTypeRid:
      in: path
      name: actionTypeRid
      required: true
      description: Resource identifier (or API name) of the action type.
      schema:
        type: string
    InterfaceType:
      in: path
      name: interfaceType
      required: true
      description: API name or RID of the interface type.
      schema:
        type: string
    InterfaceLinkType:
      in: path
      name: interfaceLinkType
      required: true
      description: API name of the interface link type.
      schema:
        type: string
    ValueType:
      in: path
      name: valueType
      required: true
      description: API name or RID of the value type.
      schema:
        type: string
    PreviewRequired:
      in: query
      name: preview
      required: true
      description: Must be set to "true" for preview endpoints.
      schema:
        type: string
        enum: ["true"]
  schemas:
    ErrorResponse:
      type: object
      description: Palantir-style API error envelope.
      required: [errorCode, errorName, errorInstanceId, parameters]
      properties:
        errorCode:
          type: string
          example: NOT_FOUND
        errorName:
          type: string
          example: OntologyNotFound
        errorInstanceId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties:
            type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    FunctionRepoCommit:
      type: object
      description: |
        One commit in the per-Function bare git repository (US-415).
      required: [hash, message, author, email, authorDate]
      properties:
        hash:
          type: string
          description: Content-addressable git commit hash (40-character SHA-1).
        message:
          type: string
        author:
          type: string
        email:
          type: string
        authorDate:
          type: string
          format: date-time
    CommitJob:
      type: object
      description: |
        One CI run for a Function code-repo commit (US-417). The lint and
        test phases are reported via `status` plus per-phase output strings;
        the SPA renders a ✅/❌ badge next to the commit hash from `status`
        alone, with the output strings surfaced in a tooltip / drawer.
      required: [id, functionRid, commitSha, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        functionRid:
          type: string
        commitSha:
          type: string
        status:
          type: string
          enum: [queued, running, success, failure, skipped]
        lintOutput:
          type: string
        testOutput:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Ontology:
      type: object
      required: [rid, apiName, displayName, currentVersion]
      properties:
        rid:
          type: string
          example: ri.ontology.main.ontology.northwind
        apiName:
          type: string
          example: northwind
        displayName:
          type: string
        description:
          type: string
        currentVersion:
          type: integer
    ObjectType:
      type: object
      required: [rid, apiName, displayName, primaryKey, status, visibility]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
          description: |
            Legacy single-field primary key (the first element of `primaryKeys`
            for composite-key ObjectTypes). Always present.
        primaryKeys:
          type: array
          description: |
            Composite primary key (US-211). Ordered list of property apiNames
            that together uniquely identify an object. Single-element arrays
            are equivalent to `primaryKey`. Composite-key objects are
            addressed by colon-joined values:
            `/objects/{objectType}/{key1}:{key2}`.
          items:
            type: string
          minItems: 1
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
        icon:
          type: string
        color:
          type: string
        deprecatedReason:
          type: string
        deprecatedDeadline:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PropertyDataType"
        extendsRid:
          type: string
          description: |
            Optional parent ObjectType RID (US-212 inheritance). Parent
            properties and outgoing links are merged into the child via the
            `/resolved` endpoint. Cycles are rejected at write time.
    CreateObjectTypeRequest:
      type: object
      required: [apiName, displayName]
      description: |
        Either `primaryKey` (legacy) or `primaryKeys` (US-211 composite) must be
        supplied. If both are present, `primaryKeys` wins and `primaryKey` is
        rewritten to `primaryKeys[0]`.
      properties:
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
        primaryKeys:
          type: array
          items:
            type: string
          minItems: 1
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
          enum: [PROMINENT, NORMAL, HIDDEN]
        extendsRid:
          type: string
          description: |
            Optional parent ObjectType RID (US-212). Must reference an existing
            ObjectType in the same ontology and not introduce an inheritance
            cycle.
    UpdateObjectTypeRequest:
      type: object
      properties:
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
          enum: [PROMINENT, NORMAL, HIDDEN]
        iconName:
          type: string
        color:
          type: string
        deprecatedReason:
          type: string
        deprecatedDeadline:
          type: string
          format: date-time
          nullable: true
        extendsRid:
          type: string
          nullable: true
          description: |
            Optional parent ObjectType RID (US-212). Pass an empty string to
            clear the parent pointer; omit the field to leave it unchanged.
    PropertyDataType:
      type: object
      properties:
        dataType:
          type: object
          additionalProperties: true
        rid:
          type: string
    Property:
      type: object
      required: [rid, apiName, baseType]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        status:
          type: string
        deprecatedReason:
          type: string
        sharedPropertyRid:
          type: string
        editOnly:
          type: boolean
          description: |
            When true, user edits on this property always win over concurrent
            ingest edits regardless of the active conflict-resolution strategy.
            Added in US-025 / US-026 and consumed by the funnel consumer's
            always-apply path (US-027).
    PropertyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    CreatePropertyRequest:
      type: object
      required: [apiName, baseType]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        editOnly:
          type: boolean
    UpdatePropertyRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        isNullable:
          type: boolean
        status:
          type: string
        deprecatedReason:
          type: string
        editOnly:
          type: boolean
    TypeGroup:
      type: object
      description: |
        A user-defined grouping of ObjectTypes (e.g. "People",
        "Finance"). Used by SDKs and the SPA to drive
        category-aware navigation in ontology explorers. The
        wire shape matches the in-process pkg/oms.TypeGroup
        struct used by the OMS repo.
      required: [rid, apiName, displayName]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        color:
          type: string
    SharedProperty:
      type: object
      description: |
        A reusable property definition that can be attached to multiple
        ObjectTypes (and surfaced inside interface fullMetadata). The
        wire shape matches the in-process pkg/oms.SharedProperty struct
        used by the OMS repo.
      required: [rid, apiName, baseType]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
    LinkType:
      type: object
      required: [rid, apiName, displayName, objectTypeApiName, linkedObjectTypeApiName, cardinality, required]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        objectTypeApiName:
          type: string
        linkedObjectTypeApiName:
          type: string
        cardinality:
          type: string
        foreignKeyConfig:
          type: object
          additionalProperties: true
        joinTableConfig:
          type: object
          additionalProperties: true
        required:
          type: boolean
    CreateLinkTypeRequest:
      type: object
      required: [apiName, displayName, objectTypeApiName, linkedObjectTypeApiName, cardinality]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        objectTypeApiName:
          type: string
          description: apiName of the source ObjectType.
        linkedObjectTypeApiName:
          type: string
          description: apiName of the target ObjectType.
        cardinality:
          type: string
          enum: [ONE_TO_ONE, ONE_TO_MANY, MANY_TO_MANY]
        foreignKeyConfig:
          type: object
          additionalProperties: true
          description: Foreign key configuration, relevant for ONE_TO_* cardinalities.
        joinTableConfig:
          type: object
          additionalProperties: true
          description: Join table configuration, relevant for MANY_TO_MANY cardinality.
        required:
          type: boolean
    UpdateLinkTypeRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        required:
          type: boolean
          nullable: true
    CreateActionTypeRequest:
      type: object
      required: [apiName, displayName]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          description: "Internal stored format: array of {id, type, required, description}. Passed through as JSON."
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          description: "Array of rule objects. Each rule has a `type` field (createObject, modifyObject, deleteObject, createLink, deleteLink, createOrModifyObject, createInterfaceObject, modifyInterfaceObject, deleteInterfaceObject) plus type-specific fields."
          type: array
          items:
            type: object
            additionalProperties: true
        implementsMethodRid:
          description: "US-214: RID of an InterfaceMethod this ActionType implements."
          type: string
        compensateActionRid:
          description: "US-239: RID of another ActionType whose rules compensate this action during a saga rollback. Must live in the same ontology; self-reference is rejected."
          type: string
    UpdateActionTypeRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        submissionCriteria:
          type: array
          items:
            type: object
            additionalProperties: true
        sideEffects:
          type: array
          items:
            type: object
            additionalProperties: true
        implementsMethodRid:
          description: "US-214: tri-state pointer. Omit to preserve, empty string to clear, RID to assign."
          type: string
        compensateActionRid:
          description: "US-239: tri-state pointer for the saga compensator. Omit to preserve, empty string to clear, RID to assign (partner must live in the same ontology and must not self-reference)."
          type: string
    ActionType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          type: object
          description: "Record<ParameterId, ActionParameterV2>"
          additionalProperties:
            $ref: '#/components/schemas/ActionParameterV2'
        rules:
          type: object
          additionalProperties: true
        submissionCriteria:
          type: object
          additionalProperties: true
        sideEffects:
          type: object
          additionalProperties: true
        functionRid:
          type: string
        isFunctionBacked:
          type: boolean
        implementsMethodRid:
          description: "US-214: RID of an InterfaceMethod this ActionType implements, if any."
          type: string
        compensateActionRid:
          description: "US-239: RID of the saga-compensating ActionType, if any."
          type: string
        requiresApproval:
          description: "US-242: when true, apply requests enqueue an ActionApproval instead of executing rules until reviewed."
          type: boolean
        approvers:
          description: "US-242: snapshot of role names or user IDs eligible to approve requests for this ActionType."
          type: array
          items:
            type: string
        branchId:
          description: "US-384: ontology branch this ActionType row belongs to. Defaults to 'main'. A branch publishing its own version of the same apiName stamps the branch name here so the (ontology, apiName, branch) UNIQUE constraint keeps the rows independent."
          type: string
    ActionParameterV2:
      type: object
      required: [dataType, required]
      properties:
        dataType:
          type: object
          description: "DataType object, e.g. {type: 'string'} or {type: 'array', subType: {type: 'string'}}"
          properties:
            type:
              type: string
          additionalProperties: true
        required:
          type: boolean
        description:
          type: string
    Interface:
      type: object
      required: [rid, apiName, displayName]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: object
          additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    InterfaceLinkType:
      type: object
      required: [apiName, displayName, linkedEntityTypeApiName, cardinality, required]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        linkedEntityTypeApiName:
          type: string
        linkedEntityTypeRid:
          type: string
        cardinality:
          type: string
          enum: [ONE, MANY]
        required:
          type: boolean
        description:
          type: string
    CreateInterfaceRequest:
      type: object
      required: [apiName, displayName]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: array
          items:
            type: object
            additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    UpdateInterfaceRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: array
          items:
            type: object
            additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    AttachInterfaceRequest:
      type: object
      required: [interfaceRid]
      properties:
        interfaceRid:
          type: string
        propertyMapping:
          type: object
          additionalProperties:
            type: string
    ObjectTypeInterface:
      type: object
      required: [objectTypeRid, interfaceRid]
      properties:
        objectTypeRid:
          type: string
        interfaceRid:
          type: string
        propertyMapping:
          type: object
          additionalProperties:
            type: string
    InterfaceMethodParam:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        default: {}
    InterfaceMethodReturns:
      type: object
      required: [type]
      properties:
        type:
          type: string
    InterfaceMethod:
      type: object
      required: [rid, interfaceRid, name, params, returns]
      properties:
        rid:
          type: string
        interfaceRid:
          type: string
        name:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceMethodParam"
        returns:
          $ref: "#/components/schemas/InterfaceMethodReturns"
        description:
          type: string
    CreateInterfaceMethodRequest:
      type: object
      required: [name, returns]
      properties:
        name:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceMethodParam"
        returns:
          $ref: "#/components/schemas/InterfaceMethodReturns"
        description:
          type: string
    UpdateInterfaceMethodRequest:
      type: object
      required: [name, returns]
      properties:
        name:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceMethodParam"
        returns:
          $ref: "#/components/schemas/InterfaceMethodReturns"
        description:
          type: string
    InvokeInterfaceMethodRequest:
      type: object
      required: [objectType]
      properties:
        objectType:
          type: string
        parameters:
          type: object
          additionalProperties: true
    InvokeInterfaceMethodResponse:
      type: object
      required: [actionTypeRid, actionTypeApiName, objectType, methodRid]
      properties:
        actionTypeRid:
          type: string
        actionTypeApiName:
          type: string
        objectType:
          type: string
        methodRid:
          type: string
        result:
          type: object
          additionalProperties: true
    QueryType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        query:
          type: object
          additionalProperties: true
        status:
          type: string
    Function:
      type: object
      required: [rid, name, version, sourceCode]
      properties:
        rid:
          type: string
        name:
          type: string
        version:
          type: string
          description: |
            Semver string ("MAJOR.MINOR.PATCH" with optional "-PRE"). Multiple
            versions of the same name coexist (US-217); list endpoints sort
            latest-first within each name.
          example: "1.0.0"
        sourceCode:
          type: string
        runtime:
          type: string
          enum: [goja, http]
          description: Execution runtime. Defaults to "goja" when omitted.
        signature:
          type: object
          description: |
            JSON schema describing params + returns. Empty / absent means no
            contract is declared and the runtime validator is skipped.
          properties:
            params:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  type: { type: string }
                  required: { type: boolean }
                  default: {}
            returns:
              type: object
              required: [type]
              properties:
                type: { type: string }
        pure:
          type: boolean
          default: false
          description: |
            US-221: when true the execute endpoint may serve repeat calls
            with identical params from a per-process LRU+TTL cache (10k
            entries, 5-minute TTL). Defaults to false so impure functions
            (those that read external state, the wall clock, or mutate
            shared state) keep their original "always re-run" semantics.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        branchId:
          description: "US-384: ontology branch this Function version belongs to. Defaults to 'main'. Branch v2 of a function coexists with main v1 because the (ontology, name, version, branch) UNIQUE constraint is keyed on the branch as well."
          type: string
        dependsOn:
          type: array
          items:
            type: string
          description: |
            US-425: ObjectType API names whose live state the Function reads.
            When non-empty, an EditBatch touching any listed ObjectType drops
            every cached result keyed on this Function's RID — `pure=true`
            Functions whose output is conditional on object data cannot serve
            stale answers past the next mutation. Empty / omitted keeps the
            legacy "TTL only" behaviour from US-221.
    OntologyBranch:
      type: object
      required: [id, ontologyRid, name, baseVersion, status, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        ontologyRid:
          type: string
        name:
          type: string
        baseVersion:
          type: integer
          format: int64
        parentBranchId:
          type: string
          description: |
            US-383 — optional pointer at another branch in the same ontology.
            Reads on this branch fall back through the parent's overlay before
            consulting main. Empty / omitted means the parent is the canonical
            "main" trunk.
        baseTx:
          type: string
          description: |
            US-383 — optional dataset_transactions tx_id checkpoint pinning the
            branch to a specific point in the underlying dataset history.
            Empty means HEAD at branch creation.
        status:
          type: string
          description: |
            Lowercase canonical form is open|merged|closed. The PRD-style
            uppercase aliases ACTIVE|MERGED|ABANDONED are accepted on input
            and normalised on store.
          enum: [open, merged, closed]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OntologyBranchDetail:
      allOf:
        - $ref: "#/components/schemas/OntologyBranch"
        - type: object
          properties:
            changeCount:
              type: integer
              description: Number of changes recorded on this branch.
    BranchDiffEntry:
      type: object
      required: [entityType, entityRid, changeType]
      properties:
        entityType:
          type: string
          description: The type of entity changed (objectType, property, linkType, actionType).
        entityRid:
          type: string
          description: The RID of the changed entity.
        changeType:
          type: string
          enum: [ADDED, MODIFIED, DELETED]
        before:
          type: object
          nullable: true
          description: State before the change (null for ADDED).
        after:
          type: object
          nullable: true
          description: State after the change (null for DELETED).
    BreakingChange:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - PROPERTY_DELETED
            - PROPERTY_TYPE_NARROWED
            - PROPERTY_REQUIRED_ADDED
            - PRIMARY_KEY_CHANGED
        objectTypeRid:
          type: string
        objectTypeApiName:
          type: string
        propertyApiName:
          type: string
        detail:
          type: string
        affectedActionTypes:
          type: array
          items:
            type: string
          description: RIDs of ActionTypes whose rules reference the affected schema.
        affectedSavedObjectSets:
          type: array
          items:
            type: string
          description: IDs of SavedObjectSets whose definition references the affected schema.
    BreakingChangesReport:
      type: object
      required: [branchId, changes]
      properties:
        branchId:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BreakingChange"
    OntologyProposal:
      type: object
      required: [id, branchId, ontologyRid, title, status, author, createdAt, updatedAt]
      properties:
        id:
          type: string
        branchId:
          type: string
        ontologyRid:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, merged]
        author:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OntologyProposalDetail:
      allOf:
        - $ref: "#/components/schemas/OntologyProposal"
        - type: object
          properties:
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/ProposalReview"
    ProposalReview:
      type: object
      required: [id, proposalId, reviewer, decision, createdAt]
      properties:
        id:
          type: string
        proposalId:
          type: string
        reviewer:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required: [reviewer]
      properties:
        reviewer:
          type: string
          description: ID of the reviewer. Must not be the proposal author.
        reason:
          type: string
          description: Reason for the decision (required for reject, optional for approve).
    MergeConflict:
      type: object
      properties:
        entityType:
          type: string
          description: Type of conflicting entity (objectType, property, linkType, actionType).
        entityRid:
          type: string
          description: RID of the conflicting entity.
        changeType:
          type: string
          enum: [MODIFIED, DELETED]
          description: Type of change that conflicts.
        branchState:
          type: object
          description: The branch's recorded before-state of the entity.
        mainState:
          type: object
          description: The current state of the entity on main.
    AnnotatedDiffEntry:
      type: object
      required: [entityType, entityRid, apiName, resolutionKey, changeType, hasConflict]
      description: |
        US-385 — categorised branch diff entry annotated with the entity's
        apiName and the "<entityType>:<apiName>" resolutionKey the merge
        handler looks up against MergeBranchRequest.conflictResolution.
      properties:
        entityType:
          type: string
          description: One of objectType / property / linkType / actionType.
        entityRid:
          type: string
        apiName:
          type: string
          description: Entity apiName extracted from after_state (or before_state for DELETED).
        resolutionKey:
          type: string
          description: Stable conflictResolution key, "<entityType>:<apiName>".
        changeType:
          type: string
          enum: [ADDED, MODIFIED, DELETED]
        hasConflict:
          type: boolean
          description: True when main has independently modified the same entity.
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
    AnnotatedMergeConflict:
      type: object
      required: [entityType, entityRid, apiName, resolutionKey, changeType]
      description: |
        US-385 — extends MergeConflict with apiName + resolutionKey. The
        resolutionKey ("<entityType>:<apiName>") is the lookup key the merge
        handler expects in MergeBranchRequest.conflictResolution.
      properties:
        entityType:
          type: string
        entityRid:
          type: string
        apiName:
          type: string
        resolutionKey:
          type: string
        changeType:
          type: string
          enum: [MODIFIED, DELETED]
        branchState:
          type: object
        mainState:
          type: object
    BranchDiffPostResponse:
      type: object
      required: [branch, added, modified, deleted, conflicts, hasConflicts]
      description: |
        US-385 — response body of POST /branches/{branchId}/diff. Categorises
        every recorded BranchChange into added / modified / deleted lists and
        surfaces the inline conflict set computed against current main state.
      properties:
        branch:
          $ref: "#/components/schemas/OntologyBranch"
        added:
          type: array
          items:
            $ref: "#/components/schemas/AnnotatedDiffEntry"
        modified:
          type: array
          items:
            $ref: "#/components/schemas/AnnotatedDiffEntry"
        deleted:
          type: array
          items:
            $ref: "#/components/schemas/AnnotatedDiffEntry"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AnnotatedMergeConflict"
        hasConflicts:
          type: boolean
    MergeBranchRequest:
      type: object
      description: |
        US-385 — body for POST /branches/{branchId}/merge. The
        conflictResolution map keys are stable resolutionKey strings of the
        form "<entityType>:<apiName>"; values are "use-branch" or "use-main".
        Conflicts whose key is absent from the map cause a 409 MERGE_CONFLICT
        response so the caller never silently merges over an unresolved
        conflict.
      properties:
        conflictResolution:
          type: object
          additionalProperties:
            type: string
            enum: [use-branch, use-main]
    MergeBranchResponse:
      type: object
      required: [branch, appliedCount, skippedCount]
      description: |
        US-385 — response body of POST /branches/{branchId}/merge. The
        applied/skipped counts let the caller verify that "use-main"
        resolutions were honoured (skipped > 0) without re-fetching the
        branch state.
      properties:
        branch:
          $ref: "#/components/schemas/OntologyBranch"
        appliedCount:
          type: integer
        skippedCount:
          type: integer
    ValueType:
      type: object
      required: [rid, apiName, displayName, baseType, version]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        baseType:
          type: string
        constraints:
          type: object
          additionalProperties: true
        version:
          type: integer
    CreateValueTypeRequest:
      type: object
      required: [apiName, displayName, baseType]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        baseType:
          type: string
        constraints:
          type: object
          additionalProperties: true
    UpdateValueTypeRequest:
      type: object
      required: [displayName, baseType]
      properties:
