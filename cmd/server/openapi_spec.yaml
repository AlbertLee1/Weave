openapi: 3.0.3
info:
  title: Weave Ontology API
  version: 1.0.0
  description: |
    Weave is a single-machine Ontology Layer engine aligned with Palantir Foundry OSv2.
    This document describes its REST API: ontology metadata, object retrieval and
    search, ObjectSet composition, aggregation, link traversal, action execution,
    and authentication.
  license:
    name: Proprietary
servers:
  - url: http://localhost:9117
    description: Local development (port configurable via WEAVE_PORT).
tags:
  - name: Health
    description: Liveness/readiness probes.
  - name: Observability
    description: Prometheus metrics scrape endpoint.
  - name: Auth
    description: JWT login, refresh, and logout.
  - name: Metadata
    description: Read-only ontology metadata (V2).
  - name: Objects
    description: Object retrieval, search, listing, and link traversal.
  - name: ObjectSets
    description: Composable object set definitions and aggregation.
  - name: Actions
    description: Apply and apply-batch action execution.
  - name: MCP
    description: |
      Model Context Protocol (JSON-RPC 2.0) endpoint for AI agents.
      See https://modelcontextprotocol.io/specification for the protocol
      contract; Weave's tool catalogue is documented in docs/mcp.md.
  - name: SqlQueries
    description: |
      Foundry-aligned read-only SQL query execution. Single top-level
      resource (NOT scoped under an ontology). Only single-statement
      SELECT queries are accepted; non-SELECT statements are rejected
      before reaching the engine.
  - name: Admin
    description: |
      Operator-only administrative endpoints, gated to admin-level roles.
      Covers disruptive actions like rebuilding per-ObjectType Bleve
      indexes from the authoritative object_history tail.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256-signed JWT issued via /api/auth/login. Send as
        `Authorization: Bearer <token>`.
    apiKey:
      type: apiKey
      in: header
      name: X-Weave-Api-Key
      description: Reserved for future API-key-based service-to-service auth.
  responses:
    BadRequestError:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The caller is authenticated but lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDeniedError:
      description: The caller does not have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    OntologyApiName:
      in: path
      name: ontologyApiName
      required: true
      description: API name (or RID) of the ontology.
      schema:
        type: string
    ObjectTypeApiName:
      in: path
      name: objectTypeApiName
      required: true
      description: API name of the object type.
      schema:
        type: string
    ObjectType:
      in: path
      name: objectType
      required: true
      description: API name of the object type.
      schema:
        type: string
    PrimaryKey:
      in: path
      name: primaryKey
      required: true
      description: Primary key of the object.
      schema:
        type: string
    ActionTypeRid:
      in: path
      name: actionTypeRid
      required: true
      description: Resource identifier (or API name) of the action type.
      schema:
        type: string
    InterfaceType:
      in: path
      name: interfaceType
      required: true
      description: API name or RID of the interface type.
      schema:
        type: string
    InterfaceLinkType:
      in: path
      name: interfaceLinkType
      required: true
      description: API name of the interface link type.
      schema:
        type: string
    ValueType:
      in: path
      name: valueType
      required: true
      description: API name or RID of the value type.
      schema:
        type: string
    PreviewRequired:
      in: query
      name: preview
      required: true
      description: Must be set to "true" for preview endpoints.
      schema:
        type: string
        enum: ["true"]
  schemas:
    ErrorResponse:
      type: object
      description: Palantir-style API error envelope.
      required: [errorCode, errorName, errorInstanceId, parameters]
      properties:
        errorCode:
          type: string
          example: NOT_FOUND
        errorName:
          type: string
          example: OntologyNotFound
        errorInstanceId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties:
            type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Ontology:
      type: object
      required: [rid, apiName, displayName, currentVersion]
      properties:
        rid:
          type: string
          example: ri.ontology.main.ontology.northwind
        apiName:
          type: string
          example: northwind
        displayName:
          type: string
        description:
          type: string
        currentVersion:
          type: integer
    ObjectType:
      type: object
      required: [rid, apiName, displayName, primaryKey, status, visibility]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
          description: |
            Legacy single-field primary key (the first element of `primaryKeys`
            for composite-key ObjectTypes). Always present.
        primaryKeys:
          type: array
          description: |
            Composite primary key (US-211). Ordered list of property apiNames
            that together uniquely identify an object. Single-element arrays
            are equivalent to `primaryKey`. Composite-key objects are
            addressed by colon-joined values:
            `/objects/{objectType}/{key1}:{key2}`.
          items:
            type: string
          minItems: 1
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
        icon:
          type: string
        color:
          type: string
        deprecatedReason:
          type: string
        deprecatedDeadline:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PropertyDataType"
        extendsRid:
          type: string
          description: |
            Optional parent ObjectType RID (US-212 inheritance). Parent
            properties and outgoing links are merged into the child via the
            `/resolved` endpoint. Cycles are rejected at write time.
    CreateObjectTypeRequest:
      type: object
      required: [apiName, displayName]
      description: |
        Either `primaryKey` (legacy) or `primaryKeys` (US-211 composite) must be
        supplied. If both are present, `primaryKeys` wins and `primaryKey` is
        rewritten to `primaryKeys[0]`.
      properties:
        apiName:
          type: string
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        primaryKey:
          type: string
        primaryKeys:
          type: array
          items:
            type: string
          minItems: 1
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
          enum: [PROMINENT, NORMAL, HIDDEN]
        extendsRid:
          type: string
          description: |
            Optional parent ObjectType RID (US-212). Must reference an existing
            ObjectType in the same ontology and not introduce an inheritance
            cycle.
    UpdateObjectTypeRequest:
      type: object
      properties:
        displayName:
          type: string
        pluralDisplayName:
          type: string
        description:
          type: string
        titleProperty:
          type: string
        status:
          type: string
          enum: [ACTIVE, ENDORSED, EXPERIMENTAL, DEPRECATED]
        visibility:
          type: string
          enum: [PROMINENT, NORMAL, HIDDEN]
        iconName:
          type: string
        color:
          type: string
        deprecatedReason:
          type: string
        deprecatedDeadline:
          type: string
          format: date-time
          nullable: true
        extendsRid:
          type: string
          nullable: true
          description: |
            Optional parent ObjectType RID (US-212). Pass an empty string to
            clear the parent pointer; omit the field to leave it unchanged.
    PropertyDataType:
      type: object
      properties:
        dataType:
          type: object
          additionalProperties: true
        rid:
          type: string
    Property:
      type: object
      required: [rid, apiName, baseType]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        status:
          type: string
        deprecatedReason:
          type: string
        sharedPropertyRid:
          type: string
        editOnly:
          type: boolean
          description: |
            When true, user edits on this property always win over concurrent
            ingest edits regardless of the active conflict-resolution strategy.
            Added in US-025 / US-026 and consumed by the funnel consumer's
            always-apply path (US-027).
    PropertyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    CreatePropertyRequest:
      type: object
      required: [apiName, baseType]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        baseType:
          type: string
        typeConfig:
          type: object
          additionalProperties: true
        isArray:
          type: boolean
        isNullable:
          type: boolean
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        editOnly:
          type: boolean
    UpdatePropertyRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        isSearchable:
          type: boolean
        isSortable:
          type: boolean
        isNullable:
          type: boolean
        status:
          type: string
        deprecatedReason:
          type: string
        editOnly:
          type: boolean
    LinkType:
      type: object
      required: [rid, apiName, displayName, objectTypeApiName, linkedObjectTypeApiName, cardinality, required]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        objectTypeApiName:
          type: string
        linkedObjectTypeApiName:
          type: string
        cardinality:
          type: string
        foreignKeyConfig:
          type: object
          additionalProperties: true
        joinTableConfig:
          type: object
          additionalProperties: true
        required:
          type: boolean
    CreateLinkTypeRequest:
      type: object
      required: [apiName, displayName, objectTypeApiName, linkedObjectTypeApiName, cardinality]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        objectTypeApiName:
          type: string
          description: apiName of the source ObjectType.
        linkedObjectTypeApiName:
          type: string
          description: apiName of the target ObjectType.
        cardinality:
          type: string
          enum: [ONE_TO_ONE, ONE_TO_MANY, MANY_TO_MANY]
        foreignKeyConfig:
          type: object
          additionalProperties: true
          description: Foreign key configuration, relevant for ONE_TO_* cardinalities.
        joinTableConfig:
          type: object
          additionalProperties: true
          description: Join table configuration, relevant for MANY_TO_MANY cardinality.
        required:
          type: boolean
    UpdateLinkTypeRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        required:
          type: boolean
          nullable: true
    CreateActionTypeRequest:
      type: object
      required: [apiName, displayName]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          description: "Internal stored format: array of {id, type, required, description}. Passed through as JSON."
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          description: "Array of rule objects. Each rule has a `type` field (createObject, modifyObject, deleteObject, createLink, deleteLink, createOrModifyObject, createInterfaceObject, modifyInterfaceObject, deleteInterfaceObject) plus type-specific fields."
          type: array
          items:
            type: object
            additionalProperties: true
        implementsMethodRid:
          description: "US-214: RID of an InterfaceMethod this ActionType implements."
          type: string
    UpdateActionTypeRequest:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        submissionCriteria:
          type: array
          items:
            type: object
            additionalProperties: true
        sideEffects:
          type: array
          items:
            type: object
            additionalProperties: true
        implementsMethodRid:
          description: "US-214: tri-state pointer. Omit to preserve, empty string to clear, RID to assign."
          type: string
    ActionType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
        parameters:
          type: object
          description: "Record<ParameterId, ActionParameterV2>"
          additionalProperties:
            $ref: '#/components/schemas/ActionParameterV2'
        rules:
          type: object
          additionalProperties: true
        submissionCriteria:
          type: object
          additionalProperties: true
        sideEffects:
          type: object
          additionalProperties: true
        functionRid:
          type: string
        isFunctionBacked:
          type: boolean
        implementsMethodRid:
          description: "US-214: RID of an InterfaceMethod this ActionType implements, if any."
          type: string
    ActionParameterV2:
      type: object
      required: [dataType, required]
      properties:
        dataType:
          type: object
          description: "DataType object, e.g. {type: 'string'} or {type: 'array', subType: {type: 'string'}}"
          properties:
            type:
              type: string
          additionalProperties: true
        required:
          type: boolean
        description:
          type: string
    Interface:
      type: object
      required: [rid, apiName, displayName]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: object
          additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    InterfaceLinkType:
      type: object
      required: [apiName, displayName, linkedEntityTypeApiName, cardinality, required]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        linkedEntityTypeApiName:
          type: string
        linkedEntityTypeRid:
          type: string
        cardinality:
          type: string
          enum: [ONE, MANY]
        required:
          type: boolean
        description:
          type: string
    CreateInterfaceRequest:
      type: object
      required: [apiName, displayName]
      properties:
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: array
          items:
            type: object
            additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    UpdateInterfaceRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        extendsRid:
          type: string
        sharedProperties:
          type: array
          items:
            type: object
            additionalProperties: true
        outgoingLinkTypes:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceLinkType"
    AttachInterfaceRequest:
      type: object
      required: [interfaceRid]
      properties:
        interfaceRid:
          type: string
        propertyMapping:
          type: object
          additionalProperties:
            type: string
    ObjectTypeInterface:
      type: object
      required: [objectTypeRid, interfaceRid]
      properties:
        objectTypeRid:
          type: string
        interfaceRid:
          type: string
        propertyMapping:
          type: object
          additionalProperties:
            type: string
    InterfaceMethodParam:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        default: {}
    InterfaceMethodReturns:
      type: object
      required: [type]
      properties:
        type:
          type: string
    InterfaceMethod:
      type: object
      required: [rid, interfaceRid, name, params, returns]
      properties:
        rid:
          type: string
        interfaceRid:
          type: string
        name:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceMethodParam"
        returns:
          $ref: "#/components/schemas/InterfaceMethodReturns"
        description:
          type: string
    CreateInterfaceMethodRequest:
      type: object
      required: [name, returns]
      properties:
        name:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceMethodParam"
        returns:
          $ref: "#/components/schemas/InterfaceMethodReturns"
        description:
          type: string
    UpdateInterfaceMethodRequest:
      type: object
      required: [name, returns]
      properties:
        name:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceMethodParam"
        returns:
          $ref: "#/components/schemas/InterfaceMethodReturns"
        description:
          type: string
    InvokeInterfaceMethodRequest:
      type: object
      required: [objectType]
      properties:
        objectType:
          type: string
        parameters:
          type: object
          additionalProperties: true
    InvokeInterfaceMethodResponse:
      type: object
      required: [actionTypeRid, actionTypeApiName, objectType, methodRid]
      properties:
        actionTypeRid:
          type: string
        actionTypeApiName:
          type: string
        objectType:
          type: string
        methodRid:
          type: string
        result:
          type: object
          additionalProperties: true
    QueryType:
      type: object
      required: [rid, apiName, displayName, status]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        query:
          type: object
          additionalProperties: true
        status:
          type: string
    Function:
      type: object
      required: [rid, name, version, sourceCode]
      properties:
        rid:
          type: string
        name:
          type: string
        version:
          type: string
          description: |
            Semver string ("MAJOR.MINOR.PATCH" with optional "-PRE"). Multiple
            versions of the same name coexist (US-217); list endpoints sort
            latest-first within each name.
          example: "1.0.0"
        sourceCode:
          type: string
        runtime:
          type: string
          enum: [goja, http]
          description: Execution runtime. Defaults to "goja" when omitted.
        signature:
          type: object
          description: |
            JSON schema describing params + returns. Empty / absent means no
            contract is declared and the runtime validator is skipped.
          properties:
            params:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  type: { type: string }
                  required: { type: boolean }
                  default: {}
            returns:
              type: object
              required: [type]
              properties:
                type: { type: string }
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    OntologyBranch:
      type: object
      required: [id, ontologyRid, name, baseVersion, status, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        ontologyRid:
          type: string
        name:
          type: string
        baseVersion:
          type: integer
          format: int64
        status:
          type: string
          enum: [open, merged, closed]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OntologyBranchDetail:
      allOf:
        - $ref: "#/components/schemas/OntologyBranch"
        - type: object
          properties:
            changeCount:
              type: integer
              description: Number of changes recorded on this branch.
    BranchDiffEntry:
      type: object
      required: [entityType, entityRid, changeType]
      properties:
        entityType:
          type: string
          description: The type of entity changed (objectType, property, linkType, actionType).
        entityRid:
          type: string
          description: The RID of the changed entity.
        changeType:
          type: string
          enum: [ADDED, MODIFIED, DELETED]
        before:
          type: object
          nullable: true
          description: State before the change (null for ADDED).
        after:
          type: object
          nullable: true
          description: State after the change (null for DELETED).
    BreakingChange:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - PROPERTY_DELETED
            - PROPERTY_TYPE_NARROWED
            - PROPERTY_REQUIRED_ADDED
            - PRIMARY_KEY_CHANGED
        objectTypeRid:
          type: string
        objectTypeApiName:
          type: string
        propertyApiName:
          type: string
        detail:
          type: string
        affectedActionTypes:
          type: array
          items:
            type: string
          description: RIDs of ActionTypes whose rules reference the affected schema.
        affectedSavedObjectSets:
          type: array
          items:
            type: string
          description: IDs of SavedObjectSets whose definition references the affected schema.
    BreakingChangesReport:
      type: object
      required: [branchId, changes]
      properties:
        branchId:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BreakingChange"
    OntologyProposal:
      type: object
      required: [id, branchId, ontologyRid, title, status, author, createdAt, updatedAt]
      properties:
        id:
          type: string
        branchId:
          type: string
        ontologyRid:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, merged]
        author:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OntologyProposalDetail:
      allOf:
        - $ref: "#/components/schemas/OntologyProposal"
        - type: object
          properties:
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/ProposalReview"
    ProposalReview:
      type: object
      required: [id, proposalId, reviewer, decision, createdAt]
      properties:
        id:
          type: string
        proposalId:
          type: string
        reviewer:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required: [reviewer]
      properties:
        reviewer:
          type: string
          description: ID of the reviewer. Must not be the proposal author.
        reason:
          type: string
          description: Reason for the decision (required for reject, optional for approve).
    MergeConflict:
      type: object
      properties:
        entityType:
          type: string
          description: Type of conflicting entity (objectType, property, linkType, actionType).
        entityRid:
          type: string
          description: RID of the conflicting entity.
        changeType:
          type: string
          enum: [MODIFIED, DELETED]
          description: Type of change that conflicts.
        branchState:
          type: object
          description: The branch's recorded before-state of the entity.
        mainState:
          type: object
          description: The current state of the entity on main.
    ValueType:
      type: object
      required: [rid, apiName, displayName, baseType, version]
      properties:
        rid:
          type: string
        apiName:
          type: string
        displayName:
          type: string
        baseType:
          type: string
        constraints:
          type: object
          additionalProperties: true
        version:
          type: integer
    ActionLog:
      type: object
