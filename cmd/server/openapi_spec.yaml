        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    LoadObjectSetV2MultipleObjectTypesResponse:
      type: object
      description: |
        Preview response envelope used by loadObjectsMultipleObjectTypes and
        loadObjectsOrInterfaces. Each data item is a flat object whose keys
        include the requested properties plus $rid, $primaryKey and $apiName.
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Flat object with $rid/$primaryKey/$apiName plus selected properties.
        nextPageToken:
          type: string
        totalCount:
          type: string
        totalCountAccuracy:
          type: string
          enum: [EXACT, APPROXIMATE]
    LoadLinksRequest:
      type: object
