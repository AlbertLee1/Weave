      description: |
        Foundry 1:1 alignment — mirrors GET /objectTypes/{objectTypeApiName}.
        SDKs hit this endpoint after a search response surfaces a
        linkType api name they need to render. Without it, callers
        fall back to ListLinkTypes + client-side filter on every
        call. {linkType} is the API name (bare slug); RID-keyed
        mutations remain on /linkTypes/byRid/{linkTypeRid}.
