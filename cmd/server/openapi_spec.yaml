  /api/v2/ontologies/{ontologyApiName}/links/{linkTypeRid}/edges/{sourcePk}/{targetPk}/properties:
    put:
      operationId: putLinkEdgeProperties
      summary: Upsert edge property values
      description: |
        Replaces the `edge_properties` JSONB for the (linkTypeRid, sourcePk,
        targetPk) edge. Values are validated against the LinkType's declared
        link-property schema — unknown keys are rejected and non-nullable
        properties must be present. If no edge row exists the endpoint
        upserts one (US-210).
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/OntologyApiName"
        - in: path
          name: linkTypeRid
          required: true
          schema:
            type: string
        - in: path
          name: sourcePk
          required: true
          schema:
            type: string
        - in: path
          name: targetPk
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Edge with updated properties.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
