[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-runtime"
version = "0.1.0"
description = "Weave Vertex Python function runtime — FastAPI + pydantic sandbox sidecar"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Weave Vertex" }]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.5,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["weave_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
