[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-client"
version = "0.1.0"
description = "Python client for the Weave ontology engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "Weave Contributors" },
]
keywords = ["weave", "ontology", "palantir", "foundry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ws = [
    # Required for AsyncObjectsAPI.subscribe (US-418). Not included in the
    # base install so HTTP-only consumers don't pay the dep cost.
    "websockets>=11.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "websockets>=11.0",
]

[project.urls]
Repository = "https://github.com/liyang/weave"

[tool.setuptools.packages.find]
include = ["weave_client*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
