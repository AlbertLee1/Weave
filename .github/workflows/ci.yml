name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, lint, test, vulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --timeout=5m

      - name: Test (with race + coverage)
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # US-362: Pact-style consumer-driven contract tests. Surfaced as a
      # dedicated CI step (rather than relying on the implicit `go test ./...`
      # pass above) so a failing consumer interaction is unambiguously
      # attributed to SDK / web-client contract drift in the build log.
      - name: Contract tests (Pact-style)
        run: make test-contract

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Vitest (with coverage)
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      # US-444: Playwright spec discovery gate. The full E2E suite needs
      # a live backend stack (`make e2e-up`) and runs locally; this step
      # invokes Playwright in list-only mode so syntactic regressions in
      # any spec under `web/e2e/us444/` fail CI without booting Docker.
      - name: Playwright spec discovery (us444)
        run: npx playwright test --list us444/

      - name: Upload web coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: warn
          retention-days: 14
