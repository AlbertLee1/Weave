name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # US-056: coverage gate needs `pull-requests: write` to post the per-PR
  # report as a comment when the gate fails. `issues: write` covers the
  # comment-creation API surface in older runners.
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, lint, test, vulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history (and origin/main) so golangci-lint can compute
          # merge-base for --new-from-merge-base. The action's own
          # `only-new-issues: true` falls back to the GH PR diff API, which
          # 406s on PRs > 300 changed files (Weave's Ralph self-iteration
          # batches routinely exceed that), silently turning the lint job
          # into "report every pre-existing issue on main".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build $(./scripts/ci/go-packages.sh --build)

      - name: Vet
        run: go vet $(./scripts/ci/go-packages.sh)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          # Use golangci-lint's own merge-base diff so the new-issue gate
          # works regardless of PR size; the action's `only-new-issues`
          # fetches the GH PR patch which 406s above 300 changed files.
          args: --timeout=5m --new-from-merge-base=origin/main

      - name: Test (with race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic $(./scripts/ci/go-packages.sh)

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # US-056 / PC-C13: coverage gate. Reuses the cover-profile produced
      # by the previous step (./... is a superset of ./pkg/..., the
      # covercheck floor is scoped to the packages declared in
      # coverage/thresholds.json — extras in coverage.out are reported
      # but not enforced). Enforces per-package floor (oms 80% /
      # oss/objectset 80% / actions 75% / pagination 85% / apierror 90%)
      # and the baseline-regression budget (defaultMaxDrop=2.0pp) from
      # coverage/baseline.json. The markdown summary lands at
      # coverage/report.md; the next step posts it on the PR so
      # reviewers see the regressing packages without opening the CI
      # log. `continue-on-error: true` defers the job-fail decision to
      # the "Fail if coverage gate failed" step further down — that way
      # the PR comment is always posted before the workflow stops.
      - name: Coverage gate (covercheck)
        id: cover_gate
        if: always()
        continue-on-error: true
        run: |
          mkdir -p coverage
          go run ./cmd/covercheck \
            -profile coverage.out \
            -thresholds coverage/thresholds.json \
            -baseline coverage/baseline.json \
            -md coverage/report.md \
            -output coverage/report.json

      - name: Coverage gate report (PR comment)
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('coverage/report.md') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'coverage/report.md'), 'utf8');
            const marker = '<!-- covercheck:us056 -->';
            const tagged = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.pull_request.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body: tagged });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: tagged });
            }

      - name: Fail if coverage gate failed
        if: ${{ steps.cover_gate.outcome == 'failure' }}
        run: |
          echo "::error::coverage gate failed; see PR comment / coverage/report.md"
          exit 1

      - name: Upload coverage gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/report.md
            coverage/report.json
          if-no-files-found: warn
          retention-days: 14

      # US-362, US-445: Pact-style consumer-driven contract tests covering
      # the four-language SDK fan-out (py / ts / go / java) plus the SPA
      # client. Surfaced as a dedicated CI step (rather than relying on the
      # implicit `go test ./...` pass above) so a failing consumer
      # interaction is unambiguously attributed to SDK / web-client contract
      # drift in the build log. The same gate pulls in `cmd/weave-pact/...`
      # so a regression in the Pact Broker publish/list path is caught even
      # without booting an actual broker (broker integration runs locally
      # via `make pact-broker-up && make pact-publish`).
      - name: Contract tests (Pact-style)
        run: make test-contract

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: make vulncheck

      - name: Upload Go coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Vitest (with coverage)
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      # US-444 / SELF-434: Playwright spec discovery gate. The full E2E suite
      # needs a live backend stack (`make e2e-up`) and runs locally; this step
      # invokes Playwright in list-only mode so syntax/import regressions in
      # checked-in upper-layer probes fail CI without booting Docker.
      - name: Playwright spec discovery (upper-layer E2E)
        run: >
          npx playwright test --list
          us444/
          phase6/
          phase7/
          vtx-099-system-graph-render.spec.ts
          dogfood-verify.spec.ts
          dogfood-diagnose.spec.ts
          dogfood-empty-states.spec.ts
          tests/
          us-456-perf-dashboard.spec.ts
          us-457-timeseries-tab.spec.ts
          us-458-hotkey-help.spec.ts
          zzz-login-rate-limit.spec.ts

      - name: Upload web coverage
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: warn
          retention-days: 14
