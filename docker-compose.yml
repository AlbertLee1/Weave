services:
  postgres:
    # pgvector/pgvector:pg16 is postgres:16 with the pgvector extension
    # preinstalled. Migration 000011_object_embeddings.up.sql runs
    # `CREATE EXTENSION vector` which fails on the bare postgres:16
    # image and leaves schema_migrations in a dirty state. Keep this
    # image in lockstep with internal/testutil.StartPGContainer so
    # local dev and `go test -tags integration` share the same schema.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "nats-server --help > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # TimescaleDB (Postgres 16 + the timescaledb extension preloaded) backs the
  # VTX-028+ Vertex object time series surface (pkg/timeseries, migration
  # 000106). The host port is mapped to 5433 so it can run alongside the
  # primary `postgres` service on 5432 without collision — point
  # WEAVE_TS_BACKEND=postgres + a TimescaleDB DSN at this service to use it.
  # The image must match internal/testutil.StartTimescaleDBContainer so local
  # dev and `go test -tags integration` see the same hypertable schema.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave_timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescaledata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave"]
      interval: 5s
      timeout: 3s
      retries: 5

  # function-runtime is the in-stack HTTP target for the Tier 3.2
  # function-backed action dispatcher (US-215 / pkg/actions/http_dispatcher).
  # The cmd/weave-function-runtime binary ships a permissive no-op stub by
  # default — every POST /functions/{rid} returns `{"edits": []}` — which
  # keeps local dev and CI smoke tests working without operators having to
  # author real function code. Production deployments should swap this
  # container for a real runtime (goja sandbox, V8 isolate, language worker)
  # that speaks the same FunctionRequest / FunctionResponse contract.
  function-runtime:
    build:
      context: .
      dockerfile: Dockerfile.function-runtime
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # VictoriaMetrics single-node deployment for the optional pkg/timeseries
  # backend (US-400). Disabled by default — the weave service only routes
  # /api/v2/.../timeseries/{property}/points to VictoriaMetrics when
  # WEAVE_TS_BACKEND=victoriametrics + WEAVE_TS_URL=http://victoriametrics:8428
  # are set. Stays out of the way for environments that prefer the in-memory
  # or PG backends.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=12"
      - "-httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/storage
    # VictoriaMetrics ships as a distroless image (no wget/curl/sh), so the
    # earlier wget-based healthcheck always failed under `docker compose up
    # --wait`. Nothing in this compose file depends_on its health — the SPA
    # admin dashboards probe /metrics directly via the weave API — so leave
    # the healthcheck unset rather than fight the lack of a shell.

  weave:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9117:9117"
    environment:
      PG_DSN: "postgres://weave:weave@postgres:5432/weave?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      WEAVE_DATA_DIR: "/app/data"
      AUTH_MODE: "dev"
      # VTX-124: route function-backed actions to the in-stack runtime so
      # `docker compose up` boots a working Tier 3.2 dispatcher path. The
      # dispatcher itself is opt-in via WEAVE_FUNCTIONS_ENABLED=true — left
      # off by default so dev environments without function code don't pay
      # the per-call HTTP cost.
      WEAVE_FUNCTIONS_BASE_URL: "http://function-runtime:9000/functions"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      function-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - weavedata:/app/data

  # MailHog captures outbound SMTP for the US-429 dev-mode delivery
  # path. The weave service routes notification emails here when
  # WEAVE_SMTP_HOST=mailhog + WEAVE_SMTP_PORT=1025. Web UI lives on
  # :8025 so developers can inspect every captured message without
  # configuring a real inbox. Disabled by default — start explicitly
  # with `docker compose up mailhog` and export the SMTP envs to see
  # emails.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # Prometheus scrapes the weave /metrics endpoint every 15s. The scrape
  # config is mounted read-only from grafana/prometheus.yml so a change to
  # the file in the repo is picked up on the next `docker compose up`.
  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rule files (see alerts/weave.yml). prometheus.yml's
      # rule_files glob points at /etc/prometheus/rules/*.yml so adding
      # a new file under ./alerts is picked up on restart.
      - ./alerts:/etc/prometheus/rules:ro
      - promdata:/prometheus
    depends_on:
      weave:
        condition: service_started

  # Grafana auto-provisions the Prometheus datasource and loads the
  # weave-slo.json dashboard via the provisioning folder. Default admin
  # credentials stay admin/admin — operators running in prod should override
  # GF_SECURITY_ADMIN_PASSWORD at `docker compose up` time.
  grafana:
    image: grafana/grafana:10.4.5
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    # weave-slo.json is the default SLO dashboard shipped with the repo; it
    # appears under the "Weave" folder as soon as the container starts.

  # Pact Broker for the US-445 multi-language SDK contract gate. Disabled
  # by default — start with `docker compose --profile pact up -d` so the
  # default `make docker-up` flow stays lean. Web UI on :9292 lets
  # operators browse the contract matrix; pact-broker-postgres is its own
  # backing store kept off the main `postgres` volume to avoid mixing
  # ontology data with broker bookkeeping.
  pact-broker-postgres:
    image: postgres:16-alpine
    profiles: ["pact"]
    environment:
      POSTGRES_USER: pactbroker
      POSTGRES_PASSWORD: pactbroker
      POSTGRES_DB: pactbroker
    volumes:
      - pactbrokerdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactbroker"]
      interval: 5s
      timeout: 3s
      retries: 5

  pact-broker:
    image: pactfoundation/pact-broker:2.116.1.0
    profiles: ["pact"]
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_USERNAME: pactbroker
      PACT_BROKER_DATABASE_PASSWORD: pactbroker
      PACT_BROKER_DATABASE_HOST: pact-broker-postgres
      PACT_BROKER_DATABASE_NAME: pactbroker
      PACT_BROKER_BASIC_AUTH_USERNAME: pactbroker
      PACT_BROKER_BASIC_AUTH_PASSWORD: pactbroker
      PACT_BROKER_LOG_LEVEL: WARN
      PACT_BROKER_PUBLIC_HEARTBEAT: "true"
    depends_on:
      pact-broker-postgres:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
  weavedata:
  promdata:
  grafanadata:
  vmdata:
  pactbrokerdata:
  timescaledata:
