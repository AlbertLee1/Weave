global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rule files are loaded from /etc/prometheus/rules — the directory
# mounted from ./alerts in docker-compose.yml. Adding a new YAML file under
# ./alerts is picked up on the next `docker compose up` without further
# wiring. See alerts/weave.yml for the canonical SLO/infra rules.
rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: weave
    metrics_path: /metrics
    static_configs:
      - targets: ["weave:9117"]
        labels:
          service: weave

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
