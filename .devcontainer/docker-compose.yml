services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave"]
      interval: 5s
      timeout: 3s
      retries: 5
    network_mode: host

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "nats-server --help > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    network_mode: host

volumes:
  pgdata:
  natsdata:
